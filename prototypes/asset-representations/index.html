<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #f3f0e8;
      color: #000;

      font-family: "IBM Plex Mono", monospace;
    }

    body {
      overflow-x: hidden;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #000;
      background: #f3f0e8;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
    }

    .header-title {
      font-size: 12px;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       INTRO
    ================================================== */

    .intro {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(28px, 5vw, 72px);

      text-align: center;
    }


    /* ==================================================
       MAIN SCROLL SYSTEM
    ================================================== */

    .asset-system {
      position: relative;

      height: 650vh;
    }

    .sticky-stage {
      position: sticky;

      top: 0;

      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* ==================================================
       ONE ASSET
    ================================================== */

    .one-asset-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, calc(-50% - 250px));

      font-size: clamp(28px, 5vw, 72px);

      text-align: center;
      white-space: nowrap;

      z-index: 6;
    }


    /* ==================================================
       LIBRARY CARD
    ================================================== */

    .asset-card {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(252px, 49vw);

      transform: translate(-50%, -50%);

      z-index: 5;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }


    /* ==================================================
       ARROW
       
       The arrow tip is initially fixed.
       The shaft connects directly to the tip.
    ================================================== */

    .arrow-system {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 0;

      transform: translateX(-50%);

      z-index: 4;

      opacity: 0;
    }

    .arrow-shaft {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 1px;
      height: 0;

      background: #000;
    }

    .arrow-head {
      position: absolute;

      left: 50%;
      bottom: -4px;

      width: 10px;
      height: 10px;

      border-right: 1px solid #000;
      border-bottom: 1px solid #000;

      transform:
        translate(-50%, 50%)
        rotate(45deg);
    }


    /* ==================================================
       MULTIPLE REPRESENTATIONS
    ================================================== */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 57%;

      transform:
        translate(-50%, -50%)
        rotateY(-90deg);

      font-size: clamp(18px, 3vw, 36px);

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;

      transform-style: preserve-3d;

      z-index: 3;
    }


    /* ==================================================
       REPRESENTATION
    ================================================== */

    .representation {
      position: absolute;

      left: 50%;
      top: 58%;

      width: min(620px, 76vw);

      opacity: 0;

      pointer-events: none;

      z-index: 2;
    }

    .representation-visual {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .representation-image {
      display: block;

      width: 70%;
      height: 70%;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       NEXT
    ================================================== */

    .next {
      min-height: 100vh;

      border-top: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(24px, 4vw, 56px);

      text-align: center;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 10px;
      }

      .intro {
        min-height: 100svh;

        font-size: 26px;
      }

      .asset-system {
        height: 650vh;
      }

      .sticky-stage {
        height: 100svh;
      }

      .one-asset-label {
        transform:
          translate(-50%, calc(-50% - 155px));

        font-size: 26px;
      }

      .asset-card {
        width: min(210px, 53vw);
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 20px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
        top: 59%;
      }

      .representation-visual {
        height: 48svh;
      }

      .representation-image {
        width: 70%;
        height: 70%;
      }

      .representation-info {
        margin-top: 12px;

        font-size: 10px;
      }

      .next {
        min-height: 100svh;

        font-size: 26px;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="logo">
    CUT2
  </div>

  <div class="header-title">
    Asset Representations
  </div>

</header>


<main>


  <!-- ==================================================
       INTRO
  ================================================== -->

  <section class="intro">

    <div>
      ONE PROJECT.<br>
      MULTIPLE PLATFORMS.
    </div>

  </section>



  <!-- ==================================================
       ASSET SYSTEM
  ================================================== -->

  <section class="asset-system">

    <div class="sticky-stage">


      <!-- ONE ASSET -->

      <div
        class="one-asset-label"
        id="oneAssetLabel"
      >
        ONE ASSET.
      </div>



      <!-- LIBRARY CARD -->

      <div
        class="asset-card"
        id="assetCard"
      >

        <img
          src="asset-representations/library-card.png?v=2"
          alt="CUT2 Asset Library"
        >

      </div>



      <!-- ARROW -->

      <div
        class="arrow-system"
        id="arrowSystem"
      >

        <div
          class="arrow-shaft"
          id="arrowShaft"
        ></div>

        <div class="arrow-head"></div>

      </div>



      <!-- MULTIPLE REPRESENTATIONS -->

      <div
        class="multiple-label"
        id="multipleLabel"
      >
        MULTIPLE REPRESENTATIONS
      </div>



      <!-- REPRESENTATION -->

      <div
        class="representation"
        id="representation"
      >

        <div
          class="representation-visual"
          id="representationVisual"
        >

          <img
            id="representationImage"
            class="representation-image"
            src="asset-representations/autocad/minimal.svg?v=2"
            alt="AutoCAD Minimal"
          >

        </div>


        <div class="representation-info">

          <span id="representationPlatform">
            AUTOCAD
          </span>

          <span id="representationType">
            MINIMAL
          </span>

        </div>

      </div>


    </div>

  </section>



  <!-- ==================================================
       NEXT
  ================================================== -->

  <section class="next">

    THE SYSTEM CONTINUES.

  </section>


</main>



<script>

  const assetCard =
    document.getElementById("assetCard");

  const oneAssetLabel =
    document.getElementById("oneAssetLabel");

  const arrowSystem =
    document.getElementById("arrowSystem");

  const arrowShaft =
    document.getElementById("arrowShaft");

  const multipleLabel =
    document.getElementById("multipleLabel");

  const representation =
    document.getElementById("representation");

  const representationVisual =
    document.getElementById("representationVisual");

  const representationImage =
    document.getElementById("representationImage");

  const representationPlatform =
    document.getElementById("representationPlatform");

  const representationType =
    document.getElementById("representationType");


  /* ==================================================
     REPRESENTATION DATA
  ================================================== */

  const representations = [

    {
      platform: "AUTOCAD",
      type: "MINIMAL",
      src: "asset-representations/autocad/minimal.svg?v=2"
    },

    {
      platform: "AUTOCAD",
      type: "CONDITIONAL",
      src: "asset-representations/autocad/conditional.svg?v=2"
    },

    {
      platform: "AUTOCAD",
      type: "REALISTIC",
      src: "asset-representations/autocad/realistic.svg?v=2"
    },

    {
      platform: "SKETCHUP",
      type: "REALISTIC FACE ME",
      src: "asset-representations/sketchup/realistic-face-me.png?v=2"
    },

    {
      platform: "SKETCHUP",
      type: "CONDITIONAL",
      src: "asset-representations/sketchup/conditional.png?v=2"
    },

    {
      platform: "INDESIGN",
      type: "IMAGE",
      src: "asset-representations/publishing/image.jpg?v=2"
    }

  ];


  /* ==================================================
     HELPERS
  ================================================== */

  function clamp(value, min, max) {

    return Math.max(
      min,
      Math.min(max, value)
    );

  }


  /* ==================================================
     ANIMATION
  ================================================== */

  function updateAnimation() {

    const section =
      document.querySelector(".asset-system");

    const rect =
      section.getBoundingClientRect();

    const scrollable =
      section.offsetHeight - window.innerHeight;

    const passed =
      clamp(
        -rect.top,
        0,
        scrollable
      );

    const progress =
      passed / scrollable;



    /* ==================================================
       1. ONE ASSET

       Stays above the card.
    ================================================== */

    oneAssetLabel.style.opacity = 1;



    /* ==================================================
       2. LIBRARY CARD

       Moves upward.
       No fade.
    ================================================== */

    const cardStart = 0.00;
    const cardEnd = 0.23;

    const cardProgress =
      clamp(
        (progress - cardStart) /
        (cardEnd - cardStart),
        0,
        1
      );

    const cardTravel =
      window.innerHeight * 0.95;

    const cardY =
      -cardProgress * cardTravel;

    assetCard.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${cardY}px)
        )
      `;

    assetCard.style.opacity = 1;



    /* ==================================================
       3. ARROW

       The arrow head starts at the center.

       The shaft grows toward the fixed head.

       After the label appears,
       the entire arrow moves upward together
       with the label.
    ================================================== */

    const arrowStart = 0.04;
    const arrowEnd = 0.25;

    const arrowProgress =
      clamp(
        (progress - arrowStart) /
        (arrowEnd - arrowStart),
        0,
        1
      );

    const arrowLength =
      window.innerHeight * 1.25;

    const arrowVisible =
      progress >= arrowStart &&
      progress < 0.54;

    arrowSystem.style.opacity =
      arrowVisible ? 1 : 0;

    arrowShaft.style.height =
      `${arrowProgress * arrowLength}px`;



    /* ==================================================
       4. MULTIPLE REPRESENTATIONS LABEL

       First rotates into view.

       Then arrow + label move upward together.
    ================================================== */

    const labelStart = 0.22;
    const labelRotateEnd = 0.34;

    const labelProgress =
      clamp(
        (progress - labelStart) /
        (labelRotateEnd - labelStart),
        0,
        1
      );

    const labelRotation =
      -90 +
      labelProgress * 90;


    /*
      Once the label is visible,
      the label and arrow travel upward together.
    */

    const moveStart = 0.34;
    const moveEnd = 0.43;

    const moveProgress =
      clamp(
        (progress - moveStart) /
        (moveEnd - moveStart),
        0,
        1
      );

    const labelShift =
      -moveProgress *
      window.innerHeight *
      0.27;


    multipleLabel.style.opacity =
      labelProgress;


    multipleLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${labelShift}px)
        )
        rotateY(${labelRotation}deg)
      `;


    arrowSystem.style.transform =
      `
        translateX(-50%)
        translateY(${labelShift}px)
      `;



    /* ==================================================
       5. REPRESENTATIONS

       The image rotates.

       The labels below remain completely still.

       The last representation stays open.
    ================================================== */

    const representationStart = 0.43;

    const representationEnd = 0.92;


    const representationProgress =
      clamp(
        (progress - representationStart) /
        (representationEnd - representationStart),
        0,
        1
      );


    if (progress >= representationStart) {

      representation.style.opacity = 1;


      const count =
        representations.length;


      const exactIndex =
        representationProgress *
        count;


      const index =
        Math.min(
          count - 1,
          Math.floor(exactIndex)
        );


      const localProgress =
        exactIndex - index;


      const current =
        representations[index];


      representationImage.src =
        current.src;

      representationImage.alt =
        `${current.platform} ${current.type}`;


      /*
        Change the text only when
        the active asset changes.

        The text itself never moves.
      */

      representationPlatform.textContent =
        current.platform;

      representationType.textContent =
        current.type;



      /*
        Final representation:

        stays fully open from 0.92
        until the sticky section ends.
      */

      const isLast =
        index === count - 1;


      if (isLast) {

        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(90deg)
            scale(1)
          `;

      } else {

        const rotation =
          -90 +
          localProgress * 180;


        const scale =
          0.92 +
          Math.sin(
            localProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

    } else {

      representation.style.opacity = 0;

    }



    requestAnimationFrame(updateAnimation);

  }


  updateAnimation();

</script>

</body>
</html>
