<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f0e8;
      color: #000;
      font-family: "IBM Plex Mono", monospace;
    }

    body {
      overflow-x: hidden;
    }

    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #000;
      background: #f3f0e8;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
    }

    .header-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       INTRO
    ================================================== */

    .intro {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(28px, 5vw, 72px);
      text-align: center;
    }


    /* ==================================================
       MAIN SCROLL SYSTEM
    ================================================== */

    .asset-system {
      position: relative;
      height: 650vh;
    }

    .sticky-stage {
      position: sticky;
      top: 0;

      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* ==================================================
       LIBRARY CARD
    ================================================== */

    .asset-card {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(360px, 70vw);

      transform: translate(-50%, -50%);

      z-index: 5;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }

    .asset-label {
      margin-top: 12px;

      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       ARROW
       
       The arrow tip is fixed at the center.
       Only the shaft grows upward.
    ================================================== */

    .arrow-system {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 0;

      transform: translateX(-50%);

      z-index: 4;

      opacity: 0;
    }

    .arrow-shaft {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 1px;
      height: 0;

      background: #000;

      transform: translateY(0);
    }

    .arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 10px;

      border-right: 1px solid #000;
      border-bottom: 1px solid #000;

      transform:
        translate(-50%, 50%)
        rotate(45deg);
    }


    /* ==================================================
       MULTIPLE REPRESENTATIONS
    ================================================== */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%)
        rotateY(-90deg);

      font-size: clamp(18px, 3vw, 36px);

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;

      transform-style: preserve-3d;

      z-index: 3;
    }


    /* ==================================================
       REPRESENTATIONS
    ================================================== */

    .representation {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(620px, 76vw);

      transform-style: preserve-3d;
      transform-origin: center center;

      opacity: 0;

      pointer-events: none;

      z-index: 2;
    }

    .representation-image {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .representation-image img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       NEXT
    ================================================== */

    .next {
      min-height: 100vh;

      border-top: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(24px, 4vw, 56px);
      text-align: center;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 10px;
      }

      .intro {
        min-height: 100svh;

        font-size: 26px;
      }

      .asset-system {
        height: 650vh;
      }

      .sticky-stage {
        height: 100svh;
      }

      .asset-card {
        width: min(300px, 76vw);
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 20px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
      }

      .representation-image {
        height: 48svh;
      }

      .representation-info {
        margin-top: 12px;
        font-size: 10px;
      }

      .next {
        min-height: 100svh;
        font-size: 26px;
      }
    }

  </style>
</head>


<body>

<header>
  <div class="logo">CUT2</div>
  <div class="header-title">Asset Representations</div>
</header>


<main>


  <!-- ==================================================
       INTRO
  ================================================== -->

  <section class="intro">

    <div>
      ONE PROJECT.<br>
      MULTIPLE PLATFORMS.
    </div>

  </section>



  <!-- ==================================================
       ASSET SYSTEM
  ================================================== -->

  <section class="asset-system">

    <div class="sticky-stage">


      <!-- LIBRARY CARD -->

      <div
        class="asset-card"
        id="assetCard"
      >

        <img
          src="asset-representations/library-card.png"
          alt="CUT2 Asset Library"
        >

        <div class="asset-label">
          ONE ASSET
        </div>

      </div>



      <!-- ARROW -->

      <div
        class="arrow-system"
        id="arrowSystem"
      >

        <div
          class="arrow-shaft"
          id="arrowShaft"
        ></div>

        <div class="arrow-head"></div>

      </div>



      <!-- MULTIPLE REPRESENTATIONS -->

      <div
        class="multiple-label"
        id="multipleLabel"
      >
        MULTIPLE REPRESENTATIONS
      </div>



      <!-- REPRESENTATION -->

      <div
        class="representation"
        id="representation"
      >

        <div class="representation-image">

          <img
            id="representationImage"
            src="asset-representations/autocad/minimal.svg"
            alt="AutoCAD Minimal"
          >

        </div>


        <div class="representation-info">

          <span id="representationPlatform">
            AUTOCAD
          </span>

          <span id="representationType">
            MINIMAL
          </span>

        </div>

      </div>


    </div>

  </section>



  <!-- ==================================================
       NEXT
  ================================================== -->

  <section class="next">

    THE SYSTEM CONTINUES.

  </section>


</main>



<script>

  const assetCard =
    document.getElementById("assetCard");

  const arrowSystem =
    document.getElementById("arrowSystem");

  const arrowShaft =
    document.getElementById("arrowShaft");

  const multipleLabel =
    document.getElementById("multipleLabel");

  const representation =
    document.getElementById("representation");

  const representationImage =
    document.getElementById("representationImage");

  const representationPlatform =
    document.getElementById("representationPlatform");

  const representationType =
    document.getElementById("representationType");


  /* ==================================================
     REPRESENTATION DATA
  ================================================== */

  const representations = [

    {
      platform: "AUTOCAD",
      type: "MINIMAL",
      src: "asset-representations/autocad/minimal.svg"
    },

    {
      platform: "AUTOCAD",
      type: "CONDITIONAL",
      src: "asset-representations/autocad/conditional.svg"
    },

    {
      platform: "AUTOCAD",
      type: "REALISTIC",
      src: "asset-representations/autocad/realistic.svg"
    },

    {
      platform: "SKETCHUP",
      type: "CONDITIONAL",
      src: "asset-representations/sketchup/conditional.png"
    },

    {
      platform: "SKETCHUP",
      type: "REALISTIC FACE ME",
      src: "asset-representations/sketchup/realistic-face-me.png"
    },

    {
      platform: "INDESIGN",
      type: "IMAGE",
      src: "asset-representations/publishing/image.jpg"
    }

  ];


  /* ==================================================
     HELPERS
  ================================================== */

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }


  /* ==================================================
     ANIMATION
  ================================================== */

  function updateAnimation() {

    const section =
      document.querySelector(".asset-system");

    const rect =
      section.getBoundingClientRect();

    const scrollable =
      section.offsetHeight - window.innerHeight;

    const passed =
      clamp(-rect.top, 0, scrollable);

    const progress =
      passed / scrollable;



    /* ==================================================
       1. LIBRARY CARD

       Moves upward.
       NO FADE.
    ================================================== */

    const cardStart = 0.00;
    const cardEnd = 0.23;

    const cardProgress =
      clamp(
        (progress - cardStart) /
        (cardEnd - cardStart),
        0,
        1
      );


    const cardTravel =
      window.innerHeight * 0.95;


    const cardY =
      -cardProgress * cardTravel;


    assetCard.style.transform =
      `
        translate(-50%, calc(-50% + ${cardY}px))
      `;

    assetCard.style.opacity = 1;



    /* ==================================================
       2. ARROW

       The arrow head NEVER moves.

       It stays at the center.

       Only the shaft grows upward
       from the fixed head.
    ================================================== */

    const arrowStart = 0.05;
    const arrowEnd = 0.23;

    const arrowProgress =
      clamp(
        (progress - arrowStart) /
        (arrowEnd - arrowStart),
        0,
        1
      );


    const arrowLength =
      window.innerHeight * 1.25;


    arrowSystem.style.opacity =
      arrowProgress > 0 && progress < 0.30
        ? 1
        : 0;


    arrowShaft.style.height =
      `${arrowProgress * arrowLength}px`;



    /* ==================================================
       3. MULTIPLE REPRESENTATIONS

       Rotates into view from the side.
    ================================================== */

    const labelStart = 0.22;
    const labelEnd = 0.34;

    const labelProgress =
      clamp(
        (progress - labelStart) /
        (labelEnd - labelStart),
        0,
        1
      );


    const labelRotation =
      -90 + labelProgress * 90;


    multipleLabel.style.opacity =
      labelProgress;


    multipleLabel.style.transform =
      `
        translate(-50%, -50%)
        rotateY(${labelRotation}deg)
      `;



    /* ==================================================
       4. REPRESENTATIONS

       Six representations.
       Each one rotates through the same
       central axis.
    ================================================== */

    const representationStart = 0.34;
    const representationEnd = 0.94;

    const representationProgress =
      clamp(
        (progress - representationStart) /
        (representationEnd - representationStart),
        0,
        1
      );


    if (representationProgress > 0) {

      representation.style.opacity = 1;


      const count =
        representations.length;


      const exactIndex =
        representationProgress * count;


      const index =
        Math.min(
          count - 1,
          Math.floor(exactIndex)
        );


      const localProgress =
        exactIndex - index;


      const current =
        representations[index];


      representationImage.src =
        current.src;


      representationPlatform.textContent =
        current.platform;


      representationType.textContent =
        current.type;



      /*
        Every representation starts edge-on,
        rotates toward the viewer,
        then becomes edge-on again.
      */

      const rotation =
        -90 + localProgress * 180;


      const scale =
        0.92 +
        Math.sin(localProgress * Math.PI) * 0.08;


      representation.style.transform =
        `
          translate(-50%, -50%)
          perspective(1200px)
          rotateY(${rotation}deg)
          scale(${scale})
        `;

    } else {

      representation.style.opacity = 0;

    }


    requestAnimationFrame(updateAnimation);

  }


  updateAnimation();

</script>

</body>
</html>
