```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f0e8;
      color: #000;
      font-family: "IBM Plex Mono", monospace;
    }

    body {
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;

      background: #f3f0e8;
      border-bottom: 1px solid #000;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
    }

    .header-title {
      font-size: 12px;
      text-transform: uppercase;
    }

    .intro {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(28px, 5vw, 72px);
      text-align: center;
    }

    .asset-system {
      height: 650vh;
      position: relative;
    }

    .sticky-stage {
      position: sticky;
      top: 0;

      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /* ASSET CARD */

    .asset-card {
      position: absolute;

      width: min(360px, 70vw);

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
    }

    .asset-card img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #000;
    }

    .asset-label {
      margin-top: 12px;

      font-size: 12px;
      text-transform: uppercase;
    }

    /* CONNECTOR */

    .connector {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 0;

      background: #000;

      transform: translateX(-50%);

      opacity: 0;
    }

    .connector-arrow {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 9px;
      height: 9px;

      border-right: 1px solid #000;
      border-bottom: 1px solid #000;

      transform: translate(-50%, 50%) rotate(45deg);
    }

    /* LABEL */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      font-size: clamp(18px, 3vw, 36px);

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;
    }

    /* REPRESENTATIONS */

    .representation {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(620px, 76vw);

      transform-style: preserve-3d;
      transform-origin: center center;

      opacity: 0;
      pointer-events: none;
    }

    .representation-image {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .representation-image img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      text-transform: uppercase;
    }

    .next {
      min-height: 100vh;

      border-top: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(24px, 4vw, 56px);
      text-align: center;
    }

    /* --------------------------------------------------
       MOBILE
    -------------------------------------------------- */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 10px;
      }

      .intro {
        min-height: 100svh;
        padding: 20px;

        font-size: 26px;
      }

      .asset-system {
        height: 600vh;
      }

      .sticky-stage {
        height: 100svh;
      }

      .asset-card {
        width: min(300px, 76vw);
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 20px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
      }

      .representation-image {
        height: 48svh;
      }

      .representation-info {
        font-size: 10px;
        margin-top: 12px;
      }

      .next {
        min-height: 100svh;
        padding: 20px;

        font-size: 26px;
      }
    }

  </style>
</head>


<body>

<header>
  <div class="logo">CUT2</div>
  <div class="header-title">Asset Representations</div>
</header>


<main>

  <section class="intro">
    <div>
      ONE PROJECT.<br>
      MULTIPLE PLATFORMS.
    </div>
  </section>


  <section class="asset-system">

    <div class="sticky-stage">

      <!-- ASSET -->

      <div class="asset-card" id="assetCard">

        <img
          src="asset-representations/library-card.png"
          alt="CUT2 Asset Library"
        >

        <div class="asset-label">
          ONE ASSET
        </div>

      </div>


      <!-- CONNECTOR -->

      <div class="connector" id="connector">
        <div class="connector-arrow"></div>
      </div>


      <!-- LABEL -->

      <div
        class="multiple-label"
        id="multipleLabel"
      >
        MULTIPLE REPRESENTATIONS
      </div>


      <!-- REPRESENTATION -->

      <div
        class="representation"
        id="representation"
      >

        <div class="representation-image">
          <img
            id="representationImage"
            src="asset-representations/autocad/minimal.svg"
            alt="AutoCAD Minimal"
          >
        </div>

        <div class="representation-info">
          <span id="representationPlatform">
            AUTOCAD
          </span>

          <span id="representationType">
            MINIMAL
          </span>
        </div>

      </div>

    </div>

  </section>


  <section class="next">
    THE SYSTEM CONTINUES.
  </section>

</main>


<script>

  const assetCard =
    document.getElementById("assetCard");

  const connector =
    document.getElementById("connector");

  const multipleLabel =
    document.getElementById("multipleLabel");

  const representation =
    document.getElementById("representation");

  const representationImage =
    document.getElementById("representationImage");

  const representationPlatform =
    document.getElementById("representationPlatform");

  const representationType =
    document.getElementById("representationType");


  const representations = [

    {
      platform: "AUTOCAD",
      type: "MINIMAL",
      src: "asset-representations/autocad/minimal.svg"
    },

    {
      platform: "AUTOCAD",
      type: "CONDITIONAL",
      src: "asset-representations/autocad/conditional.svg"
    },

    {
      platform: "AUTOCAD",
      type: "REALISTIC",
      src: "asset-representations/autocad/realistic.svg"
    },

    {
      platform: "SKETCHUP",
      type: "CONDITIONAL",
      src: "asset-representations/sketchup/conditional.png"
    },

    {
      platform: "SKETCHUP",
      type: "REALISTIC FACE ME",
      src: "asset-representations/sketchup/realistic-face-me.png"
    },

    {
      platform: "INDESIGN",
      type: "IMAGE",
      src: "asset-representations/indesign/image.jpg"
    }

  ];


  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }


  function updateAnimation() {

    const section =
      document.querySelector(".asset-system");

    const rect =
      section.getBoundingClientRect();

    const scrollable =
      section.offsetHeight - window.innerHeight;

    const passed =
      clamp(-rect.top, 0, scrollable);

    const progress =
      passed / scrollable;


    /* ----------------------------------------------
       ASSET CARD
    ---------------------------------------------- */

    const cardProgress =
      clamp(
        progress / 0.16,
        0,
        1
      );

    const cardY =
      -cardProgress * 140;

    assetCard.style.transform =
      `translate(-50%, calc(-50% + ${cardY}px))`;

    assetCard.style.opacity =
      1 - cardProgress;


    /* ----------------------------------------------
       CONNECTOR
    ---------------------------------------------- */

    const connectorProgress =
      clamp(
        (progress - 0.10) / 0.14,
        0,
        1
      );

    connector.style.height =
      `${connectorProgress * 150}px`;

    connector.style.opacity =
      progress < 0.28
        ? connectorProgress
        : 0;


    /* ----------------------------------------------
       MULTIPLE REPRESENTATIONS
    ---------------------------------------------- */

    const labelProgress =
      clamp(
        (progress - 0.23) / 0.11,
        0,
        1
      );

    multipleLabel.style.opacity =
      labelProgress;


    /* ----------------------------------------------
       REPRESENTATIONS
    ---------------------------------------------- */

    const representationStart = 0.34;
    const representationEnd = 0.94;

    const representationProgress =
      clamp(
        (progress - representationStart) /
        (representationEnd - representationStart),
        0,
        1
      );


    if (representationProgress > 0) {

      representation.style.opacity = 1;


      /*
        Six representations.
        Each gets an equal portion of
        the animation.
      */

      const count =
        representations.length;

      const exactIndex =
        representationProgress * count;

      const index =
        Math.min(
          count - 1,
          Math.floor(exactIndex)
        );


      const localProgress =
        exactIndex - index;


      const current =
        representations[index];


      representationImage.src =
        current.src;

      representationPlatform.textContent =
        current.platform;

      representationType.textContent =
        current.type;


      /*
        Rotate from -90° to +90°
        during each representation.
      */

      const rotation =
        -90 + localProgress * 180;


      const scale =
        0.9 +
        Math.sin(localProgress * Math.PI) * 0.1;


      representation.style.transform =
        `
          translate(-50%, -50%)
          perspective(1200px)
          rotateY(${rotation}deg)
          scale(${scale})
        `;

    } else {

      representation.style.opacity = 0;

    }


    requestAnimationFrame(updateAnimation);

  }


  updateAnimation();

</script>

</body>
</html>
