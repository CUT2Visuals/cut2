<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #f3f0e8;
      color: #000;

      font-family:
        "IBM Plex Mono",
        "Courier New",
        monospace;
    }

    body {
      overflow-x: hidden;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #000;
      background: #f3f0e8;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
      font-weight: 400;
    }

    .header-title {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       INTRO
    ================================================== */

    .intro {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
    }


    /* ==================================================
       MAIN SCROLL SYSTEM
    ================================================== */

    .asset-system {
      position: relative;
      height: 650vh;
    }

    .sticky-stage {
      position: sticky;

      top: 0;

      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* ==================================================
       LIBRARY CARD + ONE ASSET
    ================================================== */

    .asset-card {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(252px, 49vw);

      transform: translate(-50%, -50%);

      z-index: 5;
    }

    .asset-label {
      position: absolute;

      left: 50%;
      bottom: calc(100% + 28px);

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }


    /* ==================================================
       ARROW
    ================================================== */

    .arrow-system {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 0;

      transform: translateX(-50%);

      z-index: 4;

      opacity: 0;
    }

    .arrow-shaft {
      position: absolute;

      left: 0;
      bottom: -5px;

      width: 1px;
      height: 0;

      background: #000;
    }

    .arrow-head {
      position: absolute;

      left: 50%;
      bottom: -5px;

      width: 9px;
      height: 9px;

      border-right: 1px solid #000;
      border-bottom: 1px solid #000;

      transform:
        translate(-50%, 50%)
        rotate(45deg);
    }


    /* ==================================================
       MULTIPLE REPRESENTATIONS
    ================================================== */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 57%;

      transform: translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;

      z-index: 3;
    }


    /* ==================================================
       REPRESENTATION
    ================================================== */

    .representation {
      position: absolute;

      left: 50%;
      top: 58%;

      width: min(620px, 76vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      pointer-events: none;

      z-index: 2;
    }

    .representation-visual {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .representation-image {
      display: block;

      width: 70%;
      height: 70%;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       NEXT
    ================================================== */

    .next {
      min-height: 100vh;

      border-top: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(24px, 4vw, 56px);
      font-weight: 400;

      text-align: center;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 10px;
      }

      .intro {
        min-height: 100svh;
        font-size: 26px;
      }

      .asset-system {
        height: 650vh;
      }

      .sticky-stage {
        height: 100svh;
      }

      .asset-card {
        width: min(210px, 53vw);
      }

      .asset-label {
        bottom: calc(100% + 20px);
        font-size: 26px;
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 26px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
        top: 59%;
      }

      .representation-visual {
        height: 48svh;
      }

      .representation-image {
        width: 70%;
        height: 70%;
      }

      .representation-info {
        margin-top: 12px;
        font-size: 10px;
      }

      .next {
        min-height: 100svh;
        font-size: 26px;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="logo">
    CUT2
  </div>

  <div class="header-title">
    Asset Representations
  </div>

</header>


<main>


  <!-- ==================================================
       INTRO
  ================================================== -->

  <section class="intro">

    <div>
      ONE PROJECT.<br>
      MULTIPLE PLATFORMS.
    </div>

  </section>



  <!-- ==================================================
       ASSET SYSTEM
  ================================================== -->

  <section class="asset-system">

    <div class="sticky-stage">


      <!-- LIBRARY CARD -->

      <div
        class="asset-card"
        id="assetCard"
      >

        <div class="asset-label">
          ONE ASSET.
        </div>

        <img
          src="asset-representations/library-card.png?v=2"
          alt="CUT2 Asset Library"
        >

      </div>



      <!-- ARROW -->

      <div
        class="arrow-system"
        id="arrowSystem"
      >

        <div
          class="arrow-shaft"
          id="arrowShaft"
        ></div>

        <div class="arrow-head"></div>

      </div>



      <!-- MULTIPLE REPRESENTATIONS -->

      <div
        class="multiple-label"
        id="multipleLabel"
      >
        MULTIPLE REPRESENTATIONS
      </div>



      <!-- REPRESENTATION -->

      <div
        class="representation"
        id="representation"
      >

        <div
          class="representation-visual"
          id="representationVisual"
        >

          <img
            id="representationImage"
            class="representation-image"
            src="asset-representations/autocad/minimal.svg?v=2"
            alt="AutoCAD Minimal"
          >

        </div>


        <div class="representation-info">

          <span id="representationPlatform">
            AUTOCAD
          </span>

          <span id="representationType">
            MINIMAL
          </span>

        </div>

      </div>


    </div>

  </section>



  <!-- ==================================================
       NEXT
  ================================================== -->

  <section class="next">

    THE SYSTEM CONTINUES.

  </section>


</main>



<script>

  const assetCard =
    document.getElementById("assetCard");

  const arrowSystem =
    document.getElementById("arrowSystem");

  const arrowShaft =
    document.getElementById("arrowShaft");

  const multipleLabel =
    document.getElementById("multipleLabel");

  const representation =
    document.getElementById("representation");

  const representationVisual =
    document.getElementById("representationVisual");

  const representationImage =
    document.getElementById("representationImage");

  const representationPlatform =
    document.getElementById("representationPlatform");

  const representationType =
    document.getElementById("representationType");


  /* ==================================================
     REPRESENTATION DATA
  ================================================== */

  const representations = [

    {
      platform: "AUTOCAD",
      type: "MINIMAL",
      src: "asset-representations/autocad/minimal.svg?v=2"
    },

    {
      platform: "AUTOCAD",
      type: "CONDITIONAL",
      src: "asset-representations/autocad/conditional.svg?v=2"
    },

    {
      platform: "AUTOCAD",
      type: "REALISTIC",
      src: "asset-representations/autocad/realistic.svg?v=2"
    },

    {
      platform: "SKETCHUP",
      type: "REALISTIC FACE ME",
      src: "asset-representations/sketchup/realistic-face-me.png?v=2"
    },

    {
      platform: "SKETCHUP",
      type: "CONDITIONAL",
      src: "asset-representations/sketchup/conditional.png?v=2"
    },

    {
      platform: "INDESIGN",
      type: "IMAGE",
      src: "asset-representations/publishing/image.jpg?v=2"
    }

  ];


  /* ==================================================
     HELPERS
  ================================================== */

  function clamp(value, min, max) {

    return Math.max(
      min,
      Math.min(max, value)
    );

  }


  /* ==================================================
     ANIMATION
  ================================================== */

  function updateAnimation() {

    const section =
      document.querySelector(".asset-system");

    const rect =
      section.getBoundingClientRect();

    const scrollable =
      section.offsetHeight - window.innerHeight;

    const passed =
      clamp(
        -rect.top,
        0,
        scrollable
      );

    const progress =
      passed / scrollable;



    /* ==================================================
       1. ONE ASSET + CARD

       They are one physical object.
       Both move upward together.
    ================================================== */

    const cardStart = 0.00;
    const cardEnd = 0.23;

    const cardProgress =
      clamp(
        (progress - cardStart) /
        (cardEnd - cardStart),
        0,
        1
      );

    const cardTravel =
      window.innerHeight * 0.95;

    const cardY =
      -cardProgress * cardTravel;

    assetCard.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${cardY}px)
        )
      `;



    /* ==================================================
       2. ARROW

       Shaft grows until it reaches the arrow head.

       The arrow head and shaft are physically connected.
    ================================================== */

    const arrowStart = 0.05;
    const arrowEnd = 0.25;

    const arrowProgress =
      clamp(
        (progress - arrowStart) /
        (arrowEnd - arrowStart),
        0,
        1
      );

    const arrowLength =
      window.innerHeight * 0.72;

    arrowSystem.style.opacity =
      progress >= arrowStart &&
      progress < 0.48
        ? 1
        : 0;

    arrowShaft.style.height =
      `${arrowProgress * arrowLength}px`;



    /* ==================================================
       3. MULTIPLE REPRESENTATIONS

       No rotation.

       It appears in its current position,
       then moves upward to the same level
       occupied by ONE ASSET.
    ================================================== */

    const labelStart = 0.22;
    const labelVisibleEnd = 0.30;

    const labelProgress =
      clamp(
        (progress - labelStart) /
        (labelVisibleEnd - labelStart),
        0,
        1
      );


    /*
      Target position is the same vertical
      position as ONE ASSET after its move.
    */

    const targetShift =
      -window.innerHeight * 0.42;

    const labelMoveStart = 0.30;
    const labelMoveEnd = 0.40;

    const labelMoveProgress =
      clamp(
        (progress - labelMoveStart) /
        (labelMoveEnd - labelMoveStart),
        0,
        1
      );


    const labelShift =
      labelMoveProgress * targetShift;


    multipleLabel.style.opacity =
      labelProgress > 0 ? 1 : 0;

    multipleLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${labelShift}px)
        )
      `;


    /*
      Arrow follows the label.

      Once the label reaches its final position,
      the arrow disappears when the first
      representation begins.
    */

    arrowSystem.style.transform =
      `
        translateX(-50%)
        translateY(${labelShift}px)
      `;



    /* ==================================================
       4. REPRESENTATIONS
    ================================================== */

    const representationStart = 0.40;
    const representationEnd = 0.92;

    const representationProgress =
      clamp(
        (progress - representationStart) /
        (representationEnd - representationStart),
        0,
        1
      );


    if (progress >= representationStart) {

      representation.style.opacity = 1;

      /*
        Arrow disappears exactly as the
        first representation starts.
      */

      arrowSystem.style.opacity = 0;


      const count =
        representations.length;


      const exactIndex =
        representationProgress * count;


      const index =
        Math.min(
          count - 1,
          Math.floor(exactIndex)
        );


      const localProgress =
        exactIndex - index;


      const current =
        representations[index];


      representationImage.src =
        current.src;

      representationImage.alt =
        `${current.platform} ${current.type}`;


      /*
        Text changes only with the asset.
        It never moves.
      */

      representationPlatform.textContent =
        current.platform;

      representationType.textContent =
        current.type;



      /* ==================================================
         FINAL INDESIGN

         Last representation stays fully open.
      ================================================== */

      const isLast =
        index === count - 1;


      if (isLast) {

        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(0deg)
            scale(1)
          `;

      } else {

        const rotation =
          -90 +
          localProgress * 180;


        const scale =
          0.92 +
          Math.sin(
            localProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

    } else {

      representation.style.opacity = 0;

    }


    requestAnimationFrame(updateAnimation);

  }


  updateAnimation();

</script>

</body>
</html>
