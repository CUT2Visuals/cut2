```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f0e8;
      color: #000;
      font-family: "IBM Plex Mono", monospace;
    }

    body {
      overflow-x: hidden;
    }

    /* --------------------------------------------------
       HEADER
    -------------------------------------------------- */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;

      background: #f3f0e8;
      border-bottom: 1px solid #000;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
      font-weight: 500;
    }

    .header-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* --------------------------------------------------
       INTRO
    -------------------------------------------------- */

    .intro {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(28px, 5vw, 72px);
      text-align: center;
    }


    /* --------------------------------------------------
       ANIMATION SECTION
    -------------------------------------------------- */

    .asset-system {
      height: 500vh;
      position: relative;
    }

    .sticky-stage {
      position: sticky;
      top: 0;

      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* --------------------------------------------------
       ASSET CARD
    -------------------------------------------------- */

    .asset-card {
      position: absolute;

      width: min(360px, 70vw);

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      transition: opacity 0.1s linear;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }

    .asset-label {
      margin-top: 12px;

      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* --------------------------------------------------
       CONNECTOR
    -------------------------------------------------- */

    .connector {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 0;

      background: #000;

      transform: translateX(-50%);

      opacity: 0;
    }

    .connector-arrow {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 9px;
      height: 9px;

      border-right: 1px solid #000;
      border-bottom: 1px solid #000;

      transform: translate(-50%, 50%) rotate(45deg);
    }


    /* --------------------------------------------------
       MULTIPLE REPRESENTATIONS
    -------------------------------------------------- */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      font-size: clamp(18px, 3vw, 36px);

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;
    }


    /* --------------------------------------------------
       REPRESENTATION
    -------------------------------------------------- */

    .representation {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(520px, 70vw);

      transform-style: preserve-3d;
      transform-origin: center center;

      opacity: 0;
      perspective: 1200px;
    }

    .representation img {
      display: block;

      width: 100%;
      height: auto;

      max-height: 60vh;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* --------------------------------------------------
       NEXT SECTION
    -------------------------------------------------- */

    .next {
      min-height: 100vh;

      border-top: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(24px, 4vw, 56px);
      text-align: center;
    }

  </style>
</head>


<body>

  <header>
    <div class="logo">CUT2</div>
    <div class="header-title">Asset Representations</div>
  </header>


  <main>

    <!-- INTRO -->

    <section class="intro">
      <div>
        ONE PROJECT.<br>
        MULTIPLE PLATFORMS.
      </div>
    </section>


    <!-- ASSET SYSTEM -->

    <section class="asset-system">

      <div class="sticky-stage">

        <!-- ASSET LIBRARY CARD -->

        <div class="asset-card" id="assetCard">

          <img
            src="asset-representations/library-card.png"
            alt="CUT2 Asset Library"
          >

          <div class="asset-label">
            ONE ASSET
          </div>

        </div>


        <!-- CONNECTOR -->

        <div class="connector" id="connector">
          <div class="connector-arrow"></div>
        </div>


        <!-- MULTIPLE REPRESENTATIONS -->

        <div
          class="multiple-label"
          id="multipleLabel"
        >
          MULTIPLE REPRESENTATIONS
        </div>


        <!-- REPRESENTATION -->

        <div
          class="representation"
          id="representation"
        >

          <img
            id="representationImage"
            src="asset-representations/autocad/minimal.svg"
            alt="AutoCAD Minimal"
          >

          <div class="representation-info">
            <span>AUTOCAD</span>
            <span>MINIMAL</span>
          </div>

        </div>

      </div>

    </section>


    <!-- NEXT -->

    <section class="next">
      THE SYSTEM CONTINUES.
    </section>

  </main>


  <script>

    const assetCard = document.getElementById("assetCard");
    const connector = document.getElementById("connector");
    const multipleLabel = document.getElementById("multipleLabel");
    const representation = document.getElementById("representation");


    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }


    function updateAnimation() {

      const section = document.querySelector(".asset-system");

      const rect = section.getBoundingClientRect();

      const scrollable =
        section.offsetHeight - window.innerHeight;

      const passed =
        clamp(-rect.top, 0, scrollable);

      const progress =
        passed / scrollable;


      /* ----------------------------------------------
         PHASE 1
         Asset card
      ---------------------------------------------- */

      const cardStart = 0.00;
      const cardEnd = 0.16;

      const cardProgress =
        clamp(
          (progress - cardStart) /
          (cardEnd - cardStart),
          0,
          1
        );

      const cardY =
        -cardProgress * 140;

      assetCard.style.transform =
        `translate(-50%, calc(-50% + ${cardY}px))`;

      assetCard.style.opacity =
        1 - cardProgress;


      /* ----------------------------------------------
         PHASE 2
         Connector
      ---------------------------------------------- */

      const connectorStart = 0.10;
      const connectorEnd = 0.24;

      const connectorProgress =
        clamp(
          (progress - connectorStart) /
          (connectorEnd - connectorStart),
          0,
          1
        );

      connector.style.height =
        `${connectorProgress * 150}px`;

      connector.style.opacity =
        connectorProgress;


      /* ----------------------------------------------
         PHASE 3
         Multiple representations
      ---------------------------------------------- */

      const labelStart = 0.23;
      const labelEnd = 0.34;

      const labelProgress =
        clamp(
          (progress - labelStart) /
          (labelEnd - labelStart),
          0,
          1
        );

      multipleLabel.style.opacity =
        labelProgress;


      /* ----------------------------------------------
         PHASE 4
         Representation
      ---------------------------------------------- */

      const representationStart = 0.34;

      const representationProgress =
        clamp(
          (progress - representationStart) /
          0.20,
          0,
          1
        );

      const scale =
        0.8 + representationProgress * 0.2;

      const rotate =
        -90 + representationProgress * 90;

      representation.style.opacity =
        representationProgress;

      representation.style.transform =
        `
          translate(-50%, -50%)
          perspective(1200px)
          rotateY(${rotate}deg)
          scale(${scale})
        `;


      /* ----------------------------------------------
         CONNECTOR DISAPPEARS
      ---------------------------------------------- */

      if (progress > 0.28) {
        connector.style.opacity = 0;
      }


      requestAnimationFrame(updateAnimation);
    }


    updateAnimation();

  </script>

</body>
</html>
