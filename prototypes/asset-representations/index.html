<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUT2 — Asset Representations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f4f1eb;
      color: #111;
      font-family: "IBM Plex Mono", monospace;
    }

    body {
      overflow-x: hidden;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f4f1eb;
      z-index: 100;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #111;
      margin-right: 10px;
    }

    .header-right {
      gap: 24px;
    }

    .intro {
      height: 100vh;
      min-height: 600px;
      padding-top: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: clamp(30px, 5vw, 72px);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .asset-system {
      position: relative;
      height: 700vh;
    }

    .sticky-stage {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .asset-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(252px, 49vw);
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      z-index: 5;
    }

    .asset-card-inner {
      width: 100%;
      height: 100%;
      background: #111;
      position: relative;
      overflow: hidden;
    }

    .asset-card-inner::before,
    .asset-card-inner::after {
      content: "";
      position: absolute;
      background: #f4f1eb;
    }

    .asset-card-inner::before {
      width: 1px;
      height: 100%;
      left: 50%;
      top: 0;
    }

    .asset-card-inner::after {
      width: 100%;
      height: 1px;
      left: 0;
      top: 50%;
    }

    .asset-label {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 28px);
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: clamp(28px, 5vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.055em;
      z-index: 6;
      will-change: transform, opacity;
    }

    .arrow-system {
      position: absolute;
      left: 50%;
      top: calc(50% + 12vh);
      width: 1px;
      height: 0;
      z-index: 4;
      pointer-events: none;
    }

    .arrow-shaft {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 0;
      background: #111;
      transform-origin: top center;
    }

    .arrow-head {
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 10px;
      height: 10px;
      border-right: 1px solid #111;
      border-bottom: 1px solid #111;
      transform: translateX(-50%) rotate(45deg);
      transform-origin: center;
    }

    .multiple-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      font-size: clamp(28px, 5vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.055em;
      opacity: 0;
      z-index: 3;
      will-change: transform, opacity;
    }

    .representation {
      position: absolute;
      left: 50%;
      top: 58%;
      width: min(620px, 76vw);
      transform: translate(-50%, -50%);
      opacity: 0;
      z-index: 2;
      text-align: center;
      will-change: transform, opacity;
    }

    .representation-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      position: relative;
      overflow: hidden;
    }

    .representation-image::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          transparent 0 24.5%,
          #f4f1eb 24.5% 25%,
          transparent 25% 49.5%,
          #f4f1eb 49.5% 50%,
          transparent 50% 74.5%,
          #f4f1eb 74.5% 75%,
          transparent 75%
        ),
        linear-gradient(
          0deg,
          transparent 0 24.5%,
          #f4f1eb 24.5% 25%,
          transparent 25% 49.5%,
          #f4f1eb 49.5% 50%,
          transparent 50% 74.5%,
          #f4f1eb 74.5% 75%,
          transparent 75%
        );
      opacity: 0.8;
    }

    .representation-meta {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      font-size: 11px;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .representation-platform {
      text-align: left;
    }

    .representation-type {
      text-align: right;
    }

    @media (max-width: 700px) {
      .header {
        height: 52px;
        padding: 0 16px;
        font-size: 10px;
      }

      .header-right {
        gap: 14px;
      }

      .intro {
        min-height: 500px;
        padding-top: 52px;
        font-size: clamp(28px, 9vw, 48px);
      }

      .asset-card {
        width: min(252px, 58vw);
      }

      .asset-label {
        bottom: calc(100% + 20px);
        font-size: clamp(28px, 9vw, 48px);
      }

      .arrow-system {
        top: calc(50% + 12vh);
      }

      .multiple-label {
        font-size: clamp(28px, 9vw, 48px);
        white-space: normal;
        width: 90vw;
        text-align: center;
      }

      .representation {
        width: 82vw;
        top: 58%;
      }

      .representation-meta {
        font-size: 9px;
        margin-top: 10px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-left">
      <span class="dot"></span>
      <span>CUT2</span>
    </div>

    <div class="header-right">
      <span>ASSET REPRESENTATIONS</span>
      <span>01</span>
    </div>
  </header>

  <section class="intro">
    <div>
      ONE PROJECT.<br>
      MULTIPLE PLATFORMS.
    </div>
  </section>

  <section class="asset-system">
    <div class="sticky-stage">

      <div class="asset-card">
        <div class="asset-card-inner"></div>

        <div class="asset-label">
          ONE ASSET
        </div>
      </div>

      <div class="arrow-system">
        <div class="arrow-shaft"></div>
        <div class="arrow-head"></div>
      </div>

      <div class="multiple-label">
        MULTIPLE REPRESENTATIONS
      </div>

      <div class="representation">
        <div class="representation-image"></div>

        <div class="representation-meta">
          <div class="representation-platform">
            <span id="representationPlatform">AUTOCAD</span>
          </div>

          <div class="representation-type">
            <span id="representationType">MINIMAL</span>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script>
    const assetSystem = document.querySelector(".asset-system");
    const assetCard = document.querySelector(".asset-card");
    const assetLabel = document.querySelector(".asset-label");

    const arrowSystem = document.querySelector(".arrow-system");
    const arrowShaft = document.querySelector(".arrow-shaft");

    const multipleLabel = document.querySelector(".multiple-label");
    const representation = document.querySelector(".representation");

    const representationPlatform =
      document.getElementById("representationPlatform");

    const representationType =
      document.getElementById("representationType");


    const representations = [
      {
        platform: "AUTOCAD",
        type: "MINIMAL"
      },
      {
        platform: "AUTOCAD",
        type: "CONDITIONAL"
      },
      {
        platform: "AUTOCAD",
        type: "REALISTIC"
      },
      {
        platform: "SKETCHUP",
        type: "REALISTIC FACE ME"
      },
      {
        platform: "SKETCHUP",
        type: "CONDITIONAL"
      },
      {
        platform: "INDESIGN",
        type: "IMAGE"
      }
    ];


    function lerp(a, b, t) {
      return a + (b - a) * t;
    }


    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }


    function easeInOut(t) {
      return t < 0.5
        ? 2 * t * t
        : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }


    function progressBetween(progress, start, end) {
      return clamp(
        (progress - start) / (end - start),
        0,
        1
      );
    }


    function update() {
      const rect = assetSystem.getBoundingClientRect();

      const viewportHeight = window.innerHeight;

      const totalScroll =
        assetSystem.offsetHeight - viewportHeight;

      const passed =
        clamp(-rect.top / totalScroll, 0, 1);


      /*
       * ------------------------------------------------------------
       * ONE ASSET
       *
       * Start: completely below the viewport.
       * End: moves upward through the composition.
       * ------------------------------------------------------------
       */

      const cardStart = 0.18;
      const cardEnd = 0.30;

      const cardProgress = easeInOut(
        progressBetween(
          passed,
          cardStart,
          cardEnd
        )
      );

      const cardHeight = assetCard.offsetHeight;

      /*
       * The entire card starts below the viewport.
       * Its top edge is below the bottom edge of the viewport.
       */
      const assetStartY =
        viewportHeight / 2 +
        cardHeight / 2 +
        viewportHeight * 0.08;

      const assetFinalY =
        -viewportHeight * 0.82;

      const cardY =
        lerp(
          assetStartY,
          assetFinalY,
          cardProgress
        );

      assetCard.style.transform =
        `translate(-50%, calc(-50% + ${cardY - viewportHeight / 2}px))`;


      /*
       * ------------------------------------------------------------
       * ONE ASSET LABEL
       * ------------------------------------------------------------
       */

      const labelAppearStart = 0.30;
      const labelAppearEnd = 0.34;

      const labelOpacity = easeInOut(
        progressBetween(
          passed,
          labelAppearStart,
          labelAppearEnd
        )
      );

      assetLabel.style.opacity = labelOpacity;


      const labelMoveStart = 0.42;
      const labelMoveEnd = 0.50;

      const labelMoveProgress = easeInOut(
        progressBetween(
          passed,
          labelMoveStart,
          labelMoveEnd
        )
      );

      const labelTravel =
        viewportHeight * 0.42;

      const labelY =
        lerp(
          0,
          -labelTravel,
          labelMoveProgress
        );

      assetLabel.style.transform =
        `translateX(-50%) translateY(${labelY}px)`;


      /*
       * ------------------------------------------------------------
       * ARROW
       *
       * The shaft begins at the existing arrow position.
       * Its end is calculated from the actual position of
       * MULTIPLE REPRESENTATIONS.
       *
       * This prevents the arrow from crossing the label.
       * ------------------------------------------------------------
       */

      const arrowStart = 0.30;
      const arrowEnd = 0.42;

      const arrowProgress = easeInOut(
        progressBetween(
          passed,
          arrowStart,
          arrowEnd
        )
      );

      const stage =
        document.querySelector(".sticky-stage");

      const stageRect =
        stage.getBoundingClientRect();

      const labelRect =
        multipleLabel.getBoundingClientRect();

      const arrowTop =
        stageRect.height * 0.50 +
        viewportHeight * 0.12 +
        labelY;

      const labelTop =
        labelRect.top -
        stageRect.top;

      /*
       * Keep a physical gap between the arrow tip
       * and MULTIPLE REPRESENTATIONS.
       */
      const arrowEndGap =
        window.innerWidth <= 700
          ? 20
          : 28;

      const arrowLength =
        Math.max(
          0,
          labelTop -
          arrowTop -
          arrowEndGap
        );

      arrowSystem.style.top =
        `calc(50% + 12vh)`;

      arrowShaft.style.height =
        `${arrowProgress * arrowLength}px`;


      /*
       * ------------------------------------------------------------
       * MULTIPLE REPRESENTATIONS
       * ------------------------------------------------------------
       */

      const representationsStart = 0.50;
      const representationsEnd = 0.96;

      const representationProgress =
        progressBetween(
          passed,
          representationsStart,
          representationsEnd
        );

      const representationOpacity =
        representationProgress > 0
          ? Math.min(
              1,
              representationProgress * 5
            )
          : 0;

      representation.style.opacity =
        representationOpacity;


      const representationY =
        viewportHeight * 0.58;

      representation.style.transform =
        `translate(-50%, calc(-50% + ${representationY - viewportHeight * 0.58}px))`;


      const index =
        Math.min(
          representations.length - 1,
          Math.floor(
            representationProgress *
            representations.length
          )
        );

      const current =
        representations[index];

      if (current) {
        representationPlatform.textContent =
          current.platform;

        representationType.textContent =
          current.type;
      }


      /*
       * ------------------------------------------------------------
       * MULTIPLE REPRESENTATIONS LABEL
       * ------------------------------------------------------------
       */

      const multipleLabelProgress =
        easeInOut(
          progressBetween(
            passed,
            0.46,
            0.52
          )
        );

      multipleLabel.style.opacity =
        multipleLabelProgress;

      const multipleLabelY =
        viewportHeight * 0.42;

      multipleLabel.style.transform =
        `translate(-50%, calc(-50% - ${multipleLabelY * multipleLabelProgress}px))`;
    }


    let ticking = false;

    function requestUpdate() {
      if (!ticking) {
        requestAnimationFrame(() => {
          update();
          ticking = false;
        });

        ticking = true;
      }
    }


    window.addEventListener(
      "scroll",
      requestUpdate,
      { passive: true }
    );

    window.addEventListener(
      "resize",
      requestUpdate
    );

    update();
  </script>

</body>
</html>
