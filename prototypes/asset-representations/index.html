```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CUT2 — Asset Representations</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #f3f0e8;
    color: #111;
    font-family: "IBM Plex Mono", monospace;
}

body {
    overflow-x: hidden;
}


/* HEADER */

.header {
    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 64px;

    padding: 0 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #111;

    background: #f3f0e8;

    z-index: 100;
}

.header-left {
    font-size: 16px;
    font-weight: 500;
}

.header-right {
    font-size: 12px;
}


/* INTRO */

.intro {
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding-top: 64px;
}

.intro-title {
    font-size: clamp(32px, 5vw, 72px);
    line-height: 1.05;
    text-align: center;
}


/* MAIN ANIMATION */

.asset-system {
    height: 560vh;
}

.asset-sticky {
    position: sticky;
    top: 0;

    height: 100vh;

    overflow: hidden;
}

.asset-stage {
    position: relative;

    width: 100%;
    height: 100%;
}


/* ONE ASSET */

.one-asset {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    z-index: 10;
}

.one-asset-label {
    margin-bottom: 20px;

    font-size: 14px;
}

.library-card {
    display: block;

    width: min(420px, 65vw);
    height: auto;

    border: 1px solid #111;
}


/* TRANSITION */

.transition {
    position: absolute;

    top: calc(50% + 135px);
    left: 50%;

    width: 1px;
    height: 0;

    background: #111;

    transform: translateX(-50%);

    opacity: 1;

    z-index: 5;
}

.transition-arrow {
    position: absolute;

    left: 50%;
    bottom: -1px;

    width: 10px;
    height: 10px;

    border-right: 1px solid #111;
    border-bottom: 1px solid #111;

    transform:
        translateX(-50%)
        rotate(45deg);
}

.transition-label {
    position: absolute;

    top: calc(50% + 300px);
    left: 50%;

    transform: translateX(-50%);

    white-space: nowrap;

    font-size: 14px;

    opacity: 0;
}


/* REPRESENTATION */

.representation-system {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 1px;
    height: 1px;

    perspective: 1200px;

    z-index: 4;
}

.representation {
    position: absolute;

    top: 0;
    left: 0;

    width: min(500px, 70vw);
    height: min(500px, 70vw);

    display: flex;
    align-items: center;
    justify-content: center;

    transform:
        translate(-50%, -50%)
        rotateY(0deg);

    transform-style: preserve-3d;
}

.representation img {
    display: block;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
}


/* INFO */

.rep-info {
    position: absolute;

    top: 50%;
    left: calc(50% + min(300px, 32vw));

    width: 220px;

    transform: translateY(-50%);

    font-size: 12px;
    line-height: 1.4;

    opacity: 0;
}

.rep-info-title {
    margin-bottom: 6px;

    font-size: 14px;
}

.rep-info-platform {
    opacity: 0.5;
}


/* NEXT */

.next-section {
    min-height: 100vh;

    padding: 140px 28px;

    border-top: 1px solid #111;
}

.next-section h2 {
    margin: 0;

    font-size: clamp(32px, 5vw, 72px);
    font-weight: 400;
}

</style>
</head>


<body>


<header class="header">

    <div class="header-left">
        CUT2
    </div>

    <div class="header-right">
        ASSET REPRESENTATIONS
    </div>

</header>


<section class="intro">

    <div class="intro-title">
        One project.<br>
        Multiple platforms.
    </div>

</section>


<section class="asset-system">

    <div class="asset-sticky">

        <div class="asset-stage">


            <!-- ONE ASSET -->

            <div
                class="one-asset"
                id="oneAsset"
            >

                <div class="one-asset-label">
                    ONE ASSET
                </div>

                <img
                    class="library-card"
                    id="libraryCard"
                    src="asset-representations/library-card.png"
                    alt="CUT2 Asset Library"
                >

            </div>


            <!-- TRANSITION -->

            <div
                class="transition"
                id="transition"
            >

                <div class="transition-arrow"></div>

            </div>


            <div
                class="transition-label"
                id="transitionLabel"
            >
                MULTIPLE REPRESENTATIONS
            </div>


            <!-- REPRESENTATION -->

            <div
                class="representation-system"
            >

                <div
                    class="representation"
                    id="representation"
                >

                    <img
                        id="representationImage"
                        alt=""
                    >

                </div>

            </div>


            <!-- INFO -->

            <div
                class="rep-info"
                id="repInfo"
            >

                <div
                    class="rep-info-title"
                    id="repTitle"
                ></div>

                <div
                    class="rep-info-platform"
                    id="repPlatform"
                ></div>

            </div>


        </div>

    </div>

</section>


<section class="next-section">

    <h2>
        The system continues.
    </h2>

</section>


<script>


/* =========================================================
   REPRESENTATIONS
========================================================= */

const representations = [

    {
        title: "MINIMAL",
        platform: "AutoCAD / DWG",
        file: "asset-representations/autocad/minimal.svg"
    },

    {
        title: "CONDITIONAL",
        platform: "AutoCAD / DWG",
        file: "asset-representations/autocad/conditional.svg"
    },

    {
        title: "REALISTIC",
        platform: "AutoCAD / DWG",
        file: "asset-representations/autocad/realistic.svg"
    },

    {
        title: "CONDITIONAL",
        platform: "SketchUp",
        file: "asset-representations/sketchup/conditional.png"
    },

    {
        title: "REALISTIC FACE ME",
        platform: "SketchUp",
        file: "asset-representations/sketchup/realistic-face-me.png"
    },

    {
        title: "IMAGE",
        platform: "InDesign",
        file: "asset-representations/indesign/image.jpg"
    }

];


/* =========================================================
   ELEMENTS
========================================================= */

const assetSystem =
    document.querySelector(".asset-system");

const oneAsset =
    document.getElementById("oneAsset");

const transition =
    document.getElementById("transition");

const transitionLabel =
    document.getElementById("transitionLabel");

const representation =
    document.getElementById("representation");

const representationImage =
    document.getElementById("representationImage");

const repInfo =
    document.getElementById("repInfo");

const repTitle =
    document.getElementById("repTitle");

const repPlatform =
    document.getElementById("repPlatform");


/* =========================================================
   IMAGE DEBUG
========================================================= */

representationImage.addEventListener(
    "error",
    function () {

        console.error(
            "CUT2 image failed:",
            representationImage.src
        );

    }
);


/* =========================================================
   CLAMP
========================================================= */

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


/* =========================================================
   SHOW REPRESENTATION
========================================================= */

let currentIndex = -1;


function showRepresentation(index) {

    if (
        index === currentIndex
    ) {
        return;
    }

    currentIndex = index;

    const item =
        representations[index];

    representationImage.src =
        item.file;

    representationImage.alt =
        item.title;

    repTitle.textContent =
        item.title;

    repPlatform.textContent =
        item.platform;

}


/* =========================================================
   UPDATE
========================================================= */

function update() {

    const rect =
        assetSystem.getBoundingClientRect();

    const scrollDistance =
        assetSystem.offsetHeight -
        window.innerHeight;

    const progress =
        clamp(
            -rect.top /
            scrollDistance,
            0,
            1
        );


    /* -----------------------------------------
       ONE ASSET
    ----------------------------------------- */

    const assetStart = 0.08;
    const assetEnd = 0.25;

    let assetOpacity =
        1 -
        (
            progress -
            assetStart
        ) /
        (
            assetEnd -
            assetStart
        );

    assetOpacity =
        clamp(
            assetOpacity,
            0,
            1
        );

    oneAsset.style.opacity =
        assetOpacity;


    /* -----------------------------------------
       VERTICAL ARROW
    ----------------------------------------- */

    const arrowStart = 0.08;
    const arrowEnd = 0.25;

    let arrowProgress =
        (
            progress -
            arrowStart
        ) /
        (
            arrowEnd -
            arrowStart
        );

    arrowProgress =
        clamp(
            arrowProgress,
            0,
            1
        );


    transition.style.height =
        `${arrowProgress * 150}px`;


    /*
       IMPORTANT:
       Arrow disappears after transition.
    */

    if (progress >= 0.28) {

        transition.style.opacity = 0;

    } else {

        transition.style.opacity = 1;

    }


    /* -----------------------------------------
       LABEL
    ----------------------------------------- */

    const labelStart = 0.20;
    const labelEnd = 0.30;

    let labelProgress =
        (
            progress -
            labelStart
        ) /
        (
            labelEnd -
            labelStart
        );

    labelProgress =
        clamp(
            labelProgress,
            0,
            1
        );


    transitionLabel.style.opacity =
        labelProgress;


    /* -----------------------------------------
       REPRESENTATIONS
    ----------------------------------------- */

    const repsStart = 0.30;
    const repsEnd = 0.94;

    let repProgress =
        (
            progress -
            repsStart
        ) /
        (
            repsEnd -
            repsStart
        );

    repProgress =
        clamp(
            repProgress,
            0,
            1
        );


    repProgress =
        clamp(
            repProgress,
            0,
            1
        );


    if (repProgress > 0) {

        const count =
            representations.length;

        let index =
            Math.floor(
                repProgress * count
            );

        if (index >= count) {
            index = count - 1;
        }

        showRepresentation(index);

    }


    /* -----------------------------------------
       ROTATION
    ----------------------------------------- */

    const rotation =
        repProgress * 360;

    representation.style.transform =
        `
        translate(-50%, -50%)
        rotateY(${rotation}deg)
        `;


    /* -----------------------------------------
       INFO
    ----------------------------------------- */

    const infoStart = 0.34;
    const infoEnd = 0.42;

    let infoOpacity =
        (
            progress -
            infoStart
        ) /
        (
            infoEnd -
            infoStart
        );

    infoOpacity =
        clamp(
            infoOpacity,
            0,
            1
        );

    repInfo.style.opacity =
        infoOpacity;

}


/* =========================================================
   EVENTS
========================================================= */

window.addEventListener(
    "scroll",
    update,
    {
        passive: true
    }
);

window.addEventListener(
    "resize",
    update
);

update();

</script>

</body>
</html>
```
