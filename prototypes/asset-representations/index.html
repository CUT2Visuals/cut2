<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>CUT2 — Asset Representations</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f3f0e8;
      color: #000;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 400;
    }

    body {
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f3f0e8;
      z-index: 100;
      border-bottom: 1px solid #000;
    }

    .header-logo {
      font-size: 14px;
      line-height: 1;
    }

    .header-nav {
      display: flex;
      gap: 24px;
      font-size: 12px;
      line-height: 1;
    }

    .header-nav span {
      white-space: nowrap;
    }

    .asset-system {
      position: relative;
      height: 700vh;
    }

    .stage {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
    }

    .intro {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .intro-line {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      text-align: center;
      font-size: clamp(28px, 7vw, 72px);
      line-height: 0.95;
      white-space: nowrap;
      transition: none;
    }

    #oneProject {
      opacity: 1;
    }

    #multiplePlatforms {
      opacity: 0;
    }

    .asset-stage {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .asset-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      text-align: center;
      font-size: clamp(28px, 7vw, 72px);
      line-height: 0.95;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    .asset-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(252px, 49vw);
      aspect-ratio: 1 / 1;
      transform: translate(-50%, -50%);
      opacity: 0;
      overflow: hidden;
    }

    .asset-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .arrow-system {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      opacity: 0;
      z-index: 4;
      transform: translateX(-50%);
    }

    .arrow-shaft {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      background: #000;
    }

    .arrow-head {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 10px;
      height: 10px;
      border-right: 1px solid #000;
      border-bottom: 1px solid #000;
      transform:
        translate(-50%, 50%)
        rotate(45deg);
    }

    .multiple-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      text-align: center;
      font-size: clamp(28px, 7vw, 72px);
      line-height: 0.95;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      opacity: 0;
      z-index: 3;
    }

    .representations {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    .representation {
      position: absolute;
      left: 50%;
      top: 58%;
      width: min(620px, 76vw);
      transform: translate(-50%, -50%);
      opacity: 0;
    }

    .representation-visual {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: center center;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .representation-visual img {
      display: block;
      width: 70%;
      height: auto;
      max-height: 52vh;
      object-fit: contain;
    }

    .representation-caption {
      position: fixed;
      left: 24px;
      bottom: 20px;
      z-index: 20;
      font-size: 12px;
      line-height: 1.4;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
    }

    .representation-caption span {
      display: block;
    }

    @media (max-width: 700px) {
      header {
        padding: 0 16px;
      }

      .header-nav {
        gap: 12px;
        font-size: 10px;
      }

      .representation-caption {
        left: 16px;
        bottom: 16px;
      }

      .representation {
        top: 56%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-logo">CUT2</div>

    <nav class="header-nav">
      <span>SYSTEM</span>
      <span>ASSETS</span>
      <span>WORKFLOW</span>
      <span>VIDEO</span>
      <span>ACCESS</span>
      <span>CONTACT</span>
    </nav>
  </header>

  <main class="asset-system">
    <section class="stage">

      <div class="intro">
        <div
          class="intro-line"
          id="oneProject"
        >
          ONE PROJECT.
        </div>

        <div
          class="intro-line"
          id="multiplePlatforms"
        >
          MULTIPLE PLATFORMS.
        </div>
      </div>

      <div class="asset-stage">

        <div
          class="asset-label"
          id="oneAsset"
        >
          ONE ASSET
        </div>

        <div
          class="asset-card"
          id="assetCard"
        >
          <img
            src="asset-representations/library-card.png?v=3"
            alt="CUT2 asset"
          />
        </div>

        <div
          class="arrow-system"
          id="arrowSystem"
        >
          <div
            class="arrow-shaft"
            id="arrowShaft"
          ></div>

          <div class="arrow-head"></div>
        </div>

        <div
          class="multiple-label"
          id="multipleLabel"
        >
          MULTIPLE REPRESENTATIONS
        </div>

      </div>

      <div
        class="representations"
        id="representations"
      >
        <div
          class="representation"
          id="representation"
        >
          <div
            class="representation-visual"
            id="representationVisual"
          >
            <img
              id="representationImage"
              src=""
              alt=""
            />
          </div>
        </div>
      </div>

      <div
        class="representation-caption"
        id="representationCaption"
      >
        <span id="captionPlatform"></span>
        <span id="captionType"></span>
      </div>

    </section>
  </main>

  <script>
    const clamp = (value, min, max) =>
      Math.min(
        Math.max(value, min),
        max
      );

    const lerp = (a, b, t) =>
      a + (b - a) * t;

    const oneProject =
      document.getElementById(
        "oneProject"
      );

    const multiplePlatforms =
      document.getElementById(
        "multiplePlatforms"
      );

    const oneAsset =
      document.getElementById(
        "oneAsset"
      );

    const assetCard =
      document.getElementById(
        "assetCard"
      );

    const arrowSystem =
      document.getElementById(
        "arrowSystem"
      );

    const arrowShaft =
      document.getElementById(
        "arrowShaft"
      );

    const multipleLabel =
      document.getElementById(
        "multipleLabel"
      );

    const representation =
      document.getElementById(
        "representation"
      );

    const representationVisual =
      document.getElementById(
        "representationVisual"
      );

    const representationImage =
      document.getElementById(
        "representationImage"
      );

    const captionPlatform =
      document.getElementById(
        "captionPlatform"
      );

    const captionType =
      document.getElementById(
        "captionType"
      );

    const representations = [
      {
        platform: "AUTOCAD",
        type: "MINIMAL",
        src:
          "asset-representations/autocad/minimal.svg?v=3"
      },
      {
        platform: "AUTOCAD",
        type: "CONDITIONAL",
        src:
          "asset-representations/autocad/conditional.svg?v=3"
      },
      {
        platform: "AUTOCAD",
        type: "REALISTIC",
        src:
          "asset-representations/autocad/realistic.svg?v=3"
      },
      {
        platform: "SKETCHUP",
        type: "REALISTIC FACE ME",
        src:
          "asset-representations/sketchup/realistic-face-me.png?v=3"
      },
      {
        platform: "SKETCHUP",
        type: "CONDITIONAL",
        src:
          "asset-representations/sketchup/conditional.png?v=3"
      },
      {
        platform: "INDESIGN",
        type: "IMAGE",
        src:
          "asset-representations/publishing/image.jpg?v=3"
      }
    ];

    let currentCaptionIndex = -1;

    function update() {
      const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;

      const scrollY =
        window.scrollY;

      const progress =
        maxScroll > 0
          ? clamp(
              scrollY / maxScroll,
              0,
              1
            )
          : 0;


      /*
       * ------------------------------------------------------------
       * INTRO
       * ------------------------------------------------------------
       */

      const introStart = 0;
      const introEnd = 0.16;

      const introProgress =
        clamp(
          (progress - introStart) /
          (introEnd - introStart),
          0,
          1
        );

      oneProject.style.opacity =
        1 - introProgress;

      multiplePlatforms.style.opacity =
        introProgress;


      /*
       * ------------------------------------------------------------
       * ONE ASSET + CARD
       * ------------------------------------------------------------
       *
       * ONE ASSET appears together with the card.
       * Both then move upward together.
       */

      const assetStart = 0.16;
      const assetEnd = 0.30;

      const assetProgress =
        clamp(
          (progress - assetStart) /
          (assetEnd - assetStart),
          0,
          1
        );

      const assetY =
        window.innerHeight * 0.46;

      oneAsset.style.opacity =
        assetProgress;

      assetCard.style.opacity =
        assetProgress;

      oneAsset.style.transform =
        `
          translate(
            -50%,
            calc(
              -50% +
              ${-assetProgress * assetY}px
            )
          )
        `;

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(
              -50% +
              ${-assetProgress * assetY}px
            )
          )
        `;


      /*
       * ------------------------------------------------------------
       * ARROW
       * ------------------------------------------------------------
       */

      const arrowStart = 0.30;
      const arrowEnd = 0.42;

      const arrowProgress =
        clamp(
          (progress - arrowStart) /
          (arrowEnd - arrowStart),
          0,
          1
        );

      const arrowLength =
        window.innerHeight * 0.38;

      arrowSystem.style.opacity =
        progress >= arrowStart &&
        progress < 0.50
          ? 1
          : 0;

      arrowSystem.style.transform =
        `translateX(-50%)`;

      arrowShaft.style.height =
        `${arrowProgress * arrowLength}px`;

      const arrowBaseY =
        window.innerHeight * 0.12;

      arrowSystem.style.top =
        `calc(50% + ${arrowBaseY}px)`;


      /*
       * ------------------------------------------------------------
       * MULTIPLE REPRESENTATIONS
       * ------------------------------------------------------------
       */

      const labelAppearStart = 0.30;
      const labelAppearEnd = 0.34;

      const labelOpacity =
        clamp(
          (progress - labelAppearStart) /
          (labelAppearEnd - labelAppearStart),
          0,
          1
        );

      const labelMoveStart = 0.42;
      const labelMoveEnd = 0.50;

      const labelMoveProgress =
        clamp(
          (progress - labelMoveStart) /
          (labelMoveEnd - labelMoveStart),
          0,
          1
        );

      const labelTravel =
        window.innerHeight * 0.42;

      const labelY =
        -labelMoveProgress * labelTravel;

      multipleLabel.style.opacity =
        labelOpacity;

      multipleLabel.style.transform =
        `
          translate(
            -50%,
            calc(
              -50% +
              ${labelY}px
            )
          )
        `;


      /*
       * ------------------------------------------------------------
       * REPRESENTATIONS
       * ------------------------------------------------------------
       */

      const representationStart = 0.50;
      const representationEnd = 0.96;

      const representationProgress =
        clamp(
          (progress - representationStart) /
          (representationEnd - representationStart),
          0,
          1
        );

      const count =
        representations.length;

      const exactIndex =
        representationProgress *
        (count - 1);

      const index =
        Math.min(
          count - 1,
          Math.floor(exactIndex)
        );

      const localProgress =
        exactIndex - index;

      const current =
        representations[index];

      if (
        index !== currentCaptionIndex
      ) {
        currentCaptionIndex = index;

        representationImage.src =
          current.src;

        representationImage.alt =
          `${current.platform} ${current.type}`;

        captionPlatform.textContent =
          current.platform;

        captionType.textContent =
          current.type;
      }

      representation.style.opacity =
        progress >= representationStart
          ? 1
          : 0;


      /*
       * ------------------------------------------------------------
       * REPRESENTATION ROTATION
       * ------------------------------------------------------------
       *
       * First five:
       * -90° → +90°
       *
       * Last InDesign:
       * -90° → 0°
       * and then remains fixed.
       */

      const isLast =
        index === count - 1;

      if (isLast) {

        const rotation =
          lerp(
            -90,
            0,
            localProgress
          );

        const scale =
          0.92 +
          Math.sin(
            localProgress * Math.PI
          ) * 0.08;

        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      } else {

        const rotation =
          lerp(
            -90,
            90,
            localProgress
          );

        const scale =
          0.92 +
          Math.sin(
            localProgress * Math.PI
          ) * 0.08;

        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;
      }
    }


    let ticking = false;

    function requestUpdate() {
      if (!ticking) {
        window.requestAnimationFrame(
          () => {
            update();
            ticking = false;
          }
        );

        ticking = true;
      }
    }

    window.addEventListener(
      "scroll",
      requestUpdate,
      { passive: true }
    );

    window.addEventListener(
      "resize",
      update
    );

    update();
  </script>

</body>
</html>
