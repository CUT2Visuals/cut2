<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #f3f0e8;
      color: #000;

      font-family:
        "IBM Plex Mono",
        "Courier New",
        monospace;
    }

    body {
      overflow-x: hidden;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #000;
      background: #f3f0e8;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
      font-weight: 400;
    }

    .header-title {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       MAIN SYSTEM
    ================================================== */

    .asset-system {
      position: relative;
      height: 700vh;
    }

    .sticky-stage {
      position: sticky;

      top: 0;

      width: 100%;
      height: 100vh;

      overflow: hidden;
    }


    /* ==================================================
       UPPER SYSTEM
    ================================================== */

    .project-label,
    .platforms-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;

      z-index: 8;
    }

    .platforms-label {
      opacity: 0;
    }


    /* ==================================================
       PLATFORM ROW
    ================================================== */

    .platforms-row {
      position: absolute;

      left: 50%;
      top: calc(50% + clamp(90px, 7vw, 120px));

      width: min(560px, 80vw);

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      transform:
        translate(-50%, -50%);

      opacity: 1;

      z-index: 8;
    }

    .platform-item {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;

      width: 72px;
    }

    .platform-icon {
      width: 72px;
      height: 72px;

      object-fit: contain;

      opacity: 0;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .platform-name {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;

      white-space: nowrap;

      opacity: 0;
    }


    /* ==================================================
       UPPER ARROWS
    ================================================== */

    .upper-arrow {
      position: absolute;

      left: 50%;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 7;

      transform: translateX(-50%);
    }

    .upper-arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .upper-arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .upper-arrow-head::before,
    .upper-arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .upper-arrow-head::before {
      transform: rotate(225deg);
    }

    .upper-arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       ONE ASSET
    ================================================== */

    .asset-card {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(252px, 49vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      z-index: 5;
    }

    .asset-label {
      position: absolute;

      left: 50%;
      bottom: calc(100% + 28px);

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }


    /* ==================================================
       LOWER ARROW
    ================================================== */

    .arrow-system {
      position: absolute;

      left: 50%;
      top: 0;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 4;

      transform: translateX(-50%);
    }

    .arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .arrow-head::before,
    .arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .arrow-head::before {
      transform: rotate(225deg);
    }

    .arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       MULTIPLE REPRESENTATIONS
    ================================================== */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;

      z-index: 3;
    }


    /* ==================================================
       REPRESENTATIONS
    ================================================== */

    .representation {
      position: absolute;

      left: 50%;
      top: 58%;

      width: min(620px, 76vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      pointer-events: none;

      z-index: 2;
    }

    .representation-visual {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .representation-image {
      display: block;

      width: 70%;
      height: 70%;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       NEXT
    ================================================== */

    .next {
      min-height: 100vh;

      border-top: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(24px, 4vw, 56px);
      font-weight: 400;

      text-align: center;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 10px;
      }

      .asset-system {
        height: 700vh;
      }

      .sticky-stage {
        height: 100svh;
      }

      .project-label,
      .platforms-label {
        font-size: 26px;
      }

      .platforms-row {
        top: calc(50% + 62px);
        width: 78vw;
      }

      .platform-item {
        width: 52px;
        gap: 12px;
      }

      .platform-icon {
        width: 52px;
        height: 52px;
      }

      .platform-name {
        font-size: 10px;
      }

      .asset-card {
        width: min(210px, 53vw);
      }

      .asset-label {
        bottom: calc(100% + 20px);
        font-size: 26px;
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 26px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
        top: 59%;
      }

      .representation-visual {
        height: 48svh;
      }

      .representation-image {
        width: 70%;
        height: 70%;
      }

      .representation-info {
        margin-top: 12px;
        font-size: 10px;
      }

      .next {
        min-height: 100svh;
        font-size: 26px;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="logo">
    CUT2
  </div>

  <div class="header-title">
    Asset Representations
  </div>

</header>


<main>


  <!-- ==================================================
       ASSET SYSTEM
  ================================================== -->

  <section class="asset-system">

    <div class="sticky-stage">


      <!-- ==================================================
           ONE PROJECT
      ================================================== -->

      <div
        class="project-label"
        id="projectLabel"
      >
        ONE PROJECT
      </div>


      <!-- ==================================================
           ARROW: PROJECT
      ================================================== -->

      <div
        class="upper-arrow"
        id="projectArrow"
      >

        <div class="upper-arrow-shaft"></div>

        <div class="upper-arrow-head"></div>

      </div>


      <!-- ==================================================
           MULTIPLE PLATFORMS
      ================================================== -->

      <div
        class="platforms-label"
        id="platformsLabel"
      >
        MULTIPLE PLATFORMS
      </div>


      <!-- ==================================================
           PLATFORMS
      ================================================== -->

      <div
        class="platforms-row"
        id="platformsRow"
      >

        <div class="platform-item">

          <img
            class="platform-icon"
            id="platformAutoCAD"
            src="prototypes/asset-representations/asset-representations/platforms/autocad.svg"
            alt="AutoCAD"
          >

          <div
            class="platform-name"
            id="platformAutoCADName"
          >
            AUTOCAD
          </div>

        </div>


        <div class="platform-item">

          <img
            class="platform-icon"
            id="platformSketchUp"
            src="prototypes/asset-representations/asset-representations/platforms/sketchup.svg"
            alt="SketchUp"
          >

          <div
            class="platform-name"
            id="platformSketchUpName"
          >
            SKETCHUP
          </div>

        </div>


        <div class="platform-item">

          <img
            class="platform-icon"
            id="platformInDesign"
            src="prototypes/asset-representations/asset-representations/platforms/indesign.svg"
            alt="InDesign"
          >

          <div
            class="platform-name"
            id="platformInDesignName"
          >
            INDESIGN
          </div>

        </div>

      </div>


      <!-- ==================================================
           ARROW: PLATFORMS → ASSET
      ================================================== -->

      <div
        class="upper-arrow"
        id="platformArrow"
      >

        <div class="upper-arrow-shaft"></div>

        <div class="upper-arrow-head"></div>

      </div>


      <!-- ==================================================
           ONE ASSET
      ================================================== -->

      <div
        class="asset-card"
        id="assetCard"
      >

        <div class="asset-label">
          ONE ASSET
        </div>

        <img
          src="prototypes/asset-representations/asset-representations/library-card.png?v=3"
          alt="CUT2 Asset Library"
        >

      </div>


      <!-- ==================================================
           LOWER ARROW
      ================================================== -->

      <div
        class="arrow-system"
        id="arrowSystem"
      >

        <div
          class="arrow-shaft"
          id="arrowShaft"
        ></div>

        <div class="arrow-head"></div>

      </div>


      <!-- ==================================================
           MULTIPLE REPRESENTATIONS
      ================================================== -->

      <div
        class="multiple-label"
        id="multipleLabel"
      >
        MULTIPLE REPRESENTATIONS
      </div>


      <!-- ==================================================
           REPRESENTATION
      ================================================== -->

      <div
        class="representation"
        id="representation"
      >

        <div
          class="representation-visual"
          id="representationVisual"
        >

          <img
            id="representationImage"
            class="representation-image"
            src="prototypes/asset-representations/asset-representations/autocad/minimal.svg?v=3"
            alt="AutoCAD Minimal"
          >

        </div>


        <div class="representation-info">

          <span id="representationPlatform">
            AUTOCAD
          </span>

          <span id="representationType">
            MINIMAL
          </span>

        </div>

      </div>


    </div>

  </section>


  <!-- ==================================================
       NEXT
  ================================================== -->

  <section class="next">

    THE SYSTEM CONTINUES.

  </section>


</main>



<script>

  /* ==================================================
     ELEMENTS
  ================================================== */

  const projectLabel =
    document.getElementById("projectLabel");

  const projectArrow =
    document.getElementById("projectArrow");

  const platformsLabel =
    document.getElementById("platformsLabel");

  const platformsRow =
    document.getElementById("platformsRow");

  const platformIcons = [

    document.getElementById("platformAutoCAD"),
    document.getElementById("platformSketchUp"),
    document.getElementById("platformInDesign")

  ];

  const platformNames = [

    document.getElementById("platformAutoCADName"),
    document.getElementById("platformSketchUpName"),
    document.getElementById("platformInDesignName")

  ];

  const platformArrow =
    document.getElementById("platformArrow");

  const assetCard =
    document.getElementById("assetCard");

  const assetLabel =
    assetCard.querySelector(".asset-label");

  const arrowSystem =
    document.getElementById("arrowSystem");

  const multipleLabel =
    document.getElementById("multipleLabel");

  const representation =
    document.getElementById("representation");

  const representationVisual =
    document.getElementById("representationVisual");

  const representationImage =
    document.getElementById("representationImage");

  const representationPlatform =
    document.getElementById("representationPlatform");

  const representationType =
    document.getElementById("representationType");


  /* ==================================================
     DATA
  ================================================== */

  const representations = [

    {
      platform: "AUTOCAD",
      type: "MINIMAL",
      src: "prototypes/asset-representations/asset-representations/autocad/minimal.svg?v=3"
    },

    {
      platform: "AUTOCAD",
      type: "CONDITIONAL",
      src: "prototypes/asset-representations/asset-representations/autocad/conditional.svg?v=3"
    },

    {
      platform: "AUTOCAD",
      type: "REALISTIC",
      src: "prototypes/asset-representations/asset-representations/autocad/realistic.svg?v=3"
    },

    {
      platform: "SKETCHUP",
      type: "REALISTIC FACE ME",
      src: "prototypes/asset-representations/asset-representations/sketchup/realistic-face-me.png?v=3"
    },

    {
      platform: "SKETCHUP",
      type: "CONDITIONAL",
      src: "prototypes/asset-representations/asset-representations/sketchup/conditional.png?v=3"
    },

    {
      platform: "INDESIGN",
      type: "IMAGE",
      src: "prototypes/asset-representations/asset-representations/publishing/image.jpg?v=3"
    }

  ];


  /* ==================================================
     HELPERS
  ================================================== */

  function clamp(value, min, max) {

    return Math.max(
      min,
      Math.min(max, value)
    );

  }


  function lerp(a, b, t) {

    return a + (b - a) * t;

  }


  /* ==================================================
     ANIMATION
  ================================================== */

  function updateAnimation() {

    const section =
      document.querySelector(".asset-system");

    const stage =
      document.querySelector(".sticky-stage");

    const header =
      document.querySelector("header");


    const sectionRect =
      section.getBoundingClientRect();

    const stageRect =
      stage.getBoundingClientRect();

    const headerRect =
      header.getBoundingClientRect();


    const scrollable =
      section.offsetHeight -
      window.innerHeight;

    const passed =
      clamp(
        -sectionRect.top,
        0,
        scrollable
      );

    const progress =
      passed / scrollable;


    const centerY =
      window.innerHeight / 2;

    const headerGap =
      24;


    /* ==================================================
       1. ONE PROJECT
       CENTER → UNDER HEADER

       IMPORTANT:
       The final center is ABOVE the viewport.
       The fixed header physically covers the label.
    ================================================== */

    const projectMoveStart = 0.04;
    const projectMoveEnd = 0.16;

    const projectMoveProgress =
      clamp(
        (progress - projectMoveStart) /
        (projectMoveEnd - projectMoveStart),
        0,
        1
      );


    const projectHeight =
      projectLabel.offsetHeight;

    const projectUpY =
      headerRect.top -
      headerGap -
      projectHeight / 2 -
      centerY;


    const projectY =
      projectUpY *
      projectMoveProgress;


    projectLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${projectY}px)
        )
      `;


    /* ==================================================
       2. ARROW ATTACHED TO ONE PROJECT
       PROJECT → MULTIPLE PLATFORMS

       Arrow duration is 1.5× faster.
       Bottom follows the actual top of
       MULTIPLE PLATFORMS.
    ================================================== */

    const projectArrowStart = 0.07;

    const projectArrowDuration =
      (0.14 - 0.07) / 1.5;

    const projectArrowEnd =
      projectArrowStart +
      projectArrowDuration;

    const projectArrowProgress =
      clamp(
        (progress - projectArrowStart) /
        (projectArrowEnd - projectArrowStart),
        0,
        1
      );


    const projectRect =
      projectLabel.getBoundingClientRect();

    const projectBottom =
      projectRect.bottom -
      stageRect.top;


    const platformsLabelRect =
      platformsLabel.getBoundingClientRect();

    const platformsLabelTop =
      platformsLabelRect.top -
      stageRect.top;


    const projectArrowLength =
      Math.max(
        0,
        platformsLabelTop -
        projectBottom
      );


    projectArrow.style.top =
      `${projectBottom}px`;

    projectArrow.style.height =
      `${projectArrowLength * projectArrowProgress}px`;

    projectArrow.style.opacity =
      progress >= projectArrowStart &&
      progress < 0.18
        ? 1
        : 0;


    /* ==================================================
       3. MULTIPLE PLATFORMS
       CENTER → UNDER HEADER
    ================================================== */

    const platformsAppearStart = 0.15;
    const platformsAppearEnd = 0.19;

    const platformsOpacity =
      clamp(
        (progress - platformsAppearStart) /
        (platformsAppearEnd - platformsAppearStart),
        0,
        1
      );


    platformsLabel.style.opacity =
      platformsOpacity;

    platformsLabel.style.transform =
      `translate(-50%, -50%)`;


    /* ==================================================
       4. PLATFORM ICONS + LABELS
    ================================================== */

    const iconStart = 0.19;
    const iconStep = 0.035;
    const iconDuration = 0.05;


    platformIcons.forEach(
      (icon, index) => {

        const start =
          iconStart +
          index * iconStep;

        const end =
          start +
          iconDuration;


        const iconProgress =
          clamp(
            (progress - start) /
            (end - start),
            0,
            1
          );


        const rotation =
          lerp(
            -90,
            0,
            iconProgress
          );


        const scale =
          0.92 +
          Math.sin(
            iconProgress * Math.PI
          ) * 0.08;


        icon.style.opacity =
          iconProgress;

        icon.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;


        platformNames[index].style.opacity =
          iconProgress;

      }
    );


    /* ==================================================
       5. PLATFORM GROUP
       LABEL + ICONS + LABELS
       CENTER → UNDER HEADER
    ================================================== */

    const groupMoveStart = 0.32;
    const groupMoveEnd = 0.46;

    const groupMoveProgress =
      clamp(
        (progress - groupMoveStart) /
        (groupMoveEnd - groupMoveStart),
        0,
        1
      );


    const platformsLabelHeight =
      platformsLabel.offsetHeight;


    /*
      Move MULTIPLE PLATFORMS upward by its own
      height, doubling the distance between the
      label and the platform icons.
    */

    const platformsLabelOffsetY =
      -platformsLabelHeight;


    /*
      The whole group continues upward until
      MULTIPLE PLATFORMS is physically behind
      the fixed header.
    */

    const groupUpY =
      headerRect.top -
      headerGap -
      platformsLabelHeight / 2 -
      centerY;


    const groupY =
      groupUpY *
      groupMoveProgress;


    platformsLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${groupY + platformsLabelOffsetY}px)
        )
      `;


    platformsRow.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${groupY}px)
        )
      `;


    /* ==================================================
       6. ONE ASSET
       GEOMETRIC HOME CENTER = SCREEN CENTER

       The asset-card itself has no additional
       vertical home offset. Its geometric center
       therefore sits exactly at the stage center.
    ================================================== */

    const assetCardHeight =
      assetCard.offsetHeight;

    const assetLabelHeight =
      assetLabel.offsetHeight;


    const assetLabelGap =
      window.innerWidth <= 700
        ? 20
        : 28;


    const assetHomeShift =
      0;


    const assetStartShift =
      window.innerHeight * 0.95;


    const assetMoveStart = 0.42;
    const assetMoveEnd = 0.53;

    const assetMoveProgress =
      clamp(
        (progress - assetMoveStart) /
        (assetMoveEnd - assetMoveStart),
        0,
        1
      );


    const assetY =
      lerp(
        assetStartShift,
        assetHomeShift,
        assetMoveProgress
      );


    if (progress < assetMoveStart) {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetStartShift}px)
          )
        `;

    }

    else {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetY}px)
          )
        `;

    }


    const assetVisibilityStart = 0.40;
    const assetVisibilityEnd = 0.47;

    const assetVisibility =
      clamp(
        (progress - assetVisibilityStart) /
        (assetVisibilityEnd - assetVisibilityStart),
        0,
        1
      );


    assetCard.style.opacity =
      assetVisibility;


    /* ==================================================
       7. ARROW
       PLATFORM GROUP → ONE ASSET

       Top remains attached to the platform row.
       Bottom is attached to the actual ONE ASSET
       label, so it follows the asset while it moves.
    ================================================== */

    const platformArrowStart = 0.38;

    const platformArrowDuration =
      (0.51 - 0.38) / 1.5;

    const platformArrowEnd =
      platformArrowStart +
      platformArrowDuration;

    const platformArrowProgress =
      clamp(
        (progress - platformArrowStart) /
        (platformArrowEnd - platformArrowStart),
        0,
        1
      );


    const rowRect =
      platformsRow.getBoundingClientRect();

    const rowBottom =
      rowRect.bottom -
      stageRect.top;


    const assetLabelRect =
      assetLabel.getBoundingClientRect();

    const assetLabelTop =
      assetLabelRect.top -
      stageRect.top;


    const platformArrowLength =
      Math.max(
        0,
        assetLabelTop -
        rowBottom
      );


    platformArrow.style.top =
      `${rowBottom}px`;

    platformArrow.style.height =
      `${platformArrowLength * platformArrowProgress}px`;

    platformArrow.style.opacity =
      platformArrowProgress > 0 &&
      platformArrowLength > 0 &&
      progress < 0.55
        ? 1
        : 0;


    /* ==================================================
       8. ONE ASSET → MULTIPLE REPRESENTATIONS
       EXISTING LOWER MECHANICS
    ================================================== */

    const cardStart = 0.56;
    const cardEnd = 0.66;

    const cardProgress =
      clamp(
        (progress - cardStart) /
        (cardEnd - cardStart),
        0,
        1
      );


    const cardTravel =
      window.innerHeight * 0.82;


    const cardY =
      -cardProgress *
      cardTravel;


    assetCard.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${assetHomeShift + cardY}px)
        )
      `;


    /* ==================================================
       9. MULTIPLE REPRESENTATIONS LABEL
    ================================================== */

    const labelAppearStart = 0.66;
    const labelAppearEnd = 0.70;

    const labelOpacity =
      clamp(
        (progress - labelAppearStart) /
        (labelAppearEnd - labelAppearStart),
        0,
        1
      );


    const labelMoveStart = 0.76;
    const labelMoveEnd = 0.84;

    const labelMoveProgress =
      clamp(
        (progress - labelMoveStart) /
        (labelMoveEnd - labelMoveStart),
        0,
        1
      );


    const labelHeight =
      multipleLabel.offsetHeight;


    const finalLabelTop =
      headerRect.bottom +
      headerGap;

    const finalLabelCenter =
      finalLabelTop +
      labelHeight / 2;


    const labelTravel =
      centerY -
      finalLabelCenter;


    const labelY =
      -labelMoveProgress *
      labelTravel;


    multipleLabel.style.opacity =
      labelOpacity;


    if (window.innerWidth <= 700) {

      const mobileStartTop =
        centerY -
        labelHeight / 2;

      const mobileTop =
        lerp(
          mobileStartTop,
          finalLabelTop,
          labelMoveProgress
        );

      multipleLabel.style.top =
        `${mobileTop}px`;

      multipleLabel.style.transform =
        `translateX(-50%)`;

    }

    else {

      multipleLabel.style.top =
        `50%`;

      multipleLabel.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${labelY}px)
          )
        `;

    }


    /* ==================================================
       10. LOWER ARROW
    ================================================== */

    const arrowStart = 0.56;
    const arrowEnd = 0.70;

    const arrowProgress =
      clamp(
        (progress - arrowStart) /
        (arrowEnd - arrowStart),
        0,
        1
      );


    const cardRect =
      assetCard.getBoundingClientRect();


    const cardBottom =
      cardRect.bottom -
      stageRect.top;


    const arrowLabelGap =
      24;


    const labelRect =
      multipleLabel.getBoundingClientRect();

    const labelTop =
      labelRect.top -
      stageRect.top;


    const restingArrowLength =
      Math.max(
        0,
        labelTop -
        cardBottom -
        arrowLabelGap
      );


    arrowSystem.style.opacity =
      progress >= arrowStart &&
      progress < 0.76
        ? 1
        : 0;


    if (progress < labelMoveStart) {

      arrowSystem.style.top =
        `${cardBottom}px`;

      arrowSystem.style.height =
        `${restingArrowLength * arrowProgress}px`;

    }

    else {

      const currentLabelTop =
        labelRect.top -
        stageRect.top;

      const arrowTop =
        currentLabelTop -
        arrowLabelGap -
        restingArrowLength;


      arrowSystem.style.top =
        `${arrowTop}px`;

      arrowSystem.style.height =
        `${restingArrowLength}px`;

    }


    arrowSystem.style.transform =
      `translateX(-50%)`;


    /* ==================================================
       11. REPRESENTATIONS
    ================================================== */

    const representationStart = 0.80;
    const representationEnd = 0.96;


    const representationProgress =
      clamp(
        (progress - representationStart) /
        (representationEnd - representationStart),
        0,
        1
      );


    if (progress >= representationStart) {

      representation.style.opacity = 1;

      arrowSystem.style.opacity = 0;


      const count =
        representations.length;


      if (progress < representationEnd) {

        const firstFiveCount =
          count - 1;

        const firstFiveProgress =
          representationProgress *
          firstFiveCount;

        const index =
          Math.min(
            firstFiveCount - 1,
            Math.floor(firstFiveProgress)
          );

        const localProgress =
          firstFiveProgress -
          index;

        const current =
          representations[index];


        representationImage.src =
          current.src;

        representationImage.alt =
          `${current.platform} ${current.type}`;

        representationPlatform.textContent =
          current.platform;

        representationType.textContent =
          current.type;


        const rotation =
          lerp(
            -90,
            90,
            localProgress
          );


        const scale =
          0.92 +
          Math.sin(
            localProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

      else {

        const finalProgress =
          clamp(
            (progress - representationEnd) /
            (1 - representationEnd),
            0,
            1
          );


        const current =
          representations[count - 1];


        representationImage.src =
          current.src;

        representationImage.alt =
          `${current.platform} ${current.type}`;

        representationPlatform.textContent =
          current.platform;

        representationType.textContent =
          current.type;


        const rotation =
          lerp(
            -90,
            0,
            finalProgress
          );


        const scale =
          0.92 +
          Math.sin(
            finalProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

    }

    else {

      representation.style.opacity = 0;

    }


    requestAnimationFrame(
      updateAnimation
    );

  }


  updateAnimation();

</script>
