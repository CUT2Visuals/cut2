<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #f3f0e8;
      color: #000;

      font-family:
        "IBM Plex Mono",
        "Courier New",
        monospace;
    }

    body {
      overflow-x: hidden;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #000;
      background: #f3f0e8;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
      font-weight: 400;
    }

    .header-title {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       INTRO
    ================================================== */

    .intro {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
    }


    /* ==================================================
       MAIN SYSTEM
    ================================================== */

    .asset-system {
      position: relative;
      height: 700vh;
    }

    .sticky-stage {
      position: sticky;

      top: 0;

      width: 100%;
      height: 100vh;

      overflow: hidden;
    }


    /* ==================================================
       UPPER SYSTEM
    ================================================== */

    .project-label {
      position: absolute;

      left: 50%;
      top: 27%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;

      z-index: 8;
    }

    .platforms-label {
      position: absolute;

      left: 50%;
      top: 47%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;

      opacity: 0;

      z-index: 8;
    }

    .platforms-row {
      position: absolute;

      left: 50%;
      top: 62%;

      width: min(560px, 80vw);

      display: flex;
      align-items: center;
      justify-content: space-between;

      transform:
        translate(-50%, -50%);

      opacity: 1;

      z-index: 8;
    }

    .platform-icon {
      width: 72px;
      height: 72px;

      object-fit: contain;

      opacity: 0;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .upper-arrow {
      position: absolute;

      left: 50%;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 7;

      transform: translateX(-50%);
    }

    .upper-arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .upper-arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .upper-arrow-head::before,
    .upper-arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .upper-arrow-head::before {
      transform: rotate(225deg);
    }

    .upper-arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       ONE ASSET
    ================================================== */

    .asset-card {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(252px, 49vw);

      transform:
        translate(-50%, -50%);

      z-index: 5;
    }

    .asset-label {
      position: absolute;

      left: 50%;
      bottom: calc(100% + 28px);

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }


    /* ==================================================
       ARROW
    ================================================== */

    .arrow-system {
      position: absolute;

      left: 50%;
      top: 0;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 4;

      transform: translateX(-50%);
    }

    .arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .arrow-head::before,
    .arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .arrow-head::before {
      transform: rotate(225deg);
    }

    .arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       MULTIPLE REPRESENTATIONS
    ================================================== */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;

      z-index: 3;
    }


    /* ==================================================
       REPRESENTATIONS
    ================================================== */

    .representation {
      position: absolute;

      left: 50%;
      top: 58%;

      width: min(620px, 76vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      pointer-events: none;

      z-index: 2;
    }

    .representation-visual {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .representation-image {
      display: block;

      width: 70%;
      height: 70%;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       NEXT
    ================================================== */

    .next {
      min-height: 100vh;

      border-top: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(24px, 4vw, 56px);
      font-weight: 400;

      text-align: center;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 10px;
      }

      .intro {
        min-height: 100svh;
        font-size: 26px;
      }

      .asset-system {
        height: 700vh;
      }

      .sticky-stage {
        height: 100svh;
      }

      .project-label {
        top: 25%;
        font-size: 26px;
      }

      .platforms-label {
        top: 44%;
        font-size: 26px;
      }

      .platforms-row {
        top: 59%;
        width: 78vw;
      }

      .platform-icon {
        width: 52px;
        height: 52px;
      }

      .asset-card {
        width: min(210px, 53vw);
      }

      .asset-label {
        bottom: calc(100% + 20px);
        font-size: 26px;
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 26px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
        top: 59%;
      }

      .representation-visual {
        height: 48svh;
      }

      .representation-image {
        width: 70%;
        height: 70%;
      }

      .representation-info {
        margin-top: 12px;
        font-size: 10px;
      }

      .next {
        min-height: 100svh;
        font-size: 26px;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="logo">
    CUT2
  </div>

  <div class="header-title">
    Asset Representations
  </div>

</header>


<main>


  <!-- ==================================================
       INTRO
  ================================================== -->

  <section class="intro">

    <div>
      ONE PROJECT.<br>
      MULTIPLE PLATFORMS.
    </div>

  </section>



  <!-- ==================================================
       ASSET SYSTEM
  ================================================== -->

  <section class="asset-system">

    <div class="sticky-stage">


      <!-- ==================================================
           UPPER SYSTEM
      ================================================== -->

      <!-- ONE PROJECT -->

      <div
        class="project-label"
        id="projectLabel"
      >
        ONE PROJECT.
      </div>


      <!-- ARROW: ONE PROJECT → MULTIPLE PLATFORMS -->

      <div
        class="upper-arrow"
        id="projectArrow"
      >

        <div class="upper-arrow-shaft"></div>

        <div class="upper-arrow-head"></div>

      </div>


      <!-- MULTIPLE PLATFORMS -->

      <div
        class="platforms-label"
        id="platformsLabel"
      >
        MULTIPLE PLATFORMS
      </div>


      <!-- PLATFORM ICONS -->

      <div
        class="platforms-row"
        id="platformsRow"
      >

        <img
          class="platform-icon"
          id="platformAutoCAD"
          src="prototypes/asset-representations/asset-representations/platforms/autocad.svg"
          alt="AutoCAD"
        >

        <img
          class="platform-icon"
          id="platformSketchUp"
          src="prototypes/asset-representations/asset-representations/platforms/sketchup.svg"
          alt="SketchUp"
        >

        <img
          class="platform-icon"
          id="platformInDesign"
          src="prototypes/asset-representations/asset-representations/platforms/indesign.svg"
          alt="InDesign"
        >

      </div>


      <!-- ARROW: PLATFORMS → ONE ASSET -->

      <div
        class="upper-arrow"
        id="platformArrow"
      >

        <div class="upper-arrow-shaft"></div>

        <div class="upper-arrow-head"></div>

      </div>



      <!-- ==================================================
           ONE ASSET
      ================================================== -->

      <div
        class="asset-card"
        id="assetCard"
      >

        <div class="asset-label">
          ONE ASSET.
        </div>

        <img
          src="prototypes/asset-representations/asset-representations/library-card.png?v=3"
          alt="CUT2 Asset Library"
        >

      </div>



      <!-- ==================================================
           ARROW
      ================================================== -->

      <div
        class="arrow-system"
        id="arrowSystem"
      >

        <div
          class="arrow-shaft"
          id="arrowShaft"
        ></div>

        <div class="arrow-head"></div>

      </div>



      <!-- ==================================================
           MULTIPLE REPRESENTATIONS
      ================================================== -->

      <div
        class="multiple-label"
        id="multipleLabel"
      >
        MULTIPLE REPRESENTATIONS
      </div>



      <!-- ==================================================
           REPRESENTATION
      ================================================== -->

      <div
        class="representation"
        id="representation"
      >

        <div
          class="representation-visual"
          id="representationVisual"
        >

          <img
            id="representationImage"
            class="representation-image"
            src="prototypes/asset-representations/asset-representations/autocad/minimal.svg?v=3"
            alt="AutoCAD Minimal"
          >

        </div>


        <div class="representation-info">

          <span id="representationPlatform">
            AUTOCAD
          </span>

          <span id="representationType">
            MINIMAL
          </span>

        </div>

      </div>


    </div>

  </section>



  <!-- ==================================================
       NEXT
  ================================================== -->

  <section class="next">

    THE SYSTEM CONTINUES.

  </section>


</main>



<script>

  /* ==================================================
     UPPER SYSTEM
  ================================================== */

  const projectLabel =
    document.getElementById("projectLabel");

  const projectArrow =
    document.getElementById("projectArrow");

  const platformsLabel =
    document.getElementById("platformsLabel");

  const platformsRow =
    document.getElementById("platformsRow");

  const platformIcons = [

    document.getElementById("platformAutoCAD"),
    document.getElementById("platformSketchUp"),
    document.getElementById("platformInDesign")

  ];

  const platformArrow =
    document.getElementById("platformArrow");


  /* ==================================================
     ONE ASSET + LOWER SYSTEM
     (UNCHANGED)
  ================================================== */

  const assetCard =
    document.getElementById("assetCard");

  const arrowSystem =
    document.getElementById("arrowSystem");

  const multipleLabel =
    document.getElementById("multipleLabel");

  const representation =
    document.getElementById("representation");

  const representationVisual =
    document.getElementById("representationVisual");

  const representationImage =
    document.getElementById("representationImage");

  const representationPlatform =
    document.getElementById("representationPlatform");

  const representationType =
    document.getElementById("representationType");


  /* ==================================================
     REPRESENTATION DATA
  ================================================== */

  const representations = [

    {
      platform: "AUTOCAD",
      type: "MINIMAL",
      src: "prototypes/asset-representations/asset-representations/autocad/minimal.svg?v=3"
    },

    {
      platform: "AUTOCAD",
      type: "CONDITIONAL",
      src: "prototypes/asset-representations/asset-representations/autocad/conditional.svg?v=3"
    },

    {
      platform: "AUTOCAD",
      type: "REALISTIC",
      src: "prototypes/asset-representations/asset-representations/autocad/realistic.svg?v=3"
    },

    {
      platform: "SKETCHUP",
      type: "REALISTIC FACE ME",
      src: "prototypes/asset-representations/asset-representations/sketchup/realistic-face-me.png?v=3"
    },

    {
      platform: "SKETCHUP",
      type: "CONDITIONAL",
      src: "prototypes/asset-representations/asset-representations/sketchup/conditional.png?v=3"
    },

    {
      platform: "INDESIGN",
      type: "IMAGE",
      src: "prototypes/asset-representations/asset-representations/publishing/image.jpg?v=3"
    }

  ];


  /* ==================================================
     HELPERS
  ================================================== */

  function clamp(value, min, max) {

    return Math.max(
      min,
      Math.min(max, value)
    );

  }


  function lerp(a, b, t) {

    return a + (b - a) * t;

  }


  /* ==================================================
     ANIMATION
  ================================================== */

  function updateAnimation() {

    const section =
      document.querySelector(".asset-system");

    const rect =
      section.getBoundingClientRect();

    const scrollable =
      section.offsetHeight - window.innerHeight;

    const passed =
      clamp(
        -rect.top,
        0,
        scrollable
      );

    const progress =
      passed / scrollable;


    /* ==================================================
       0. UPPER SYSTEM
    ================================================== */

    /*
      The upper choreography occupies the beginning
      of the same sticky sequence.

      0.00–0.05
      ONE PROJECT stays alone.

      0.03–0.08
      Arrow grows toward MULTIPLE PLATFORMS.

      0.05–0.09
      MULTIPLE PLATFORMS appears.

      0.07–0.15
      Platform icons appear one by one,
      each rotating -90° → 0°.

      0.12–0.18
      The complete platform group moves upward.

      0.14–0.18
      Second arrow appears toward ONE ASSET.
    */


    const projectFadeEnd = 0.20;

    const projectFade =
      1 -
      clamp(
        (progress - 0.12) /
        (projectFadeEnd - 0.12),
        0,
        1
      );

    projectLabel.style.opacity =
      projectFade;


    /* ------------------------------------------
       FIRST ARROW
       ONE PROJECT → MULTIPLE PLATFORMS
    ------------------------------------------ */

    const projectArrowStart = 0.03;
    const projectArrowEnd = 0.08;

    const projectArrowProgress =
      clamp(
        (progress - projectArrowStart) /
        (projectArrowEnd - projectArrowStart),
        0,
        1
      );


    const projectRect =
      projectLabel.getBoundingClientRect();

    const platformsLabelRect =
      platformsLabel.getBoundingClientRect();


    const stage =
      document.querySelector(".sticky-stage");

    const stageRect =
      stage.getBoundingClientRect();


    const projectBottom =
      projectRect.bottom -
      stageRect.top;

    const platformsLabelTop =
      platformsLabelRect.top -
      stageRect.top;


    const projectArrowGap =
      24;


    const projectArrowLength =
      Math.max(
        0,
        platformsLabelTop -
        projectBottom -
        projectArrowGap
      );


    projectArrow.style.opacity =
      projectArrowProgress > 0 &&
      progress < 0.12
        ? 1
        : 0;

    projectArrow.style.top =
      `${projectBottom}px`;

    projectArrow.style.height =
      `${projectArrowLength * projectArrowProgress}px`;


    /* ------------------------------------------
       MULTIPLE PLATFORMS
    ------------------------------------------ */

    const platformsAppearStart = 0.05;
    const platformsAppearEnd = 0.09;

    const platformsOpacity =
      clamp(
        (progress - platformsAppearStart) /
        (platformsAppearEnd - platformsAppearStart),
        0,
        1
      );


    platformsLabel.style.opacity =
      platformsOpacity;


    /* ------------------------------------------
       PLATFORM ICONS
    ------------------------------------------ */

    const iconStart = 0.07;
    const iconStep = 0.025;
    const iconDuration = 0.05;


    platformIcons.forEach(
      (icon, index) => {

        const start =
          iconStart +
          index * iconStep;

        const end =
          start +
          iconDuration;

        const iconProgress =
          clamp(
            (progress - start) /
            (end - start),
            0,
            1
          );


        const rotation =
          lerp(
            -90,
            0,
            iconProgress
          );


        const scale =
          0.92 +
          Math.sin(
            iconProgress * Math.PI
          ) * 0.08;


        icon.style.opacity =
          iconProgress;

        icon.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }
    );


    /* ------------------------------------------
       GROUP MOVE
       PLATFORMS → UP
    ------------------------------------------ */

    const groupMoveStart = 0.12;
    const groupMoveEnd = 0.18;

    const groupMoveProgress =
      clamp(
        (progress - groupMoveStart) /
        (groupMoveEnd - groupMoveStart),
        0,
        1
      );


    const groupTravel =
      window.innerHeight *
      0.20;


    const groupY =
      -groupMoveProgress *
      groupTravel;


    platformsLabel.style.marginTop =
      `${groupY}px`;

    platformsRow.style.marginTop =
      `${groupY}px`;


    /* ------------------------------------------
       SECOND ARROW
       PLATFORM GROUP → ONE ASSET
    ------------------------------------------ */

    const platformArrowStart = 0.14;
    const platformArrowEnd = 0.18;

    const platformArrowProgress =
      clamp(
        (progress - platformArrowStart) /
        (platformArrowEnd - platformArrowStart),
        0,
        1
      );


    const rowRect =
      platformsRow.getBoundingClientRect();

    const assetLabelElement =
      document.querySelector(".asset-label");

    const assetLabelRect =
      assetLabelElement.getBoundingClientRect();


    const rowBottom =
      rowRect.bottom -
      stageRect.top;

    const assetLabelTop =
      assetLabelRect.top -
      stageRect.top;


    const platformArrowGap =
      24;


    const platformArrowLength =
      Math.max(
        0,
        assetLabelTop -
        rowBottom -
        platformArrowGap
      );


    platformArrow.style.opacity =
      platformArrowProgress > 0 &&
      progress < 0.30
        ? 1
        : 0;

    platformArrow.style.top =
      `${rowBottom}px`;

    platformArrow.style.height =
      `${platformArrowLength * platformArrowProgress}px`;



    /* ==================================================
       1. ONE ASSET + CARD
    ================================================== */

    const cardStart = 0.18;
    const cardEnd = 0.30;

    const cardProgress =
      clamp(
        (progress - cardStart) /
        (cardEnd - cardStart),
        0,
        1
      );

    const cardTravel =
      window.innerHeight * 0.82;

    const cardY =
      -cardProgress * cardTravel;


    assetCard.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${cardY}px)
        )
      `;



    /* ==================================================
       2. MULTIPLE REPRESENTATIONS
    ================================================== */

    const labelAppearStart = 0.30;
    const labelAppearEnd = 0.34;

    const labelOpacity =
      clamp(
        (progress - labelAppearStart) /
        (labelAppearEnd - labelAppearStart),
        0,
        1
      );


    const labelMoveStart = 0.42;
    const labelMoveEnd = 0.50;

    const labelMoveProgress =
      clamp(
        (progress - labelMoveStart) /
        (labelMoveEnd - labelMoveStart),
        0,
        1
      );


    const header =
      document.querySelector("header");

    const headerRect =
      header.getBoundingClientRect();

    const headerGap =
      24;

    const labelHeight =
      multipleLabel.offsetHeight;

    const centerY =
      window.innerHeight / 2;


    /*
      Calculate the final TOP edge of the label
      directly below the fixed header.

      This works for both one-line desktop
      and two-line mobile text.
    */

    const finalLabelTop =
      headerRect.bottom +
      headerGap;

    const finalLabelCenter =
      finalLabelTop +
      labelHeight / 2;


    const labelTravel =
      centerY -
      finalLabelCenter;

    const labelY =
      -labelMoveProgress * labelTravel;


    multipleLabel.style.opacity =
      labelOpacity;


    /*
      MOBILE:
      Move the actual TOP coordinate instead of
      moving vertically through transform.

      This guarantees that the final top edge is
      exactly 24px below the fixed header.
    */

    if (window.innerWidth <= 700) {

      const mobileStartTop =
        centerY -
        labelHeight / 2;

      const mobileTop =
        lerp(
          mobileStartTop,
          finalLabelTop,
          labelMoveProgress
        );

      multipleLabel.style.top =
        `${mobileTop}px`;

      multipleLabel.style.transform =
        `translateX(-50%)`;

    }

    else {

      multipleLabel.style.top =
        `50%`;

      multipleLabel.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${labelY}px)
          )
        `;

    }



    /* ==================================================
       3. ARROW
    ================================================== */

    const arrowStart = 0.18;
    const arrowEnd = 0.34;

    const arrowProgress =
      clamp(
        (progress - arrowStart) /
        (arrowEnd - arrowStart),
        0,
        1
      );


    const cardRect =
      assetCard.getBoundingClientRect();


    const cardBottom =
      cardRect.bottom -
      stageRect.top;


    const arrowLabelGap =
      24;


    const labelRect =
      multipleLabel.getBoundingClientRect();

    const labelTop =
      labelRect.top -
      stageRect.top;


    /*
      At the end of the growth phase we freeze
      the arrow's length.

      This is the critical point:
      afterwards the arrow is no longer recalculated
      against the moving label. Instead its entire
      geometry moves with the label.
    */

    const restingArrowLength =
      Math.max(
        0,
        labelTop -
        cardBottom -
        arrowLabelGap
      );


    arrowSystem.style.opacity =
      progress >= arrowStart &&
      progress < 0.50
        ? 1
        : 0;


    if (progress < labelMoveStart) {

      /*
        Arrow grows from the bottom of the card.
      */

      arrowSystem.style.top =
        `${cardBottom}px`;

      arrowSystem.style.height =
        `${restingArrowLength * arrowProgress}px`;

    }

    else {

      /*
        The label's current top edge already includes
        its upward movement.

        We place the arrow tip exactly 24px above it,
        then keep the original arrow length.

        Therefore:
        label moves → arrow moves identically.
        Distance stays constant.
      */

      const currentLabelTop =
        labelRect.top -
        stageRect.top;

      const arrowTop =
        currentLabelTop -
        arrowLabelGap -
        restingArrowLength;


      arrowSystem.style.top =
        `${arrowTop}px`;

      arrowSystem.style.height =
        `${restingArrowLength}px`;

    }


    arrowSystem.style.transform =
      `translateX(-50%)`;



    /* ==================================================
       4. REPRESENTATIONS
    ================================================== */

    const representationStart = 0.50;
    const representationEnd = 0.96;


    const representationProgress =
      clamp(
        (progress - representationStart) /
        (representationEnd - representationStart),
        0,
        1
      );


    if (progress >= representationStart) {

      representation.style.opacity = 1;

      arrowSystem.style.opacity = 0;


      const count =
        representations.length;


      if (progress < representationEnd) {

        /*
          Five non-final representations:
          AutoCAD Minimal
          AutoCAD Conditional
          AutoCAD Realistic
          SketchUp Realistic Face Me
          SketchUp Conditional
        */

        const firstFiveCount =
          count - 1;

        const firstFiveProgress =
          representationProgress *
          firstFiveCount;

        const index =
          Math.min(
            firstFiveCount - 1,
            Math.floor(firstFiveProgress)
          );

        const localProgress =
          firstFiveProgress - index;

        const current =
          representations[index];


        representationImage.src =
          current.src;

        representationImage.alt =
          `${current.platform} ${current.type}`;

        representationPlatform.textContent =
          current.platform;

        representationType.textContent =
          current.type;


        const rotation =
          lerp(
            -90,
            90,
            localProgress
          );


        const scale =
          0.92 +
          Math.sin(
            localProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }


      else {

        /*
          Final InDesign:
          -90° → 0°
        */

        const finalProgress =
          clamp(
            (progress - representationEnd) /
            (1 - representationEnd),
            0,
            1
          );


        const current =
          representations[count - 1];


        representationImage.src =
          current.src;

        representationImage.alt =
          `${current.platform} ${current.type}`;

        representationPlatform.textContent =
          current.platform;

        representationType.textContent =
          current.type;


        const rotation =
          lerp(
            -90,
            0,
            finalProgress
          );


        const scale =
          0.92 +
          Math.sin(
            finalProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

    }

    else {

      representation.style.opacity = 0;

    }


    requestAnimationFrame(
      updateAnimation
    );

  }


  updateAnimation();

</script>

</body>
</html>
