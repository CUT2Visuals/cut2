<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #f3f0e8;
      color: #000;

      font-family:
        "IBM Plex Mono",
        "Courier New",
        monospace;
    }

    body {
      overflow-x: hidden;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #000;
      background: #f3f0e8;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
      font-weight: 400;
    }

    .header-title {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       MAIN SYSTEM
    ================================================== */

    .asset-system {
      position: relative;
      height: 817vh;
    }

    .sticky-stage {
      position: sticky;

      top: 0;

      width: 100%;
      height: 100vh;

      overflow: hidden;
    }


    /* ==================================================
       UPPER SYSTEM
    ================================================== */

    .project-label,
    .platforms-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;

      z-index: 8;
    }

    .platforms-label {
      opacity: 0;
    }


    /* ==================================================
       CUT2 → ONE PROJECT (cell division)
    ================================================== */

    .visually-hidden {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* Keeps the label box exactly the size of "ONE PROJECT" */
    .project-sizer {
      visibility: hidden;
    }

    /* Zero-size marker: its top is the text baseline */
    .project-baseline {
      display: inline-block;

      width: 0;
      height: 0;
    }

    /* Letters drawn as SVG paths (with masks) */
    .project-svg {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      overflow: visible;
    }


    /* ==================================================
       PLATFORM ROW
    ================================================== */

    .platforms-row {
      position: absolute;

      left: 50%;
      top: calc(50% + clamp(90px, 7vw, 120px));

      width: min(560px, 80vw);

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      transform:
        translate(-50%, -50%);

      opacity: 1;

      z-index: 8;
    }

    .platform-item {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;

      width: 72px;
    }

    .platform-icon {
      width: 72px;
      height: 72px;

      object-fit: contain;

      opacity: 0;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .platform-name {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;

      white-space: nowrap;

      opacity: 0;
    }


    /* ==================================================
       UPPER ARROWS
    ================================================== */

    .upper-arrow {
      position: absolute;

      left: 50%;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 7;

      transform: translateX(-50%);
    }

    .upper-arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .upper-arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .upper-arrow-head::before,
    .upper-arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .upper-arrow-head::before {
      transform: rotate(225deg);
    }

    .upper-arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       ONE ASSET
    ================================================== */

    .asset-card {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(252px, 49vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      z-index: 5;
    }

    .asset-label {
      position: absolute;

      left: 50%;
      bottom: calc(100% + 28px);

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }


    /* ==================================================
       LOWER ARROW
    ================================================== */

    .arrow-system {
      position: absolute;

      left: 50%;
      top: 0;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 4;

      transform: translateX(-50%);
    }

    .arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .arrow-head::before,
    .arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .arrow-head::before {
      transform: rotate(225deg);
    }

    .arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       MULTIPLE REPRESENTATIONS
    ================================================== */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;

      z-index: 3;
    }


    /* ==================================================
       REPRESENTATIONS
    ================================================== */

    .representation {
      position: absolute;

      left: 50%;
      top: 58%;

      width: min(620px, 76vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      pointer-events: none;

      z-index: 2;
    }

    .representation-visual {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .representation-image {
      display: block;

      width: 70%;
      height: 70%;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       NEXT
    ================================================== */

    .next {
      min-height: 100vh;

      border-top: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(24px, 4vw, 56px);
      font-weight: 400;

      text-align: center;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 10px;
      }

      .asset-system {
        height: 817vh;
      }

      .sticky-stage {
        height: 100svh;
      }

      .project-label,
      .platforms-label {
        font-size: 26px;
      }

      .platforms-row {
        top: calc(50% + 62px);
        width: 78vw;
      }

      .platform-item {
        width: 52px;
        gap: 12px;
      }

      .platform-icon {
        width: 52px;
        height: 52px;
      }

      .platform-name {
        font-size: 10px;
      }

      .asset-card {
        width: min(210px, 53vw);
      }

      .asset-label {
        bottom: calc(100% + 20px);
        font-size: 26px;
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 26px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
        top: 59%;
      }

      .representation-visual {
        height: 48svh;
      }

      .representation-image {
        width: 70%;
        height: 70%;
      }

      .representation-info {
        margin-top: 12px;
        font-size: 10px;
      }

      .next {
        min-height: 100svh;
        font-size: 26px;
      }

    }

  </style>
</head>

        <div class="platform-item">

      ================================================== -->

        <div class="asset-label">
          ONE ASSET
        </div>

        <img
          src="prototypes/asset-representations/asset-representations/library-card.png?v=3"

      </div>


      <!-- ==================================================
           LOWER ARROW
      ================================================== -->

      <div
        class="arrow-system"
        id="arrowSystem"
      >

        <div
          class="arrow-shaft"
          id="arrowShaft"
        ></div>

        <div class="arrow-head"></div>

      </div>


      <!-- ==================================================
           MULTIPLE REPRESENTATIONS
      ================================================== -->

      <div
        class="multiple-label"
        id="multipleLabel"
      >
        MULTIPLE REPRESENTATIONS
      </div>


      <!-- ==================================================
           REPRESENTATION
      ================================================== -->

      <div
        class="representation"
        id="representation"
      >

        <div
          class="representation-visual"
          id="representationVisual"
        >

          <img
            id="representationImage"
            class="representation-image"
            src="prototypes/asset-representations/asset-representations/autocad/minimal.svg?v=3"
            alt="AutoCAD Minimal"
          >

        </div>


        <div class="representation-info">

          <span id="representationPlatform">
            AUTOCAD
          </span>

          <span id="representationType">
            MINIMAL
          </span>

        </div>

      </div>


    </div>

  </section>


  <!-- ==================================================
       NEXT
  ================================================== -->

  <section class="next">

    THE SYSTEM CONTINUES.

  </section>


</main>

      "silhouette" – by the real outer shape of the
                     letter it hides under (round side of

      "rect"       – by the straight edge of the letter
                     cell (the previous version).
  */

  const CLIP_MODE = "silhouette";


  /*
    Letter cells, strictly in the order of the line,
    left to right: O N E _ P R O J E C U T 2.

    char      the letter (" " is the gap between words)
    parent    who the letter comes out of / hides under
              (just a note for you; the real neighbour
              is decided by "dir")
    show      "in"   – appears

              "stay" – visible all the time (C and T)

              for "in" it slides out of the neighbour on
              the opposite side, for "out" it hides under
              the neighbour on that side.
    start     when it starts, 0…1 of the CUT2 → ONE PROJECT

    duration  how long it moves, 0…1 of the same part
              (start + duration must be ≤ 1)

              the parent's side (mouth of C, under the bar
              of T, under the bowl of P, between bowl and
              leg of R) are closed with straight lines, the
              letter is hidden there too; false – the cut
              follows the shape exactly, the letter shows

      );

    const progress =
      timeline < pauseAt
        ? timeline
        : Math.max(
            pauseAt,
            timeline - pauseLength
          );


    const centerY =
      window.innerHeight / 2;

    const headerGap =
      24;

    const headerBottom =
      headerRect.bottom -
      stageRect.top;


    /*
      Arrow gaps (platform group → ONE ASSET).

      Gap under the platform group,
      reduced by 2/3 from 42px / 28px:
        desktop: 14px
        mobile: 9px
    */

    const platformArrowGap =
      window.innerWidth <= 700
        ? 9
        : 14;


    /*
      Keep the arrowhead above ONE ASSET.
      This prevents the arrow from touching
      or crossing the label.
    */

    const platformArrowEndGap =
      window.innerWidth <= 700
        ? 16
        : 24;


    const platformArrowMinLength =
      window.innerWidth <= 700
        ? 28
        : 40;


    /*
      Platform group movement (used by ONE PROJECT,
      its arrow and the platform group).
      Final position: the bottom of the icon row
      (with names) is platformArrowGap above the
      bottom of the header, so the row and the tail
      of the arrow are hidden behind the header.
    */

    const groupMoveStart = 0.32;
    const groupMoveEnd = 0.46;

    const groupMoveProgress =
      clamp(
        (progress - groupMoveStart) /
        (groupMoveEnd - groupMoveStart),
        0,
        1
      );


    /*
      ONE PROJECT arrow gaps.
      If there is not enough room between ONE PROJECT
      (under the header) and MULTIPLE PLATFORMS for
      projectArrowMinLength, the whole platform group
      stands lower by exactly the missing amount
      (short screens only).
    */

    const projectArrowGap =
      window.innerWidth <= 700
        ? 10
        : 12;

    const projectArrowMinLength =
      window.innerWidth <= 700
        ? 28
        : 40;

    const platformsLabelBaseTop =
      platformsLabel.offsetTop -
      platformsLabel.offsetHeight * 1.5;

    const groupBaseShift =
      Math.max(
        0,
        headerBottom +
        headerGap +
        projectLabel.offsetHeight +
        projectArrowGap +
        projectArrowMinLength +
        platformArrowEndGap -
        platformsLabelBaseTop
      );


    const rowBottomBase =
      platformsRow.offsetTop +
      platformsRow.offsetHeight / 2 +
      groupBaseShift;

    const groupUpY =
      headerBottom -
      platformArrowGap -
      rowBottomBase;

    const groupY =
      groupUpY *
      groupMoveProgress;


    /* ==================================================
       1. ONE PROJECT
       CENTER → UNDER HEADER
    ================================================== */

    const projectMoveStart = 0;
    const projectMoveEnd = 0.12;

    const projectMoveProgress =
      clamp(
        (progress - projectMoveStart) /
        (projectMoveEnd - projectMoveStart),
        0,
        1
      );


    const projectHeight =
      projectLabel.offsetHeight;

    /*
      Stops under the header (not above it).
      Later leaves together with the platform group.
    */

    const projectUpY =
      headerBottom +
      headerGap +
      projectHeight / 2 -
      projectLabel.offsetTop;


    const projectY =
      projectUpY *
      projectMoveProgress;


    projectLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${projectY + groupY}px)
        )
      `;


    /* ==================================================
       2. ARROW ATTACHED TO ONE PROJECT
       PROJECT → MULTIPLE PLATFORMS
    ================================================== */

    /*
      At progress 0 only the arrowhead is visible
      under ONE PROJECT. From the first scroll the
      tail stays under ONE PROJECT and the head
      moves evenly to MULTIPLE PLATFORMS, so the
      shaft grows from 0 without a jump.
      Positions are taken from layout (offsetTop),
      without the platform group shift.
    */

    const projectArrowTail =
      projectLabel.offsetTop +
      projectHeight / 2 +
      projectArrowGap;

    const projectArrowTailY =
      projectArrowTail +
      projectY;


    const platformsLabelTop =
      platformsLabelBaseTop +
      groupBaseShift;

    const projectArrowHeadY =
      lerp(
        projectArrowTail,
        platformsLabelTop -
        platformArrowEndGap,
        projectMoveProgress
      );


    const projectArrowLength =
      Math.max(
        0,
        projectArrowHeadY -
        projectArrowTailY
      );


    projectArrow.style.top =
      `${projectArrowTailY + groupY}px`;

    projectArrow.style.height =
      `${projectArrowLength}px`;

    projectArrow.style.opacity =
      progress < groupMoveEnd
        ? 1
        : 0;


    /* ==================================================
       3. MULTIPLE PLATFORMS
       CENTER → UNDER HEADER
    ================================================== */

    const platformsAppearStart = 0.15;
    const platformsAppearEnd = 0.19;

    const platformsOpacity =
      clamp(
        (progress - platformsAppearStart) /
        (platformsAppearEnd - platformsAppearStart),
        0,
        1
      );


    platformsLabel.style.opacity =
      platformsOpacity;

    platformsLabel.style.transform =
      `translate(-50%, -50%)`;


    /* ==================================================
       4. PLATFORM ICONS + LABELS
    ================================================== */

    const iconStart = 0.19;
    const iconStep = 0.035;
    const iconDuration = 0.05;


    platformIcons.forEach(
      (icon, index) => {

        const start =
          iconStart +
          index * iconStep;

        const end =
          start +
          iconDuration;


        const iconProgress =
          clamp(
            (progress - start) /
            (end - start),
            0,
            1
          );


        const rotation =
          lerp(
            -90,
            0,
            iconProgress
          );


        const scale =
          0.92 +
          Math.sin(
            iconProgress * Math.PI
          ) * 0.08;


        icon.style.opacity =
          iconProgress;

        icon.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;


        platformNames[index].style.opacity =
          iconProgress;

      }
    );


    /* ==================================================
       5. PLATFORM GROUP
       LABEL + ICONS + LABELS
       CENTER → BEHIND HEADER
       (groupY is calculated at the top)
    ================================================== */

    const platformsLabelHeight =
      platformsLabel.offsetHeight;


    const platformsLabelOffsetY =
      -platformsLabelHeight;


    platformsLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${groupBaseShift + groupY + platformsLabelOffsetY}px)
        )
      `;


    platformsRow.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${groupBaseShift + groupY}px)
        )
      `;


    /* ==================================================
       6. ONE ASSET
       STARTS COMPLETELY BELOW THE SCREEN
    ================================================== */

    const assetCardHeight =
      assetCard.offsetHeight;

    const assetLabelHeight =
      assetLabel.offsetHeight;


    const assetLabelGap =
      window.innerWidth <= 700
        ? 20
        : 28;


    /*
      Home position of ONE ASSET:
      the stage center, unless the visible part
      of the arrow from the platform group
      (below the header) would be shorter than
      platformArrowMinLength. On short screens
      the card stops lower by exactly the
      missing amount.
    */

    const finalRowBottom =
      rowBottomBase +
      groupUpY;

    const assetLabelHomeTop =
      stageRect.height / 2 -
      assetCardHeight / 2 -
      assetLabelGap -
      assetLabelHeight;

    const assetHomeShift =
      Math.max(
        0,
        finalRowBottom +
        platformArrowGap +
        platformArrowMinLength +
        platformArrowEndGap -
        assetLabelHomeTop
      );


    /*
      Start position: the top of the ONE ASSET label
      (the highest element) is 3px below the bottom
      of the screen, so the arrowhead (24px above
      the label) always stays on screen.
    */

    const assetStartShift =
      stageRect.height / 2 +
      assetCardHeight / 2 +
      assetLabelGap +
      assetLabelHeight +
      3;


    /*
      Entry starts together with the platform
      arrow (0.31) and ends at 0.53.
      Smoothstep: soft start and soft stop.
    */

    const assetMoveStart = 0.31;
    const assetMoveEnd = 0.53;

    const assetMoveProgress =
      clamp(
        (progress - assetMoveStart) /
        (assetMoveEnd - assetMoveStart),
        0,
        1
      );

    const assetMoveEase =
      assetMoveProgress *
      assetMoveProgress *
      (3 - 2 * assetMoveProgress);


    const assetY =
      lerp(
        assetStartShift,
        assetHomeShift,
        assetMoveEase
      );


    if (progress < assetMoveStart) {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetStartShift}px)
          )
        `;

    }

    else {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetY}px)
          )
        `;

    }


    const assetVisibilityStart = 0.31;
    const assetVisibilityEnd = 0.38;

    const assetVisibility =
      clamp(
        (progress - assetVisibilityStart) /
        (assetVisibilityEnd - assetVisibilityStart),
        0,
        1
      );


    assetCard.style.opacity =
      assetVisibility;


    /* ==================================================
       7. ARROW
       PLATFORM GROUP → ONE ASSET
    ================================================== */

    /*
      Starts right after the last platform icon
      has appeared (0.19 + 2 × 0.035 + 0.05 = 0.31).
    */

    const platformArrowStart = 0.31;

    const platformArrowDuration =
      (0.51 - 0.38) / 1.5;

    const platformArrowEnd =
      platformArrowStart +
      platformArrowDuration;

    const platformArrowProgress =
      clamp(
        (progress - platformArrowStart) /
        (platformArrowEnd - platformArrowStart),
        0,
        1
      );


    const rowRect =
      platformsRow.getBoundingClientRect();

    const rowBottom =
      rowRect.bottom -
      stageRect.top;


    const assetLabelRect =
      assetLabel.getBoundingClientRect();

    const assetLabelTop =
      assetLabelRect.top -
      stageRect.top;


    const platformArrowStartY =
      rowBottom +
      platformArrowGap;


    const platformArrowEndY =
      assetLabelTop -
      platformArrowEndGap;


    const platformArrowLength =
      Math.max(
        0,
        platformArrowEndY -
        platformArrowStartY
      );


    platformArrow.style.top =
      `${platformArrowStartY}px`;

    platformArrow.style.height =
      `${platformArrowLength * platformArrowProgress}px`;

    /*
      Fades out right before ONE ASSET stops
      (0.51 → 0.53). Invisible during the pause.
      The tail is hidden behind the header from
      groupMoveEnd (0.46), before the fade starts.
    */

    const platformArrowFadeStart = 0.51;

    const platformArrowFade =
      clamp(
        (assetMoveEnd - progress) /
        (assetMoveEnd - platformArrowFadeStart),
        0,
        1
      );

    platformArrow.style.opacity =
      platformArrowProgress > 0 &&
      platformArrowLength > 0
        ? platformArrowFade
        : 0;


    /* ==================================================
       8. ONE ASSET → MULTIPLE REPRESENTATIONS
       EXISTING LOWER MECHANICS
    ================================================== */

    const cardStart = 0.56;
    const cardEnd = 0.66;

    const cardProgress =
      clamp(
        (progress - cardStart) /
        (cardEnd - cardStart),
        0,
        1
      );


    const cardTravel =
      window.innerHeight * 0.82;


    const cardY =
      -cardProgress *
      cardTravel;


    /*
      Before cardStart the card is driven by
      block 6 (entry from below). Both blocks
      share assetHomeShift, so there is no jump
      at cardStart.
    */

    if (progress >= cardStart) {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetHomeShift + cardY}px)
          )
        `;

    }


    /* ==================================================
       9. MULTIPLE REPRESENTATIONS LABEL
    ================================================== */

    /*
      Fades in while the label comes out from
      under the bottom edge of the screen.
    */

    const labelAppearStart = 0.56;
    const labelAppearEnd = 0.59;

    const labelOpacity =
      clamp(
        (progress - labelAppearStart) /
        (labelAppearEnd - labelAppearStart),
        0,
        1
      );


    const labelMoveStart = 0.76;
    const labelMoveEnd = 0.80;

    const labelMoveProgress =
      clamp(
        (progress - labelMoveStart) /
        (labelMoveEnd - labelMoveStart),
        0,
        1
      );


    const labelHeight =
      multipleLabel.offsetHeight;


    const finalLabelTop =
      headerRect.bottom +
      headerGap;

    const finalLabelCenter =
      finalLabelTop +
      labelHeight / 2;


    const labelTravel =
      centerY -
      finalLabelCenter;


    /*
      Entry from below: starts together with the
      ONE ASSET exit (cardStart, 0.56), the top of
      the label starts 3px below the bottom of the
      screen and stops in the center at 0.66.
      Smoothstep: soft start and soft stop.
    */

    const labelEntryStart = cardStart;
    const labelEntryEnd = 0.66;

    const labelEntryProgress =
      clamp(
        (progress - labelEntryStart) /
        (labelEntryEnd - labelEntryStart),
        0,
        1
      );

    const labelEntryEase =
      labelEntryProgress *
      labelEntryProgress *
      (3 - 2 * labelEntryProgress);

    const labelEntryShift =
      window.innerHeight +
      3 -
      (centerY - labelHeight / 2);

    const labelEntryY =
      lerp(
        labelEntryShift,
        0,
        labelEntryEase
      );


    const labelY =
      labelEntryY -
      labelMoveProgress *
      labelTravel;


    multipleLabel.style.opacity =
      labelOpacity;


    if (window.innerWidth <= 700) {

      const mobileStartTop =
        centerY -
        labelHeight / 2;

      const mobileTop =
        lerp(
          mobileStartTop,
          finalLabelTop,
          labelMoveProgress
        );

      multipleLabel.style.top =
        `${mobileTop + labelEntryY}px`;

      multipleLabel.style.transform =
        `translateX(-50%)`;

    }

    else {

      multipleLabel.style.top =
        `50%`;

      multipleLabel.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${labelY}px)
          )
        `;

    }


    /* ==================================================
       10. LOWER ARROW
    ================================================== */

    const arrowStart = 0.56;
    const arrowEnd = 0.66;

    const arrowProgress =
      clamp(
        (progress - arrowStart) /
        (arrowEnd - arrowStart),
        0,
        1
      );


    const cardRect =
      assetCard.getBoundingClientRect();


    const cardBottom =
      cardRect.bottom -
      stageRect.top;


    const arrowLabelGap =
      24;


    const labelRect =
      multipleLabel.getBoundingClientRect();


    /*
      The tail stays on the bottom of the card.
      The head follows the label entering from
      below: the arrow covers arrowProgress of the
      distance from the card bottom to 24px above
      the label, so it never touches the label and
      reaches it at arrowEnd. From labelMoveStart
      the length stays the same and the arrow
      moves up with the label until labelMoveEnd.
    */

    const restingLabelTop =
      centerY -
      labelHeight / 2;

    const arrowTargetTop =
      progress < labelMoveStart
        ? labelRect.top - stageRect.top
        : restingLabelTop;


    const restingArrowLength =
      Math.max(
        0,
        arrowTargetTop -
        arrowLabelGap -
        cardBottom
      ) *
      arrowProgress;


    arrowSystem.style.opacity =
      progress >= arrowStart &&
      progress < labelMoveEnd
        ? 1
        : 0;


    if (progress < labelMoveStart) {

      arrowSystem.style.top =
        `${cardBottom}px`;

      arrowSystem.style.height =
        `${restingArrowLength}px`;

    }

    else {

      const currentLabelTop =
        labelRect.top -
        stageRect.top;

      const arrowTop =
        currentLabelTop -
        arrowLabelGap -
        restingArrowLength;


      arrowSystem.style.top =
        `${arrowTop}px`;

      arrowSystem.style.height =
        `${restingArrowLength}px`;

    }


    arrowSystem.style.transform =
      `translateX(-50%)`;


    /* ==================================================
       11. REPRESENTATIONS
    ================================================== */

    const representationStart = 0.80;
    const representationEnd = 0.96;


    const representationProgress =
      clamp(
        (progress - representationStart) /
        (representationEnd - representationStart),
        0,
        1
      );


    if (progress >= representationStart) {

      representation.style.opacity = 1;


      const count =
        representations.length;


      if (progress < representationEnd) {

        const firstFiveCount =
          count - 1;

        const firstFiveProgress =
          representationProgress *
          firstFiveCount;

        const index =
          Math.min(
            firstFiveCount - 1,
            Math.floor(firstFiveProgress)
          );

        const localProgress =
          firstFiveProgress -
          index;

        const current =
          representations[index];


        representationImage.src =
          current.src;

        representationImage.alt =
          `${current.platform} ${current.type}`;

        representationPlatform.textContent =
          current.platform;

        representationType.textContent =
          current.type;


        const rotation =
          lerp(
            -90,
            90,
            localProgress
          );


        const scale =
          0.92 +
          Math.sin(
            localProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

      else {

        const finalProgress =
          clamp(
            (progress - representationEnd) /
            (1 - representationEnd),
            0,
            1
          );


        const current =
          representations[count - 1];


        representationImage.src =
          current.src;

        representationImage.alt =
          `${current.platform} ${current.type}`;

        representationPlatform.textContent =
          current.platform;

        representationType.textContent =
          current.type;


        const rotation =
          lerp(
            -90,
            0,
            finalProgress
          );


        const scale =
          0.92 +
          Math.sin(
            finalProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

    }

    else {

      representation.style.opacity = 0;

    }


    requestAnimationFrame(
      updateAnimation
    );

  }


  updateAnimation();

</script>


</body>
</html>
