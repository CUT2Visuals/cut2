    representationImages[shownRepresentation].classList.add("is-hidden");
    representationImages[index].classList.remove("is-hidden");

    representationPlatform.textContent = current.platform;
    representationType.textContent = representationTypeText(current.type);

    shownRepresentation = index;

  }


  /* ==================================================
     HELPERS
  ================================================== */

  function clamp(value, min, max) {

    return Math.max(
      min,
      Math.min(max, value)
    );

  }


  function lerp(a, b, t) {

    return a + (b - a) * t;

  }


  function smoothstep(t) {

    return t * t * (3 - 2 * t);

  }


  /*
    CUT2 → ONE PROJECT: place the letters.
    introProgress: 0 = "CUT2", 1 = "ONE PROJECT".
    Cells stand side by side, the whole line stays
    centered in the label. Widths are in characters
    (monospace), 1 character = sizer width / 11.
    Each letter is pinned to the cell side away from
    its parent; masks follow the letters they belong to
    (zones are in font units, hence the scale).
  */

  function updateIntroCells(introProgress) {

    lastIntroProgress = introProgress;

    /* letters are built when the font is ready */
    if (!introLetters.length) {
      return;
    }

    /* the cells of the language the letters were built for */
    const INTRO_CELLS = introCells;

    const charWidth =
      projectSizer.offsetWidth / 11;

    const scale =
      charWidth / 600;

    const baseline =
      projectBaseline.getBoundingClientRect().top -
      projectLabel.getBoundingClientRect().top;

    const widths =
      INTRO_CELLS.map(
        (cell) => INTRO_WIDTH_AT(cell, introProgress)
      );

    const lineWidth =
      widths.reduce((sum, w) => sum + w, 0);

    /* letter x (in characters) for every cell */
    const glyphX = [];

    let x =
      (11 - lineWidth) / 2;

    INTRO_CELLS.forEach(
      (cell, index) => {

        const w = widths[index];
        const letter = introLetters[index];
        const offset = letter ? letter.offset * (1 - w) : 0;

        if (cell.show === "stay") {
          glyphX[index] = x;
        }
        else if (parentSideOf(cell) === "right") {
          /* pinned left, starts deeper to the right */
          glyphX[index] = x + offset;
        }
        else {
          /* pinned right, starts deeper to the left */
          glyphX[index] = x + w - 1 - offset;
        }

        x += w;

      }
    );

    const placeOf = (index) =>
      `translate(${glyphX[index] * charWidth} ${baseline}) ` +
      `scale(${scale} ${-scale})`;

    introLetters.forEach(
      (letter) => {

        if (!letter) {
          return;
        }

        const w = widths[letter.index];

        letter.text.setAttribute("x", String(glyphX[letter.index] * charWidth));
        letter.text.setAttribute("y", String(baseline));

        /* not out yet (or fully hidden): not drawn at all */
        letter.group.style.display =
          w > 0 ? "" : "none";

        /* fully out: nothing hides it any more */
        letter.users.forEach(
          ({ k, use }) => {

            use.setAttribute("transform", placeOf(k));
            use.style.display =
              w < 1 && widths[k] > 0 ? "" : "none";

          }
        );

      }
    );

  }


  /* ==================================================
     ANIMATION
  ================================================== */

  function updateAnimation() {

    const section =
      document.querySelector(".asset-system");

    const stage =
      document.querySelector(".sticky-stage");

    const header =
      document.querySelector("header");


    /*
      Height of the scene (CSS 100vh, on phones 100lvh) and the
      length of the TOOLS part, all in px. The section is made
      exactly as long as the scene needs; it is set before the
      positions are read.
    */
    const stageH = stage.offsetHeight;

    const pauseAt = 0.53;
    const pauseLength = 0.07;

    const toolsPhone = window.innerWidth <= 700;
    const toolsTiming =
      TOOLS_SETTINGS.timing[toolsPhone ? "phone" : "desktop"];

    /* where the TOOLS part starts: the old timeline
       (1 unit = 6 screen heights) ends here */
    const toolsStartPx =
      (INTRO_LENGTH + 1 + pauseLength) * 6 * stageH;

    const toolsComeLen = toolsTiming.comeIn * stageH;
    const toolsHoldLen = toolsTiming.hold * stageH;
    const toolsSpreadLen = toolsTiming.spreadScroll * stageH;

    /* the stop after the burst: the same as the first stop
       unless holdAfter is a number */
    const toolsHoldAfterLen =
      (toolsTiming.holdAfter == null
        ? toolsTiming.hold
        : toolsTiming.holdAfter) * stageH;

    /* the labels appear here and, in the same moment, start
       to spread */
    const toolsAppearPx =
      toolsStartPx + toolsComeLen + toolsHoldLen;

    /* the scene stays pinned through the burst and the stop
       after it; then it goes up with the page (one more screen
       height of scrolling) */
    const sectionPx =
      toolsAppearPx + toolsSpreadLen + toolsHoldAfterLen + stageH;

    if (section.dataset.px !== String(sectionPx)) {
      section.style.height = `${sectionPx}px`;
      section.dataset.px = String(sectionPx);
    }

    const sectionRect =
      section.getBoundingClientRect();

    const stageRect =
      stage.getBoundingClientRect();

    const headerRect =
      header.getBoundingClientRect();


    /*
      The height of the scene (stageH, worked out at the top)
      does not change when the browser bars move, unlike
      window.innerHeight, so everything below is measured from
      it: scroll progress, positions, the place where blocks
      come in from below.
    */
    const scrollable =
      sectionPx -
      stageH;

    const passed =
      clamp(
        -sectionRect.top,
        0,
        scrollable
      );

    /*
      Scroll is split into:
      1) CUT2 → ONE PROJECT (INTRO_LENGTH),
      2) the old timeline, with a pause on
         ONE ASSET: pauseLength holds the timeline
         at pauseAt. One unit of this timeline is 6
         screen heights of scrolling, so every old block
         keeps its length in pixels,
      3) TOOLS (TOOLS_SETTINGS.timing): comes in, stands
         still (hold), then the labels spread,
      after the section ends the scene is unpinned and goes
      up; pastEnd counts those pixels.
    */

    /* scrolled from the start of the section, px (can be
       more than the pinned length) */
    const scrollPos =
      -sectionRect.top;

    const rawTimeline =
      passed / (6 * stageH);

    /* step 1 of TOOLS: representations leave upwards while
       TOOLS comes in (the same length) */
    const toolsLeave =
      smoothstep(
        clamp((scrollPos - toolsStartPx) / toolsComeLen, 0, 1)
      );

    /* scrolled past the end of the section, px
       (below 0 before it) */
    const pastEnd =
      -sectionRect.top - scrollable;

    const introProgress =
      clamp(
        rawTimeline / INTRO_LENGTH,
        0,
        1
      );

    updateIntroCells(introProgress);

    const timeline =
      Math.max(
        0,
        rawTimeline - INTRO_LENGTH
      );

    const progress =
      Math.min(
        1,
        timeline < pauseAt
          ? timeline
          : Math.max(
              pauseAt,
              timeline - pauseLength
            )
      );


    const centerY =
      stageH / 2;

    const headerGap =
      24;

    /*
      Bottom of the header inside the scene, measured as
      if the scene were still pinned. After the section
      ends, the browser moves the scene up by itself; if
      this followed the real scene top, the parked platform
      group would be pulled back under the header by the
      script one frame later, and on the way up it would
      peek out below the header for that frame. This way
      the parked parts simply go up with the scene.
    */
    const headerBottom =
      headerRect.bottom -
      Math.max(0, stageRect.top);


    /*
      Arrow gaps (platform group → ONE ASSET).

      Gap under the platform group,
      reduced by 2/3 from 42px / 28px:
        desktop: 14px
        mobile: 9px
    */

    const platformArrowGap =
      window.innerWidth <= 700
        ? 9
        : 14;


    /*
      Keep the arrowhead above ONE ASSET.
      This prevents the arrow from touching
      or crossing the label.
    */

    const platformArrowEndGap =
      window.innerWidth <= 700
        ? 16
        : 24;


    const platformArrowMinLength =
      window.innerWidth <= 700
        ? 28
        : 40;


    /*
      Platform group movement (used by ONE PROJECT,
      its arrow and the platform group).
      Final position: the bottom of the icon row
      (with names) is platformArrowGap above the
      bottom of the header, so the row and the tail
      of the arrow are hidden behind the header.
    */

    const groupMoveStart = 0.32;
    const groupMoveEnd = 0.46;

    const groupMoveProgress =
      clamp(
        (progress - groupMoveStart) /
        (groupMoveEnd - groupMoveStart),
        0,
        1
      );


    /*
      ONE PROJECT arrow gaps.
      If there is not enough room between ONE PROJECT
      (under the header) and MULTIPLE PLATFORMS for
      projectArrowMinLength, the whole platform group
      stands lower by exactly the missing amount
      (short screens only).
    */

    const projectArrowGap =
      window.innerWidth <= 700
        ? 10
        : 12;

    const projectArrowMinLength =
      window.innerWidth <= 700
        ? 28
        : 40;

    const platformsLabelBaseTop =
      platformsLabel.offsetTop -
      platformsLabel.offsetHeight * 1.5;

    const groupBaseShift =
      Math.max(
        0,
        headerBottom +
        headerGap +
        projectLabel.offsetHeight +
        projectArrowGap +
        projectArrowMinLength +
        platformArrowEndGap -
        platformsLabelBaseTop
      );


    const rowBottomBase =
      platformsRow.offsetTop +
      platformsRow.offsetHeight / 2 +
      groupBaseShift;

    const groupUpY =
      headerBottom -
      platformArrowGap -
      rowBottomBase;

    const groupY =
      groupUpY *
      groupMoveProgress;


    /* ==================================================
       1. ONE PROJECT
       CENTER → UNDER HEADER
    ================================================== */

    const projectMoveStart = 0;
    const projectMoveEnd = 0.12;

    const projectMoveProgress =
      clamp(
        (progress - projectMoveStart) /
        (projectMoveEnd - projectMoveStart),
        0,
        1
      );


    const projectHeight =
      projectLabel.offsetHeight;

    /*
      Stops under the header (not above it).
      Later leaves together with the platform group.
    */

    const projectUpY =
      headerBottom +
      headerGap +
      projectHeight / 2 -
      projectLabel.offsetTop;


    const projectY =
      projectUpY *
      projectMoveProgress;


    projectLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${projectY + groupY}px)
        )
      `;


    /* ==================================================
       2. ARROW ATTACHED TO ONE PROJECT
       PROJECT → MULTIPLE PLATFORMS
    ================================================== */

    /*
      At progress 0 only the arrowhead is visible
      under ONE PROJECT. From the first scroll the
      tail stays under ONE PROJECT and the head
      moves evenly to MULTIPLE PLATFORMS, so the
      shaft grows from 0 without a jump.
      Positions are taken from layout (offsetTop),
      without the platform group shift.
    */

    const projectArrowTail =
      projectLabel.offsetTop +
      projectHeight / 2 +
      projectArrowGap;

    const projectArrowTailY =
      projectArrowTail +
      projectY;


    const platformsLabelTop =
      platformsLabelBaseTop +
      groupBaseShift;

    const projectArrowHeadY =
      lerp(
        projectArrowTail,
        platformsLabelTop -
        platformArrowEndGap,
        projectMoveProgress
      );


    const projectArrowLength =
      Math.max(
        0,
        projectArrowHeadY -
        projectArrowTailY
      );


    projectArrow.style.top =
      `${projectArrowTailY + groupY}px`;

    projectArrow.style.height =
      `${projectArrowLength}px`;

    projectArrow.style.opacity =
      progress < groupMoveEnd
        ? 1
        : 0;


    /* ==================================================
       3. MULTIPLE PLATFORMS
       CENTER → UNDER HEADER
    ================================================== */

    const platformsAppearStart = 0.15;
    const platformsAppearEnd = 0.19;

    const platformsOpacity =
      clamp(
        (progress - platformsAppearStart) /
        (platformsAppearEnd - platformsAppearStart),
        0,
        1
      );


    platformsLabel.style.opacity =
      platformsOpacity;

    platformsLabel.style.transform =
      `translate(-50%, -50%)`;


    /* ==================================================
       4. PLATFORM ICONS + LABELS
    ================================================== */

    const iconStart = 0.19;
    const iconStep = 0.035;
    const iconDuration = 0.05;


    platformIcons.forEach(
      (icon, index) => {

        const start =
          iconStart +
          index * iconStep;

        const end =
          start +
          iconDuration;


        const iconProgress =
          clamp(
            (progress - start) /
            (end - start),
            0,
            1
          );


        const rotation =
          lerp(
            -90,
            0,
            iconProgress
          );


        const scale =
          0.92 +
          Math.sin(
            iconProgress * Math.PI
          ) * 0.08;


        icon.style.opacity =
          iconProgress;

        icon.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;


        platformNames[index].style.opacity =
          iconProgress;

      }
    );


    /* ==================================================
       5. PLATFORM GROUP
       LABEL + ICONS + LABELS
       CENTER → BEHIND HEADER
       (groupY is calculated at the top)
    ================================================== */

    const platformsLabelHeight =
      platformsLabel.offsetHeight;


    const platformsLabelOffsetY =
      -platformsLabelHeight;


    platformsLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${groupBaseShift + groupY + platformsLabelOffsetY}px)
        )
      `;


    platformsRow.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${groupBaseShift + groupY}px)
        )
      `;


    /* ==================================================
       6. ONE ASSET
       STARTS COMPLETELY BELOW THE SCREEN
    ================================================== */

    const assetCardHeight =
      assetCard.offsetHeight;

    const assetLabelHeight =
      assetLabel.offsetHeight;


    const assetLabelGap =
      window.innerWidth <= 700
        ? 20
        : 28;


    /*
      Home position of ONE ASSET:
      the stage center, unless the visible part
      of the arrow from the platform group
      (below the header) would be shorter than
      platformArrowMinLength. On short screens
      the card stops lower by exactly the
      missing amount.
    */

    const finalRowBottom =
      rowBottomBase +
      groupUpY;

    const assetLabelHomeTop =
      stageRect.height / 2 -
      assetCardHeight / 2 -
      assetLabelGap -
      assetLabelHeight;

    const assetHomeShift =
      Math.max(
        0,
        finalRowBottom +
        platformArrowGap +
        platformArrowMinLength +
        platformArrowEndGap -
        assetLabelHomeTop
      );


    /*
      Start position: the top of the ONE ASSET label
      (the highest element) is 3px below the bottom
      of the screen, so the arrowhead (24px above
      the label) always stays on screen.
    */

    const assetStartShift =
      stageRect.height / 2 +
      assetCardHeight / 2 +
      assetLabelGap +
      assetLabelHeight +
      3;


    /*
      Entry starts together with the platform
      arrow (0.31) and ends at 0.53.
      Smoothstep: soft start and soft stop.
    */

    const assetMoveStart = 0.31;
    const assetMoveEnd = 0.53;

    const assetMoveProgress =
      clamp(
        (progress - assetMoveStart) /
        (assetMoveEnd - assetMoveStart),
        0,
        1
      );

    const assetMoveEase =
      assetMoveProgress *
      assetMoveProgress *
      (3 - 2 * assetMoveProgress);


    const assetY =
      lerp(
        assetStartShift,
        assetHomeShift,
        assetMoveEase
      );


    if (progress < assetMoveStart) {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetStartShift}px)
          )
        `;

    }

    else {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetY}px)
          )
        `;

    }


    const assetVisibilityStart = 0.31;
    const assetVisibilityEnd = 0.38;

    const assetVisibility =
      clamp(
        (progress - assetVisibilityStart) /
        (assetVisibilityEnd - assetVisibilityStart),
        0,
        1
      );


    assetCard.style.opacity =
      assetVisibility;


    /* ==================================================
       7. ARROW
       PLATFORM GROUP → ONE ASSET
    ================================================== */

    /*
      Starts right after the last platform icon
      has appeared (0.19 + 2 × 0.035 + 0.05 = 0.31).
    */

    const platformArrowStart = 0.31;

    const platformArrowDuration =
      (0.51 - 0.38) / 1.5;

    const platformArrowEnd =
      platformArrowStart +
      platformArrowDuration;

    const platformArrowProgress =
      clamp(
        (progress - platformArrowStart) /
        (platformArrowEnd - platformArrowStart),
        0,
        1
      );


    const rowRect =
      platformsRow.getBoundingClientRect();

    const rowBottom =
      rowRect.bottom -
      stageRect.top;


    const assetLabelRect =
      assetLabel.getBoundingClientRect();

    const assetLabelTop =
      assetLabelRect.top -
      stageRect.top;


    const platformArrowStartY =
      rowBottom +
      platformArrowGap;


    const platformArrowEndY =
      assetLabelTop -
      platformArrowEndGap;


    const platformArrowLength =
      Math.max(
        0,
        platformArrowEndY -
        platformArrowStartY
      );


    platformArrow.style.top =
      `${platformArrowStartY}px`;

    platformArrow.style.height =
      `${platformArrowLength * platformArrowProgress}px`;

    /*
      Fades out right before ONE ASSET stops
      (0.51 → 0.53). Invisible during the pause.
      The tail is hidden behind the header from
      groupMoveEnd (0.46), before the fade starts.
    */

    const platformArrowFadeStart = 0.51;

    const platformArrowFade =
      clamp(
        (assetMoveEnd - progress) /
        (assetMoveEnd - platformArrowFadeStart),
        0,
        1
      );

    platformArrow.style.opacity =
      platformArrowProgress > 0 &&
      platformArrowLength > 0
        ? platformArrowFade
        : 0;


    /* ==================================================
       8. ONE ASSET → MULTIPLE REPRESENTATIONS
       EXISTING LOWER MECHANICS
    ================================================== */

    const cardStart = 0.56;
    const cardEnd = 0.66;

    const cardProgress =
      clamp(
        (progress - cardStart) /
        (cardEnd - cardStart),
        0,
        1
      );


    const cardTravel =
      stageH * 0.82;


    const cardY =
      -cardProgress *
      cardTravel;


    /*
      Before cardStart the card is driven by
      block 6 (entry from below). Both blocks
      share assetHomeShift, so there is no jump
      at cardStart.
    */

    if (progress >= cardStart) {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetHomeShift + cardY}px)
          )
        `;

    }


    /* ==================================================
       9. MULTIPLE REPRESENTATIONS LABEL
    ================================================== */

    /*
      Fades in while the label comes out from
      under the bottom edge of the screen.
    */

    const labelAppearStart = 0.56;
    const labelAppearEnd = 0.59;

    const labelOpacity =
      clamp(
        (progress - labelAppearStart) /
        (labelAppearEnd - labelAppearStart),
        0,
        1
      );


    const labelMoveStart = 0.76;
    const labelMoveEnd = 0.80;

    const labelMoveProgress =
      clamp(
        (progress - labelMoveStart) /
        (labelMoveEnd - labelMoveStart),
        0,
        1
      );


    const labelHeight =
      multipleLabel.offsetHeight;


    const finalLabelTop =
      headerRect.bottom +
      headerGap;

    const finalLabelCenter =
      finalLabelTop +
      labelHeight / 2;


    const labelTravel =
      centerY -
      finalLabelCenter;


    /*
      Entry from below: starts together with the
      ONE ASSET exit (cardStart, 0.56), the top of
      the label starts 3px below the bottom of the
      screen and stops in the center at 0.66.
      Smoothstep: soft start and soft stop.
    */

    const labelEntryStart = cardStart;
    const labelEntryEnd = 0.66;

    const labelEntryProgress =
      clamp(
        (progress - labelEntryStart) /
        (labelEntryEnd - labelEntryStart),
        0,
        1
      );

    const labelEntryEase =
      labelEntryProgress *
      labelEntryProgress *
      (3 - 2 * labelEntryProgress);

    const labelEntryShift =
      stageH +
      3 -
      (centerY - labelHeight / 2);

    const labelEntryY =
      lerp(
        labelEntryShift,
        0,
        labelEntryEase
      );


    /* TOOLS step 1: the label leaves under the header */
    const labelLeaveY =
      toolsLeave *
      (finalLabelTop + labelHeight + 20);

    const labelY =
      labelEntryY -
      labelMoveProgress *
      labelTravel -
      labelLeaveY;


    multipleLabel.style.opacity =
      labelOpacity;


    if (window.innerWidth <= 700) {

      const mobileStartTop =
        centerY -
        labelHeight / 2;

      const mobileTop =
        lerp(
          mobileStartTop,
          finalLabelTop,
          labelMoveProgress
        );

      multipleLabel.style.top =
        `${mobileTop + labelEntryY - labelLeaveY}px`;

      multipleLabel.style.transform =
        `translateX(-50%)`;

    }

    else {

      multipleLabel.style.top =
        `50%`;

      multipleLabel.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${labelY}px)
          )
        `;

    }


    /* ==================================================
       10. LOWER ARROW
    ================================================== */

    const arrowStart = 0.56;
    const arrowEnd = 0.66;

    const arrowProgress =
      clamp(
        (progress - arrowStart) /
        (arrowEnd - arrowStart),
        0,
        1
      );


    const cardRect =
      assetCard.getBoundingClientRect();


    const cardBottom =
      cardRect.bottom -
      stageRect.top;


    const arrowLabelGap =
      24;


    const labelRect =
      multipleLabel.getBoundingClientRect();


    /*
      The tail stays on the bottom of the card.
      The head follows the label entering from
      below: the arrow covers arrowProgress of the
      distance from the card bottom to 24px above
      the label, so it never touches the label and
      reaches it at arrowEnd. From labelMoveStart
      the length stays the same and the arrow
      moves up with the label until labelMoveEnd.
    */

    const restingLabelTop =
      centerY -
      labelHeight / 2;

    const arrowTargetTop =
      progress < labelMoveStart
        ? labelRect.top - stageRect.top
        : restingLabelTop;


    const restingArrowLength =
      Math.max(
        0,
        arrowTargetTop -
        arrowLabelGap -
        cardBottom
      ) *
      arrowProgress;


    arrowSystem.style.opacity =
      progress >= arrowStart &&
      progress < labelMoveEnd
        ? 1
        : 0;


    if (progress < labelMoveStart) {

      arrowSystem.style.top =
        `${cardBottom}px`;

      arrowSystem.style.height =
        `${restingArrowLength}px`;

    }

    else {

      const currentLabelTop =
        labelRect.top -
        stageRect.top;

      const arrowTop =
        currentLabelTop -
        arrowLabelGap -
        restingArrowLength;


      arrowSystem.style.top =
        `${arrowTop}px`;

      arrowSystem.style.height =
        `${restingArrowLength}px`;

    }


    arrowSystem.style.transform =
      `translateX(-50%)`;


    /* ==================================================
       11. REPRESENTATIONS
    ================================================== */

    const representationStart = 0.80;
    const representationEnd = 0.96;


    const representationProgress =
      clamp(
        (progress - representationStart) /
        (representationEnd - representationStart),
        0,
        1
      );


    /* TOOLS step 1: the picture leaves under the header */
    representation.style.transform =
      `
        translate(
          -50%,
          calc(-50% - ${toolsLeave * (representation.offsetTop + representation.offsetHeight / 2 + 20)}px)
        )
      `;


    if (progress >= representationStart) {

      representation.style.opacity = 1;


      const count =
        representations.length;


      if (progress < representationEnd) {

        const firstFiveCount =
          count - 1;

        const firstFiveProgress =
          representationProgress *
          firstFiveCount;

        const index =
          Math.min(
            firstFiveCount - 1,
            Math.floor(firstFiveProgress)
          );

        const localProgress =
          firstFiveProgress -
          index;

        showRepresentation(index);


        const rotation =
          lerp(
            -90,
            90,
            localProgress
          );


        const scale =
          0.92 +
          Math.sin(
            localProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

      else {

        const finalProgress =
          clamp(
            (progress - representationEnd) /
            (1 - representationEnd),
            0,
            1
          );


        showRepresentation(count - 1);


        const rotation =
          lerp(
            -90,
            0,
            finalProgress
          );


        const scale =
          0.92 +
          Math.sin(
            finalProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

    }

    else {

      representation.style.opacity = 0;

    }


    /* ==================================================
       12. TOOLS
    ================================================== */

    updateTools(
      scrollPos,
      pastEnd,
      stageH,
      {
        startPx: toolsStartPx,
        comeLen: toolsComeLen,
        appearPx: toolsAppearPx,
        spreadLen: toolsSpreadLen,
        drift: {
          spreadLen: toolsSpreadLen,
          start: toolsTiming.exitDriftStart,
          end: toolsTiming.exitDriftEnd,
          length: stageH,
          rampLen: toolsTiming.exitDriftRamp * stageH
        }
      }
    );


    requestAnimationFrame(
      updateAnimation
    );

  }


  /* ==================================================
     TOOLS: cloud of labels + description window
  ================================================== */

  const toolsLabel =
    document.getElementById("toolsLabel");

  const toolsCloud =
    document.getElementById("toolsCloud");

  const toolPopup =
    document.getElementById("toolPopup");

  const toolPopupIcon =
    document.getElementById("toolPopupIcon");

  const toolPopupText =
    document.getElementById("toolPopupText");


  /* the buttons, one per tool */
  const toolButtons =
    TOOLS.map(
      (tool, index) => {

        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "tool-label";
        button.textContent = tool.label[currentLang];
        button.setAttribute("aria-expanded", "false");
        button.setAttribute("aria-controls", "toolPopup");

        button.addEventListener(
          "click",
          () => toggleToolPopup(index)
        );

        toolsCloud.appendChild(button);

        return button;

      }
    );


  /*
    Rest layout for the current screen: TOOLS in the centre,
    every label with its distance and angle around it.
    Computed after the font is ready and on resize.
  */
  let toolsLayout = null;


  /* small fixed-seed random generator (same numbers every time) */
  function seededRandom(seed) {

    let a = seed >>> 0;

    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  }


  /*
    Where a label is when the cloud has spread by "t"
    (0 = the moment the labels appear, 1 = the end).
    Every label moves straight away from TOOLS, each with
    its own speed: its end factor is
      1 + (spread − 1) × (1 + variation × speed)
    where speed is its fixed number from −1 to 1.
  */
  function spreadPoint(item, layout, t) {

    const scale =
      1 + (layout.spread - 1) * (1 + layout.variation * item.speed) * t;

    return {
      x: layout.cx + (item.x - layout.cx) * scale,
      y: layout.cy + (item.y - layout.cy) * scale
    };

  }


  /*
    How far the drift has gone after "e" px of the exit, in px of
    "burst scrolling": the drift speed is
      ramp(e) × (start + (end − start) × e / length)
    of the burst speed, where ramp goes smoothly from 0 to 1 over
    the first rampLen px (so the labels start moving gently when
    the scene starts to move). This is that speed added up (an
    exact formula, so the positions are smooth and the same in
    both scroll directions).
  */
  function exitDriftAmount(e, start, end, length, rampLen) {

    if (e <= 0) {
      return 0;
    }

    const m = (end - start) / length;

    /* inside the ramp: speed = smoothstep(x / R) × (start + m·x) */
    const inRamp = (x) => {
      const u = x / rampLen;
      return rampLen * (
        start * (u * u * u - u * u * u * u / 2) +
        m * rampLen * (3 * u * u * u * u / 4 - 2 * u * u * u * u * u / 5)
      );
    };

    if (e <= rampLen) {
      return inRamp(e);
    }

    return inRamp(rampLen) +
      start * (e - rampLen) +
      m * (e * e - rampLen * rampLen) / 2;

  }


  /*
    Sideways a drifting label must not go past its own margin.
    d is how far it would go, room how far it may go: it moves
    freely, and in the last "soft" px it slows down smoothly and
    stops at the margin (no sudden stop).
  */
  function softLimit(d, room) {

    if (room <= 0.01) {
      return 0;
    }

    const soft = Math.min(room, 24);
    const free = room - soft;

    if (d <= free) {
      return d;
    }

    return free + soft * Math.tanh((d - free) / soft);

  }


  /* where a label is "e" px into the exit (the end of the burst
     plus the drift) */
  function exitPoint(item, layout, e, drift) {

    const end = spreadPoint(item, layout, 1);

    if (e <= 0) {
      return end;
    }

    /* the burst speed of this label, in "scale" per px */
    const rate =
      (layout.spread - 1) * (1 + layout.variation * item.speed) / drift.spreadLen;

    /* driftFactor: 1, or less if the layout had to soften the
       drift to keep the labels apart (see layoutTools) */
    const extra =
      rate * exitDriftAmount(e, drift.start, drift.end, drift.length, drift.rampLen) *
      (layout.driftFactor == null ? 1 : layout.driftFactor);

    /* sideways: up to this label's own margin */
    const dx = (item.x - layout.cx) * extra;
    const room = dx >= 0
      ? layout.right - item.w / 2 - end.x
      : end.x - (layout.left + item.w / 2);

    const side = softLimit(Math.abs(dx), Math.max(0, room));
    const x = end.x + Math.sign(dx) * side;

    /* up and down: free. The part of the drift that the margin
       holds back sideways goes up or down instead (away from
       TOOLS), so a label at its margin keeps floating */
    const blocked = Math.abs(dx) - side;
    const away = item.y >= layout.cy ? 1 : -1;
    const y = end.y + (item.y - layout.cy) * extra + away * blocked;

    return { x, y };

  }


  /* language, width and scene height of the last layout, and
     the layouts already made (one per language and size) */
  let toolsLayoutKey = "";
  const toolsLayouts = {};

  /* the Cyrillic font file is loaded only when Russian is
     used; the layout waits for it (the names are measured) */
  function langFontReady(lang) {

    if (lang !== "ru") {
      return Promise.resolve();
    }

    return document.fonts
      .load('400 16px "IBM Plex Mono"', "ИНСТРУМЕНТЫ АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ")
      .catch(() => {});

  }

  /* the language changed: close the window, take the layout
     of this language (made once, after its font is loaded) */
  function refreshToolsLanguage() {

    if (openToolIndex >= 0) {
      closeToolPopup(false);
    }

    const lang = currentLang;

    /* the names in the new language (the layout measures them) */
    toolButtons.forEach(
      (button, index) => { button.textContent = TOOLS[index].label[lang]; }
    );

    /* until the layout of this language is ready the cloud is
       not drawn (no frame with new names in old places) */
    toolsLayout = null;

    Promise.all([fontsLoaded, langFontReady(lang)]).then(
      () => {
        if (lang === currentLang) {
          layoutTools();
        }
      }
    );

  }

  function layoutTools() {

    const width = window.innerWidth;

    /* the height of the scene, not of the window: it does not
       change when the browser bars move */
    const height = document.querySelector(".sticky-stage").offsetHeight;
    const mobile = width <= 700;

    /* same language and size as last time: the layout would
       come out exactly the same, so do nothing; a layout made
       earlier for this language and size is taken as it is */
    const key = currentLang + ":" + width + "x" + height;

    if (key === toolsLayoutKey && toolsLayout) {
      return;
    }

    toolsLayoutKey = key;

    if (toolsLayouts[key]) {
      toolsLayout = toolsLayouts[key];
      return;
    }

    const { gap, margin, seed, spreadScale, spreadVariation } = TOOLS_SETTINGS;
    const cloud = mobile ? TOOLS_SETTINGS.cloudMobile : TOOLS_SETTINGS.cloud;

    /* the same size as the captions under the pictures */
    const caption =
      getComputedStyle(document.querySelector(".representation-info"));

    toolButtons.forEach(
      (button) => {
        button.style.fontSize = caption.fontSize;
        button.style.letterSpacing = caption.letterSpacing;
      }
    );

    const headerBottom =
      document.querySelector("header").getBoundingClientRect().bottom;

    /* TOOLS rests in the centre of the screen */
    const titleW = toolsLabel.offsetWidth;
    const titleH = toolsLabel.offsetHeight;

    const layout = {
      cx: width / 2,
      cy: height / 2,
      ax: width / 2 - margin,
      ay: height / 2 - margin - headerBottom / 2,
      spread: spreadScale,
      variation: spreadVariation,
      items: []
    };

    const area = {
      left: margin,
      right: width - margin,
      top: headerBottom + margin,
      bottom: height - margin
    };

    const title = {
      left: layout.cx - titleW / 2 - gap,
      right: layout.cx + titleW / 2 + gap,
      top: layout.cy - titleH / 2 - gap,
      bottom: layout.cy + titleH / 2 + gap
    };

    const sizes =
      toolButtons.map((b) => {
        /* whole px for the layout, and the exact size for the
           check of the exit (labels are a fraction of a px
           bigger than offsetWidth / offsetHeight say) */
        const r = b.getBoundingClientRect();
        return { w: b.offsetWidth, h: b.offsetHeight, wf: r.width, hf: r.height };
      });

    /* the speed of every label, from −1 to 1: fixed numbers
       from the seed, in the order of the TOOLS list */
    const speedRandom = seededRandom(seed + 1);
    const speeds = TOOLS.map(() => speedRandom() * 2 - 1);

    /* the uneven, tilted, shifted oval */
    const tilt = cloud.tilt * Math.PI / 180;

    const insideCloud = (u, v) => {
      const p = u - cloud.shift.x;
      const q = v - cloud.shift.y;
      const pr = p * Math.cos(-tilt) - q * Math.sin(-tilt);
      const qr = p * Math.sin(-tilt) + q * Math.cos(-tilt);
      const rho = Math.hypot(pr / cloud.size.x, qr / cloud.size.y);
      const phi = Math.atan2(qr, pr);
      const edge = 1 + cloud.wobble[0] * Math.sin(2 * phi + 1.3) + cloud.wobble[1] * Math.sin(3 * phi + 4.1);
      return rho <= edge;
    };

    const insideArea = (p, item) =>
      p.x - item.w / 2 >= area.left && p.x + item.w / 2 <= area.right &&
      p.y - item.h / 2 >= area.top && p.y + item.h / 2 <= area.bottom;

    const onTitle = (p, item) =>
      p.x + item.w / 2 > title.left && p.x - item.w / 2 < title.right &&
      p.y + item.h / 2 > title.top && p.y - item.h / 2 < title.bottom;

    const apartFrom = (a, item, b, other) =>
      Math.abs(a.x - b.x) >= (item.w + other.w) / 2 + gap ||
      Math.abs(a.y - b.y) >= (item.h + other.h) / 2 + gap;

    /* checked at 20 points of the movement plus the end */
    const steps = [];
    for (let k = 0; k <= 20; k++) {
      steps.push(k / 20);
    }

    const random = seededRandom(seed);

    /* clump centres: spread around TOOLS on the oval,
       each a bit off its even place (fixed numbers) */
    const clumps = [];
    for (let k = 0; k < cloud.clumps; k++) {
      const angle = (k / cloud.clumps) * 2 * Math.PI + (random() - 0.5) * 0.9;
      const radius = 0.45 + random() * 0.3;
      const p = Math.cos(angle) * radius * cloud.size.x;
      const q = Math.sin(angle) * radius * cloud.size.y;
      clumps.push({
        u: cloud.shift.x + p * Math.cos(tilt) - q * Math.sin(tilt),
        v: cloud.shift.y + p * Math.sin(tilt) + q * Math.cos(tilt)
      });
    }

    /* longest labels first */
    const order =
      sizes.map((s, index) => ({ index, ...s }))
        .sort((a, b) => b.w - a.w || a.index - b.index);

    const placed = [];

    for (const entry of order) {

      const clump = clumps[entry.index % clumps.length];
      const item = {
        index: entry.index, w: entry.w, h: entry.h, wf: entry.wf, hf: entry.hf,
        speed: speeds[entry.index], x: 0, y: 0
      };
      let fallback = null;
      let found = false;

      for (let attempt = 0; attempt < 3000 && !found; attempt++) {

        const spread = cloud.clumpSpread * (1 + attempt / 600);
        const u = clump.u + (random() + random() + random() - 1.5) / 1.5 * spread;
        const v = clump.v + (random() + random() + random() - 1.5) / 1.5 * spread;

        if (!insideCloud(u, v) && attempt < 1500) {
          continue;
        }

        item.x = layout.cx + u * layout.ax;
        item.y = layout.cy + v * layout.ay;

        /* at the start: inside the screen, off TOOLS */
        const p = spreadPoint(item, layout, 0);

        if (!insideArea(p, item) || onTitle(p, item)) {
          continue;
        }

        /* apart from the others all the way, each with its speed */
        const apart = steps.every(
          (t) => {
            const a = spreadPoint(item, layout, t);
            return !onTitle(a, item) &&
              placed.every((other) => apartFrom(a, item, spreadPoint(other, layout, t), other));
          }
        );

        if (!apart) {
          continue;
        }

        /* best: still inside the screen at the full spread */
        if (insideArea(spreadPoint(item, layout, 1), item)) {
          found = true;
        }
        else if (!fallback) {
          fallback = { x: item.x, y: item.y };
        }

      }

      if (!found) {
        if (fallback) {
          item.x = fallback.x;
          item.y = fallback.y;
        }
        else {
          console.warn("TOOLS: no free place for", TOOLS[item.index].label[currentLang]);
        }
      }

      placed.push(item);

    }

    /* 1) one common spread: as wanted, or less if a label at its
       middle speed would leave the screen or go under the header */
    let spread = spreadScale;

    placed.forEach(
      (item) => {
        const dx = item.x - layout.cx;
        const dy = item.y - layout.cy;
        if (dx > 0) spread = Math.min(spread, (area.right - item.w / 2 - layout.cx) / dx);
        if (dx < 0) spread = Math.min(spread, (area.left + item.w / 2 - layout.cx) / dx);
        if (dy > 0) spread = Math.min(spread, (area.bottom - item.h / 2 - layout.cy) / dy);
        if (dy < 0) spread = Math.min(spread, (area.top + item.h / 2 - layout.cy) / dy);
      }
    );

    layout.spread = Math.max(1, spread);

    /* 2) the whole movement with the own speeds: nothing touches
       another label, TOOLS, the header or the screen edge */
    const burstClear = () =>
      steps.every(
        (t) => placed.every(
          (item, i) => {
            const a = spreadPoint(item, layout, t);
            return insideArea(a, item) && !onTitle(a, item) &&
              placed.every((other, j) => j <= i || apartFrom(a, item, spreadPoint(other, layout, t), other));
          }
        )
      );

    /* the side margins, for the drift while the scene leaves */
    layout.left = area.left;
    layout.right = area.right;
    layout.driftFactor = 1;

    /* 3) the exit: while the scene goes up, the labels keep
       drifting; the ones still on the screen (below the header,
       above the bottom) must not touch each other or TOOLS */
    const timing = TOOLS_SETTINGS.timing[mobile ? "phone" : "desktop"];
    const drift = {
      spreadLen: timing.spreadScroll * height,
      start: timing.exitDriftStart,
      end: timing.exitDriftEnd,
      length: height,
      rampLen: timing.exitDriftRamp * height
    };

    /* every 1px of the exit, so even a short touch is found */
    const exitSteps = [];
    for (let e = 1; e <= height; e += 1) {
      exitSteps.push(e);
    }

    /* the real box of a label: it starts where the layout puts
       it (centre minus half the whole-px size) and is exactly
       as big as it is drawn */
    const box = (p, item) => {
      const left = p.x - item.w / 2, top = p.y - item.h / 2;
      return { left, top, right: left + item.wf, bottom: top + item.hf };
    };

    const touching = (a, item, b, other) => {
      const A = box(a, item), B = box(b, other);
      return A.left < B.right && B.left < A.right && A.top < B.bottom && B.top < A.bottom;
    };

    const exitClear = () =>
      exitSteps.every(
        (e) => {
          const shown = placed
            .map((item) => ({ item, p: exitPoint(item, layout, e, drift) }))
            .filter(({ item, p }) => box(p, item).bottom - e > headerBottom && box(p, item).top - e < height);
          const titleShown = title.bottom - gap - e > headerBottom;
          return shown.every(
            ({ item, p }, i) =>
              !(titleShown &&
                p.x + item.w / 2 > title.left + gap && p.x - item.w / 2 < title.right - gap &&
                p.y + item.h / 2 > title.top + gap && p.y - item.h / 2 < title.bottom - gap) &&
              shown.every(({ item: other, p: q }, j) => j <= i || !touching(p, item, q, other))
          );
        }
      );

    const allClear = () => burstClear() && exitClear();

    /* if not, the range of speeds is narrowed step by step,
       then the drift on the exit is made softer, and as the
       last resort the common spread is made smaller */
    let narrowed = false;

    while (!allClear() && layout.variation > 0) {
      layout.variation = Math.max(0, +(layout.variation - 0.01).toFixed(2));
      narrowed = true;
    }

    for (let k = 0; k < 30 && burstClear() && !exitClear(); k++) {
      layout.driftFactor *= 0.9;
      narrowed = true;
    }

    for (let k = 0; k < 40 && !allClear() && layout.spread > 1; k++) {
      layout.spread = 1 + (layout.spread - 1) * 0.9;
      narrowed = true;
    }

    const low = 1 + (layout.spread - 1) * (1 - layout.variation);
    const high = 1 + (layout.spread - 1) * (1 + layout.variation);
    const report =
      `TOOLS ${width}×${height}: label speeds ${low.toFixed(4)}…${high.toFixed(4)}` +
      ` (spread ${layout.spread.toFixed(4)}, variation ${layout.variation.toFixed(2)}, exit drift ×${layout.driftFactor.toFixed(2)})`;

    if (narrowed || layout.spread < spreadScale) {
      console.warn(report + " – narrowed to stay clear");
    }
    else {
      console.info(report);
    }

    if (!allClear()) {
      console.warn("TOOLS: labels still touch at the start, change seed or cloud");
    }

    layout.items = placed.sort((a, b) => a.index - b.index);

    toolsLayout = layout;
    toolsLayouts[key] = layout;

  }


  /*
    Recompute the layout when the window size really changes
    (width, rotation, a different window), after the size
    settles. A change of the visible height only because the
    browser bars moved does not change the scene height, so
    layoutTools() sees the same size and keeps the cloud as
    it is.
  */
  let toolsResizeTimer = null;

  window.addEventListener(
    "resize",
    () => {
      clearTimeout(toolsResizeTimer);
      toolsResizeTimer = setTimeout(layoutTools, 150);
    }
  );

  Promise.all([fontsLoaded, langFontReady(currentLang)]).then(layoutTools);


  /*
    scrollPos – px scrolled from the start of the section
    pastEnd   – px scrolled past the end of the pinned part
                (below 0 while the scene is still pinned)
    height    – height of the scene in px
    tl        – the TOOLS part in px: startPx (TOOLS starts to
                come in), comeLen (how long it comes in),
                appearPx (the labels appear), spreadLen (how
                long they spread)
  */
  function updateTools(scrollPos, pastEnd, height, tl) {

    const comeIn =
      smoothstep(clamp((scrollPos - tl.startPx) / tl.comeLen, 0, 1));

    const titleH = toolsLabel.offsetHeight;
    const { exitSpeed } = TOOLS_SETTINGS;

    /* after the section ends the page moves the scene up by
       itself; exitSpeed adds (or takes away) extra movement */
    const exit = Math.max(0, pastEnd);
    const extraY = (exitSpeed - 1) * exit;

    /* the cloud grows evenly with the scroll, from the moment
       the labels appear */
    const spreadTime =
      clamp((scrollPos - tl.appearPx) / tl.spreadLen, 0, 1);

    /* the scene has gone up out of the screen */
    const gone = exit * exitSpeed >= height;


    /* TOOLS: from below to the centre, then up with the page */
    const titleTop =
      lerp(height + 3, height / 2 - titleH / 2, comeIn) - extraY;

    toolsLabel.style.top = `${titleTop}px`;
    toolsLabel.style.visibility =
      scrollPos > tl.startPx && !gone ? "visible" : "hidden";


    /* the cloud: all labels switch on together after the
       stop of TOOLS in the centre */
    const cloudOn =
      scrollPos >= tl.appearPx && !gone && toolsLayout;

    if (!cloudOn) {

      toolButtons.forEach((b) => { b.style.visibility = "hidden"; });

      if (openToolIndex >= 0) {
        closeToolPopup(false);
      }

      return;

    }

    toolsLayout.items.forEach(
      (item) => {

        const button = toolButtons[item.index];

        /* before the exit: the burst (and the stop after it);
           on the exit: the end of the burst plus the drift */
        const p = exit > 0
          ? exitPoint(item, toolsLayout, exit, tl.drift)
          : spreadPoint(item, toolsLayout, spreadTime);

        button.style.visibility = "visible";
        button.style.transform =
          `translate(${p.x - item.w / 2}px, ${p.y - extraY - item.h / 2}px)`;

      }
    );

  }


  /* ---------- description window ---------- */

  let openToolIndex = -1;
  let openToolScrollY = 0;


  function toggleToolPopup(index) {

    if (openToolIndex === index) {
      closeToolPopup(true);
      return;
    }

    if (openToolIndex >= 0) {
      closeToolPopup(false);
    }

    const tool = TOOLS[index];
    const button = toolButtons[index];

    toolPopupIcon.src = TOOL_ICONS[tool.platform];
    toolPopupText.textContent = tool.description[currentLang];
    toolPopupText.style.textTransform =
      TOOLS_SETTINGS.descriptionUppercase ? "uppercase" : "none";

    /* the name is not shown, but screen readers get it */
    toolPopup.setAttribute("aria-label", tool.label[currentLang]);

    toolPopup.hidden = false;
    button.setAttribute("aria-expanded", "true");

    openToolIndex = index;
    openToolScrollY = window.scrollY;

    placeToolPopup(button);

  }


  function placeToolPopup(button) {

    const mobile = window.innerWidth <= 700;

    toolPopup.classList.toggle("is-sheet", mobile);

    if (mobile) {
      toolPopup.style.left = "";
      toolPopup.style.top = "";
      return;
    }

    const edge = 16;
    const rect = button.getBoundingClientRect();
    const box = toolPopup.getBoundingClientRect();

    const headerBottom =
      document.querySelector("header").getBoundingClientRect().bottom;

    let left = rect.left + rect.width / 2 - box.width / 2;
    left = clamp(left, edge, window.innerWidth - box.width - edge);

    /* below the label, or above it if there is no room */
    let top = rect.bottom + 10;

    if (top + box.height > window.innerHeight - edge) {
      top = rect.top - box.height - 10;
    }

    top = clamp(top, headerBottom + 8, window.innerHeight - box.height - edge);

    toolPopup.style.left = `${left}px`;
    toolPopup.style.top = `${top}px`;

  }


  function closeToolPopup(returnFocus) {

    if (openToolIndex < 0) {
      return;
    }

    const button = toolButtons[openToolIndex];

    toolPopup.hidden = true;
    button.setAttribute("aria-expanded", "false");
    openToolIndex = -1;

    if (returnFocus) {
      button.focus({ preventScroll: true });
    }

  }


  /* Esc closes */
  document.addEventListener(
    "keydown",
    (event) => {
      if (event.key === "Escape" && openToolIndex >= 0) {
        closeToolPopup(true);
      }
    }
  );

  /* a click outside the window (and outside its label) closes */
  document.addEventListener(
    "pointerdown",
    (event) => {

      if (openToolIndex < 0) {
        return;
      }

      const button = toolButtons[openToolIndex];

      if (toolPopup.contains(event.target) || button.contains(event.target)) {
        return;
      }

      closeToolPopup(false);

      /* the browser moves focus to the clicked spot after this
         event; give it back to the label unless the click went
         to something that takes focus itself */
      setTimeout(
        () => {
          if (!document.activeElement || document.activeElement === document.body) {
            button.focus({ preventScroll: true });
          }
        },
        0
      );

    }
  );

  /* scrolling moves the cloud, so the window closes */
  window.addEventListener(
    "scroll",
    () => {
      if (openToolIndex >= 0 &&
          Math.abs(window.scrollY - openToolScrollY) > TOOLS_SETTINGS.closeOnScroll) {
        closeToolPopup(true);
      }
    },
    { passive: true }
  );


  /* ==================================================
     VIDEO: filled from VIDEO_SETTINGS
  ================================================== */

  /*
    Fills the DEMO section for the current language. Runs at the
    start and again when the language changes. Only the file of
    the current language is loaded. If a video is playing when
    the language changes, it stops and goes back to the start:
    the other language is another file, so it can not go on
    from the same moment.
  */
  function buildVideo() {

    const frame = document.getElementById("videoFrame");
    const link = document.getElementById("videoFullLink");

    const lang = VIDEO_SETTINGS.videoLang;
    const pick = (value) =>
      value && typeof value === "object" ? value[lang] : value;

    const videoSrc = pick(VIDEO_SETTINGS.videoSrc);
    const fullHref = pick(VIDEO_SETTINGS.fullVersionHref);

    /* the shape of the frame (and of the "coming soon" box) */
    document.documentElement.style.setProperty(
      "--video-aspect",
      `${VIDEO_SETTINGS.aspect.width} / ${VIDEO_SETTINGS.aspect.height}`
    );

    /* the caption from VIDEO_SETTINGS, or the I18N text when
       it is empty for this language */
    document.getElementById("videoCaption").textContent =
      pick(VIDEO_SETTINGS.caption) || t("videoCaption");

    let video = frame.querySelector("video");

    if (videoSrc) {

      frame.querySelectorAll(".video-placeholder").forEach((box) => box.remove());

      if (!video) {

        video = document.createElement("video");

        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.setAttribute("playsinline", "");

        if (VIDEO_SETTINGS.posterSrc) {
          video.poster = VIDEO_SETTINGS.posterSrc;
        }

        frame.appendChild(video);

      }

      if (video.getAttribute("src") !== videoSrc) {
        video.pause();
        video.setAttribute("src", videoSrc);
        video.load();
      }

      video.setAttribute("aria-label", t("videoLabel"));

    }

    else {

      if (video) {
        video.pause();
        video.remove();
      }

      let box = frame.querySelector(".video-placeholder");

      if (!box) {
        box = document.createElement("div");
        box.className = "video-placeholder section-small";
        frame.appendChild(box);
      }

      box.textContent = t("demoComingSoon");

    }

    link.removeAttribute("href");
    link.removeAttribute("target");
    link.removeAttribute("rel");
    link.removeAttribute("role");
    link.removeAttribute("aria-disabled");
    link.removeAttribute("tabindex");

    if (fullHref) {

      link.href = fullHref;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = t("watchFull");

    }

    else {

      /* no address yet: still reachable with Tab and read
         out, but marked as not available and goes nowhere */
      link.setAttribute("role", "link");
      link.setAttribute("aria-disabled", "true");
      link.tabIndex = 0;
      link.textContent = t("fullComingSoon");

    }

  }

  VIDEO_SETTINGS.videoLang = currentLang;
  buildVideo();


  /* ==================================================
     ACCESS: rows from ACCESS_SETTINGS
  ================================================== */

  /* platforms already requested in this visit of the
     page: trackInterest is called only once for each */
  const requestedPlatforms = new Set();

  /* runs at the start and again when the language changes;
     a platform already requested keeps showing the message */
  function buildAccess() {

    const list = document.getElementById("accessList");

    list.replaceChildren();

    ACCESS_SETTINGS.forEach(
      (row) => {

        const item = document.createElement("li");
        item.className = "access-row";

        const icon = document.createElement("img");
        icon.className = "access-icon";
        icon.src = TOOL_ICONS[row.platform];
        icon.alt = "";

        const names = document.createElement("div");
        names.className = "access-name-block";

        const name = document.createElement("span");
        name.className = "section-small";
        name.textContent = row.platform;

        const status = document.createElement("span");
        status.className = "section-small access-status";
        status.textContent =
          I18N[currentLang].status[row.status] || row.status;

        names.append(name, status);

        /* screen readers announce what appears here */
        const action = document.createElement("div");
        action.className = "access-action";
        action.setAttribute("aria-live", "polite");

        const showMessage = () => {

          const message = document.createElement("p");
          message.className = "access-message section-small";
          message.textContent = t("accessMessage");
          message.tabIndex = -1;

          action.classList.add("is-done");
          action.replaceChildren(message);

          return message;

        };

        const button = document.createElement("button");
        button.type = "button";
        button.className = "access-button section-small";
        button.textContent = t("requestAccess");
        button.setAttribute("aria-label", t("requestAccess") + ": " + row.platform);

        button.addEventListener(
          "click",
          () => {

            if (!requestedPlatforms.has(row.platform)) {
              requestedPlatforms.add(row.platform);
              trackInterest(row.platform);
            }

            /* keep the keyboard in the same place */
            showMessage().focus({ preventScroll: true });

          }
        );

        if (requestedPlatforms.has(row.platform)) {
          showMessage();
        }
        else {
          action.appendChild(button);
        }
        item.append(icon, names, action);
        list.appendChild(item);

      }
    );

  }

  buildAccess();


  /* ==================================================
     CONTACT: rows from CONTACT_SETTINGS
  ================================================== */

  /* runs at the start and again when the language changes */
  function buildContact() {

    const body = document.getElementById("contactBody");

    body.replaceChildren();

    document.getElementById("contactIntro").textContent =
      t("contactIntro");

    const rows =
      CONTACT_SETTINGS.filter((row) => row.value && row.value.trim());

    if (!rows.length) {

      const empty = document.createElement("p");
      empty.className = "contact-empty section-small";
      empty.textContent = t("contactsComingSoon");

      body.appendChild(empty);
      return;

    }

    const list = document.createElement("ul");
    list.className = "contact-list";

    rows.forEach(
      (row) => {

        const item = document.createElement("li");
        item.className = "contact-row section-small";

        if (row.label) {
          const label = document.createElement("span");
          label.textContent = row.label;
          item.appendChild(label);
        }

        let href = (row.href || "").trim();

        if (!href && /^[^\s@]+@[^\s@]+$/.test(row.value.trim())) {
          href = "mailto:" + row.value.trim();
        }

        let value;

        if (href) {

          value = document.createElement("a");
          value.className = "text-link";
          value.href = href;

          if (!href.startsWith("mailto:")) {
            value.target = "_blank";
            value.rel = "noopener";
          }

        }

        else {
          value = document.createElement("span");
        }

        value.classList.add("contact-value");
        value.textContent = row.value;

        item.appendChild(value);
        list.appendChild(item);

      }
    );

    body.appendChild(list);

  }

  buildContact();


  /* ==================================================
     LANGUAGE BUTTON and its note
  ================================================== */

  const langButton = document.getElementById("langButton");
  const langText = document.getElementById("langText");
  const langHint = document.getElementById("langHint");

  let langHintTimer = null;
  let langHintScrollY = 0;

  function setupLangButton() {

    const { labels, ruAvailable } = LANG_SETTINGS;

    langText.textContent = labels[currentLang];

    /* what a screen reader says: the language it switches to,
       in that language */
    if (!ruAvailable) {
      langButton.setAttribute("aria-label", "Russian version (coming soon)");
      langButton.removeAttribute("lang");
      return;
    }

    langButton.setAttribute("aria-label", t("langButtonAria"));
    langButton.setAttribute("lang", t("langButtonAriaLang"));

  }


  /*
    Puts the whole page into "lang" at once: texts, the browser
    tab, the language of the page, the video, the access and
    contact rows, the TOOLS cloud. The scroll position stays.
  */
  function applyLanguage(lang) {

    currentLang = lang;

    document.documentElement.lang = lang;
    document.title = t("pageTitle");

    document.querySelectorAll("[data-i18n]").forEach(
      (element) => {
        element.textContent = t(element.dataset.i18n);
      }
    );

    setupLangButton();

    VIDEO_SETTINGS.videoLang = lang;
    buildVideo();
    buildAccess();
    buildContact();

    refreshToolsLanguage();
    rebuildIntroLetters();
    updateRepresentationLanguage();

  }

  /* the button: the other language, remembered, and the
     address updated (?lang=…) without reloading */
  function switchLanguage() {

    const next = currentLang === "en" ? "ru" : "en";

    applyLanguage(next);
    storeLang(next);

    try {
      const address = new URL(window.location.href);
      address.searchParams.set("lang", next);
      window.history.replaceState(window.history.state, "", address.toString());
    }
    catch (error) {
      /* the address can not be changed here (for example a
         local file in some browsers): the language still works */
    }

  }

  function hideLangHint() {

    clearTimeout(langHintTimer);
    langHint.classList.remove("is-visible");
    langHint.textContent = "";

  }

  function showLangHint() {

    langHint.classList.add("is-visible");
    langHint.textContent = LANG_SETTINGS.comingSoonText;

    langHintScrollY = window.scrollY;

    clearTimeout(langHintTimer);
    langHintTimer = setTimeout(hideLangHint, LANG_SETTINGS.hintMs);

  }

  langButton.addEventListener(
    "click",
    () => {

      if (LANG_SETTINGS.ruAvailable) {
        switchLanguage();
        return;
      }

      /* pressing again while the note is visible closes it */
      if (langHint.classList.contains("is-visible")) {
        hideLangHint();
      }
      else {
        showLangHint();
      }

    }
  );

  document.addEventListener(
    "keydown",
    (event) => {
      if (event.key === "Escape") {
        hideLangHint();
      }
    }
  );

  document.addEventListener(
    "pointerdown",
    (event) => {
      if (!langButton.contains(event.target) && !langHint.contains(event.target)) {
        hideLangHint();
      }
    }
  );

  window.addEventListener(
    "scroll",
    () => {
      if (langHint.classList.contains("is-visible") &&
          Math.abs(window.scrollY - langHintScrollY) > 10) {
        hideLangHint();
      }
    },
    { passive: true }
  );

  /* the page opens in the detected language */
  if (currentLang !== "en") {
    applyLanguage(currentLang);
  }
  else {
    setupLangButton();
  }


  updateAnimation();

</script>


</body>
</html>
