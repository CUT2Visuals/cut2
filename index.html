<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    Page title, description and the picture for link previews.
    These values repeat SEO_SETTINGS (in the script below). They
    are written here in plain HTML on purpose: search engines and
    social networks do not run scripts. If you change one, change
    the other.
  -->
  <title>CUT2 — one project, multiple platforms</title>
  <meta name="description" content="CUT2: tools for AutoCAD, SketchUp and InDesign built around one asset and its many representations. An independent R&amp;D project by Anton Bratkov.">
  <link rel="canonical" href="https://cut2.tools/">

  <meta property="og:title" content="CUT2 — one project, multiple platforms">
  <meta property="og:description" content="CUT2: tools for AutoCAD, SketchUp and InDesign built around one asset and its many representations. An independent R&amp;D project by Anton Bratkov.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cut2.tools/">
  <meta property="og:image" content="https://cut2.tools/og-image.png">
  <meta property="og:image:alt" content="CUT2 — one project, multiple platforms">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f3f0e8">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- the font is part of the site (fonts/), no Google Fonts -->
  <link
    rel="preload"
    href="fonts/ibm-plex-mono-latin-400.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  >
  <!-- tiny file (1 KB) with the arrow →; the TOOLS names use it -->
  <link
    rel="preload"
    href="fonts/ibm-plex-mono-arrows-400.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  >

  <style>

    /* ==================================================
       FONT: IBM Plex Mono Regular 2.3 (SIL Open Font
       License, see fonts/OFL.txt). Only the weight that
       the site uses (400). The browser loads a file only
       when the text needs its characters (unicode-range).
    ================================================== */

    /* Latin: letters, digits, punctuation, dashes, middle dot */
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;

      src: url("fonts/ibm-plex-mono-latin-400.woff2") format("woff2");

      unicode-range:
        U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
        U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F,
        U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
        U+FEFF, U+FFFD;
    }

    /* Cyrillic: for the future Russian version */
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;

      src: url("fonts/ibm-plex-mono-cyrillic-400.woff2") format("woff2");

      unicode-range:
        U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    /* the arrows ← and → (not in the Latin file above;
       cut from the complete IBM Plex Mono 2.005) */
    @font-face {
      font-family: "IBM Plex Mono";
      font-style: normal;
      font-weight: 400;
      font-display: swap;

      src: url("fonts/ibm-plex-mono-arrows-400.woff2") format("woff2");

      unicode-range: U+2190, U+2192;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #f3f0e8;
      color: #000;

      font-family:
        "IBM Plex Mono",
        "Courier New",
        monospace;
    }

    body {
      overflow-x: hidden;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #000;
      background: #f3f0e8;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
      font-weight: 400;
    }

    /*
      Language button on the right: plain text that looks exactly
      like the logo on the left (same size, weight, line height and
      letter spacing, on desktop and on phone). It has no hover
      effect and no animation; it only changes its text when the
      language changes.
    */
    .lang-button {
      /* the touch area is bigger than the text (at least 44px
         high, 12px wider on each side); the negative margin
         gives that space back, so the text stays exactly where
         it was and the header does not change */
      min-height: 44px;
      margin: 0 -12px 0 0;
      padding: 0 12px;

      display: flex;
      align-items: center;

      border: 0;
      border-radius: 0;
      background: none;
      color: #000;

      /* the same as .logo */
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      line-height: normal;
      letter-spacing: normal;
      text-transform: none;

      cursor: pointer;

      /* no animation, no grey flash when tapped on iPhone */
      transition: none;
      -webkit-tap-highlight-color: transparent;
    }

    .lang-button:focus {
      outline: none;
    }

    /* the focus frame goes around the text, not around the
       whole touch area */
    .lang-button:focus-visible .lang-text {
      outline: 1px solid #000;
      outline-offset: 3px;
    }

    /* small note under the button; does not move anything */
    .lang-hint {
      position: fixed;
      top: 72px;
      right: 28px;

      max-width: calc(100vw - 56px);

      margin: 0;
      padding: 8px 12px;

      border: 1px solid #000;
      background: #f3f0e8;
      color: #000;

      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;

      text-transform: uppercase;
      letter-spacing: 0.04em;

      z-index: 110;

      visibility: hidden;
    }

    .lang-hint.is-visible {
      visibility: visible;
    }


    /* ==================================================
       MAIN SYSTEM
    ================================================== */

    /*
      The script sets the exact height from TOOLS_SETTINGS.timing
      (817vh + 100vh × (comeIn + hold + spreadScroll + holdAfter)).
      The values here are the same numbers for the default
      settings, so the page has the right length before the
      script runs:
        desktop 817 + 40 + 40 + 50 + 40   = 987vh
        phone   817 + 50 + 50 + 60 + 50   = 1027vh
    */
    .asset-system {
      position: relative;
      height: 987vh;
    }

    .sticky-stage {
      position: sticky;

      top: 0;

      width: 100%;
      height: 100vh;

      overflow: hidden;
    }


    /* ==================================================
       UPPER SYSTEM
    ================================================== */

    .project-label,
    .platforms-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;

      z-index: 8;
    }

    .platforms-label {
      opacity: 0;
    }


    /* ==================================================
       CUT2 → ONE PROJECT (cell division)
    ================================================== */

    .visually-hidden {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* Keeps the label box exactly the size of "ONE PROJECT" */
    .project-sizer {
      visibility: hidden;
    }

    /* Zero-size marker: its top is the text baseline */
    .project-baseline {
      display: inline-block;

      width: 0;
      height: 0;
    }

    /* Letters drawn as SVG paths (with masks) */
    .project-svg {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      overflow: visible;
    }


    /* ==================================================
       PLATFORM ROW
    ================================================== */

    .platforms-row {
      position: absolute;

      left: 50%;
      top: calc(50% + clamp(90px, 7vw, 120px));

      width: min(560px, 80vw);

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      transform:
        translate(-50%, -50%);

      opacity: 1;

      z-index: 8;
    }

    .platform-item {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;

      width: 72px;
    }

    .platform-icon {
      width: 72px;
      height: 72px;

      object-fit: contain;

      opacity: 0;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .platform-name {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;

      white-space: nowrap;

      opacity: 0;
    }


    /* ==================================================
       UPPER ARROWS
    ================================================== */

    .upper-arrow {
      position: absolute;

      left: 50%;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 7;

      transform: translateX(-50%);
    }

    .upper-arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .upper-arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .upper-arrow-head::before,
    .upper-arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .upper-arrow-head::before {
      transform: rotate(225deg);
    }

    .upper-arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       ONE ASSET
    ================================================== */

    .asset-card {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(252px, 49vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      z-index: 5;
    }

    .asset-label {
      position: absolute;

      left: 50%;
      bottom: calc(100% + 28px);

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }


    /* ==================================================
       LOWER ARROW
    ================================================== */

    .arrow-system {
      position: absolute;

      left: 50%;
      top: 0;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 4;

      transform: translateX(-50%);
    }

    .arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .arrow-head::before,
    .arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .arrow-head::before {
      transform: rotate(225deg);
    }

    .arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       MULTIPLE REPRESENTATIONS
    ================================================== */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;

      z-index: 3;
    }


    /* ==================================================
       REPRESENTATIONS
    ================================================== */

    .representation {
      position: absolute;

      left: 50%;
      top: 58%;

      width: min(620px, 76vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      pointer-events: none;

      z-index: 2;
    }

    .representation-visual {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .representation-image {
      display: block;

      width: 70%;
      height: 70%;

      object-fit: contain;
    }

    /* pictures that are loaded but not shown: out of the layout,
       invisible (the shown one keeps the same place as before) */
    .representation-image.is-hidden {
      position: absolute;

      visibility: hidden;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       TOOLS
    ================================================== */

    .tools-label {
      position: absolute;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      visibility: hidden;

      z-index: 4;
    }

    .tools-cloud {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 3;
    }

    /* one label of the cloud: plain text, real button */
    .tool-label {
      position: absolute;

      left: 0;
      top: 0;

      margin: 0;
      padding: 2px 4px;

      border: 0;
      background: none;
      color: inherit;

      font-family: inherit;
      font-weight: 400;
      line-height: 1.2;
      text-transform: uppercase;
      white-space: nowrap;

      /* size and letter spacing are copied from
         .representation-info by the script */

      cursor: pointer;
      pointer-events: auto;

      transform-origin: center center;

      visibility: hidden;
    }

    .tool-label:focus {
      outline: none;
    }

    .tool-label:focus-visible {
      outline: 1px solid #000;
      outline-offset: 3px;
    }

    /* small window with the tool description */
    .tool-popup {
      position: fixed;

      left: 0;
      top: 0;

      width: 320px;
      max-width: calc(100vw - 32px);

      /* never taller than the screen under the header
         (64px header + 16px edge above and below);
         a longer text scrolls inside the window */
      max-height: calc(100vh - 96px);
      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 16px;

      border: 1px solid #000;
      background: #f3f0e8;
      color: #000;

      font-size: 12px;
      line-height: 1.5;

      z-index: 150;
    }

    .tool-popup[hidden] {
      display: none;
    }

    .tool-popup:not([hidden]) {
      display: flex;
      align-items: flex-start;

      gap: 12px;
    }

    .tool-popup-icon {
      flex: none;

      width: 24px;
      height: 24px;

      object-fit: contain;
    }

    .tool-popup-text {
      margin: 0;
    }

    /* phone: panel at the bottom, full width */
    .tool-popup.is-sheet {
      left: 0;
      right: 0;
      top: auto;
      bottom: 0;

      width: auto;
      max-width: none;

      /* at most 45 % of the screen height, the rest
         scrolls inside the panel (not the page) */
      max-height: 45vh;
      max-height: 45svh;

      border-width: 1px 0 0;
    }

    @media (max-width: 700px) {

      .tools-label {
        font-size: 26px;
      }

    }


    /* ==================================================
       SECTIONS AFTER THE SCENE (normal scrolling)
    ================================================== */

    /* no lines: the space above and below (= header
       height, so 128px between two sections) keeps them
       apart; side space as in the header */
    .page-section {
      padding: 64px 28px;
    }

    /* the same size as TOOLS and the other big words,
       in the middle of the screen */
    .section-title {
      margin: 0 0 28px;

      text-align: center;

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;
      line-height: 1.2;

      text-transform: uppercase;
    }

    /* small caption text, as under the representations */
    .section-small {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .text-link {
      color: inherit;

      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    /* link without an address yet: dashed, goes nowhere */
    .text-link[aria-disabled="true"] {
      text-decoration-style: dashed;

      cursor: default;
    }

    .page-section a:focus,
    .page-section button:focus,
    .page-section video:focus {
      outline: none;
    }

    .page-section a:focus-visible,
    .page-section button:focus-visible,
    .page-section video:focus-visible {
      outline: 1px solid #000;
      outline-offset: 3px;
    }

    /* when Tab scrolls to an item, it stops below the
       header (64px + 24px gap), not under it */
    .page-section a,
    .page-section button,
    .page-section video {
      scroll-margin-top: 88px;
    }


    /* ==================================================
       VIDEO
    ================================================== */

    /* the video goes edge to edge, only the texts keep
       the side space */
    .video-section {
      padding-left: 0;
      padding-right: 0;
    }

    .video-section .section-title,
    .video-info {
      padding: 0 28px;
    }

    /* never taller than the screen under the header, so the
       whole video and its controls fit; on short screens the
       picture gets black side bars */
    .video-frame {
      width: 100%;

      /* the shape of the video; the script takes it from
         VIDEO_SETTINGS.aspect (the value here is the same,
         it only keeps the space reserved until the script
         runs, so the page does not jump) */
      aspect-ratio: var(--video-aspect, 1760 / 1036);
      max-height: calc(100vh - 64px);

      background: #000;
    }

    .video-frame video {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      background: #000;

      scroll-margin-top: 64px;
    }

    /* black box while there is no video file yet */
    .video-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #f3f0e8;
    }

    .video-info {
      margin-top: 18px;

      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;

      gap: 12px;
    }


    /* ==================================================
       ACCESS
    ================================================== */

    /* the three platforms one under another, the same on
       every screen */
    .access-list {
      margin: 0;
      padding: 0;

      list-style: none;

      display: flex;
      flex-direction: column;

      gap: 28px;
    }

    /* one platform: icon, name, status, button, all in
       one column in the middle of the screen */
    .access-row {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 12px;

      text-align: center;
    }

    .access-icon {
      flex: none;

      width: 24px;
      height: 24px;

      object-fit: contain;
    }

    /* name with the status under it */
    .access-name-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .access-status {
      font-size: 10px;
    }

    .access-action {
      text-align: center;
    }

    .access-button {
      margin: 0;
      padding: 12px 16px;

      border: 1px solid #000;
      border-radius: 0;
      background: none;
      color: #000;

      font-family: inherit;

      cursor: pointer;
    }

    .access-button:hover {
      background: #000;
      color: #f3f0e8;
    }

    /* same height as the button (same padding, invisible
       border), so nothing jumps after the click */
    .access-message {
      margin: 0;
      padding: 12px 0;

      border: 1px solid transparent;
    }

    /* ==================================================
       CONTACT
    ================================================== */

    .contact-intro {
      margin: 0 0 28px;

      text-align: center;
    }

    /* contacts one under another, in the middle */
    .contact-list {
      margin: 0;
      padding: 0;

      list-style: none;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 12px;
    }

    /* (label) value */
    .contact-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;

      gap: 12px;

      text-align: center;
    }

    .contact-value {
      overflow-wrap: anywhere;
    }

    .contact-empty {
      margin: 0;

      text-align: center;
    }


    /* gets the focus after the click only to keep the
       keyboard in place; no ring needed on plain text */
    .access-message:focus {
      outline: none;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .lang-hint {
        top: 60px;
        right: 16px;

        max-width: calc(100vw - 32px);

        font-size: 10px;
      }

      /*
        Phone browsers (Safari) move their address bar and
        tool bar while the page is scrolled, and the visible
        height changes. The scene must not follow that, so it
        is as tall as the LARGEST visible height (bars folded
        away): 100lvh. 100vh is the fallback for old browsers
        (in Safari it means the same). The scene is then
        always big enough, never cut off above the bottom edge,
        and its size does not change while scrolling.
      */
      .asset-system {
        height: 1027vh;
        height: 1027lvh;
      }

      .sticky-stage {
        height: 100vh;
        height: 100lvh;
      }

      .project-label,
      .platforms-label {
        font-size: 26px;
      }

      .platforms-row {
        top: calc(50% + 62px);
        width: 78vw;
      }

      .platform-item {
        width: 52px;
        gap: 12px;
      }

      .platform-icon {
        width: 52px;
        height: 52px;
      }

      .platform-name {
        font-size: 10px;
      }

      .asset-card {
        width: min(210px, 53vw);
      }

      .asset-label {
        bottom: calc(100% + 20px);
        font-size: 26px;
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 26px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
        top: 59%;
      }

      .representation-visual {
        height: 48svh;
      }

      .representation-image {
        width: 70%;
        height: 70%;
      }

      .representation-info {
        margin-top: 12px;
        font-size: 10px;
      }

      .page-section {
        padding: 52px 16px;
      }

      .section-title {
        margin-bottom: 20px;
        font-size: 26px;
      }

      .section-small {
        font-size: 10px;
      }

      .video-section {
        padding-left: 0;
        padding-right: 0;
      }

      .video-section .section-title,

  /*
    trackInterest("SKETCHUP") is called once per platform
    when someone presses REQUEST ACCESS. Nothing is
    downloaded and nothing is stored here. It:
      1) sends the page event "cut2:interest" with the
         platform, so any script can listen to it;
      2) if a visitor counter is already on the page
         (GoatCounter, Plausible or Yandex Metrika), also
         tells it, as a goal named goalPrefix + platform in
         small letters: interest-autocad, interest-sketchup,
         interest-indesign. If there is no counter, nothing
         happens and nothing breaks.
    metrikaCounterId: the number of the Yandex Metrika counter
    (the counter code itself is in <head>, and it works only
    on the real addresses, see METRIKA_HOSTS). Each click is
    sent as the goal "interest-" + platform in small letters:
    interest-autocad, interest-sketchup, interest-indesign.
    Empty = Metrika is not used.
  */

  const INTEREST_SETTINGS = {
    goalPrefix: "interest-",
    metrikaCounterId: 113483624
  };

  function trackInterest(platform) {

    const goal =
      INTEREST_SETTINGS.goalPrefix + platform.toLowerCase();

    window.dispatchEvent(
      new CustomEvent("cut2:interest", { detail: { platform } })
    );

    try {

      if (window.goatcounter && typeof window.goatcounter.count === "function") {
        window.goatcounter.count({ path: goal, title: goal, event: true });
      }

      if (typeof window.plausible === "function") {
        window.plausible(goal);
      }

      if (typeof window.ym === "function" && INTEREST_SETTINGS.metrikaCounterId) {
        window.ym(INTEREST_SETTINGS.metrikaCounterId, "reachGoal", goal);
      }

    }

    catch (error) {
      console.warn("trackInterest: counter error", error);
    }

  }

  const ZONE_OVERLAP_PX = 0.3;

  const INTRO_WIDTH_AT = (cell, t) => {

    if (cell.show === "stay") {
      return 1;
    }

    const k =
      smoothstep(
        clamp(
          (t - cell.start) / cell.duration,
          0,
          1

    return cell.show === "in" ? k : 1 - k;

    Hidden zone of a parent letter, font units.

    edge "right": hides everything left of the parent's
                  right edge (for a letter on its right)
  */

    if (CLIP_MODE === "rect") {
      return { d: null, deep: edge === "left" ? 0 : 600 };
    }

    const glyph = glyphOf(char);

    return {
      d: closePockets ? glyph.closed : glyph.outer,
      deep: glyph.deep[edge]

    if (edge === "left") {

    erase the parent's zone, look for leftovers; binary
    search on the depth. 1 pixel = 2 font units here.

      return 0;

        rect.setAttribute("height", "8000");
