<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #f3f0e8;
      color: #000;

      font-family:
        "IBM Plex Mono",
        "Courier New",
        monospace;
    }

    body {
      overflow-x: hidden;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #000;
      background: #f3f0e8;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
      font-weight: 400;
    }

    .header-title {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       MAIN SYSTEM
    ================================================== */

    .asset-system {
      position: relative;
      height: 839vh;
    }

    .sticky-stage {
      position: sticky;

      top: 0;

      width: 100%;
      height: 100vh;

      overflow: hidden;
    }


    /* ==================================================
       UPPER SYSTEM
    ================================================== */

    .project-label,
    .platforms-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;

      z-index: 8;
    }

    .platforms-label {
      opacity: 0;
    }


    /* ==================================================
       CUT2 → ONE PROJECT (cell division)
    ================================================== */

    .visually-hidden {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* Keeps the label box exactly the size of "ONE PROJECT" */
    .project-sizer {
      visibility: hidden;
    }

    /* Zero-size marker: its top is the text baseline */
    .project-baseline {
      display: inline-block;

      width: 0;
      height: 0;
    }

    /* Letters drawn as SVG paths (with masks) */
    .project-svg {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      overflow: visible;
    }


    /* ==================================================
       PLATFORM ROW
    ================================================== */

    .platforms-row {
      position: absolute;

      left: 50%;
      top: calc(50% + clamp(90px, 7vw, 120px));

      width: min(560px, 80vw);

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      transform:
        translate(-50%, -50%);

      opacity: 1;

      z-index: 8;
    }

    .platform-item {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;

      width: 72px;
    }

    .platform-icon {
      width: 72px;
      height: 72px;

      object-fit: contain;

      opacity: 0;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .platform-name {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;

      white-space: nowrap;

      opacity: 0;
    }


    /* ==================================================
       UPPER ARROWS
    ================================================== */

    .upper-arrow {
      position: absolute;

      left: 50%;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 7;

      transform: translateX(-50%);
    }

    .upper-arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .upper-arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .upper-arrow-head::before,
    .upper-arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .upper-arrow-head::before {
      transform: rotate(225deg);
    }

    .upper-arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       ONE ASSET
    ================================================== */

    .asset-card {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(252px, 49vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      z-index: 5;
    }

    .asset-label {
      position: absolute;

      left: 50%;
      bottom: calc(100% + 28px);

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }


    /* ==================================================
       LOWER ARROW
    ================================================== */

    .arrow-system {
      position: absolute;

      left: 50%;
      top: 0;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 4;

      transform: translateX(-50%);
    }

    .arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .arrow-head::before,
    .arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .arrow-head::before {
      transform: rotate(225deg);
    }

    .arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       MULTIPLE REPRESENTATIONS
    ================================================== */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;

      z-index: 3;
    }


    /* ==================================================
       REPRESENTATIONS
    ================================================== */

    .representation {
      position: absolute;

      left: 50%;
      top: 58%;

      width: min(620px, 76vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      pointer-events: none;

      z-index: 2;
    }

    .representation-visual {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .representation-image {
      display: block;

      width: 70%;
      height: 70%;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       TOOLS
    ================================================== */

    .tools-label {
      position: absolute;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      visibility: hidden;

      z-index: 4;
    }

    .tools-cloud {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 3;
    }

    /* one label of the cloud: plain text, real button */
    .tool-label {
      position: absolute;

      left: 0;
      top: 0;

      margin: 0;
      padding: 2px 4px;

      border: 0;
      background: none;
      color: inherit;

      font-family: inherit;
      font-weight: 400;
      line-height: 1.2;
      text-transform: uppercase;
      white-space: nowrap;

      /* size and letter spacing are copied from
         .representation-info by the script */

      cursor: pointer;
      pointer-events: auto;

      transform-origin: center center;

      visibility: hidden;
    }

    .tool-label:focus {
      outline: none;
    }

    .tool-label:focus-visible {
      outline: 1px solid #000;
      outline-offset: 3px;
    }

    /* small window with the tool description */
    .tool-popup {
      position: fixed;

      left: 0;
      top: 0;

      width: 320px;
      max-width: calc(100vw - 32px);

      /* never taller than the screen under the header
         (64px header + 16px edge above and below);
         a longer text scrolls inside the window */
      max-height: calc(100vh - 96px);
      overflow-y: auto;
      overscroll-behavior: contain;

      padding: 16px;

      border: 1px solid #000;
      background: #f3f0e8;
      color: #000;

      font-size: 12px;
      line-height: 1.5;

      z-index: 150;
    }

    .tool-popup[hidden] {
      display: none;
    }

    .tool-popup:not([hidden]) {
      display: flex;
      align-items: flex-start;

      gap: 12px;
    }

    .tool-popup-icon {
      flex: none;

      width: 24px;
      height: 24px;

      object-fit: contain;
    }

    .tool-popup-text {
      margin: 0;
    }

    /* phone: panel at the bottom, full width */
    .tool-popup.is-sheet {
      left: 0;
      right: 0;
      top: auto;
      bottom: 0;

      width: auto;
      max-width: none;

      /* at most 45 % of the screen height, the rest
         scrolls inside the panel (not the page) */
      max-height: 45vh;
      max-height: 45svh;

      border-width: 1px 0 0;
    }

    @media (max-width: 700px) {

      .tools-label {
        font-size: 26px;
      }

    }


    /* ==================================================
       SECTIONS AFTER THE SCENE (normal scrolling)
    ================================================== */

    /* line on top, side space as in the header,
       space above and below = header height */
    .page-section {
      border-top: 1px solid #000;

      padding: 64px 28px;
    }

    /* the same size as TOOLS and the other big words */
    .section-title {
      margin: 0 0 28px;

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;
      line-height: 1.2;

      text-transform: uppercase;
    }

    /* small caption text, as under the representations */
    .section-small {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .text-link {
      color: inherit;

      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    /* link without an address yet: dashed, goes nowhere */
    .text-link[aria-disabled="true"] {
      text-decoration-style: dashed;

      cursor: default;
    }

    .page-section a:focus,
    .page-section button:focus,
    .page-section video:focus {
      outline: none;
    }

    .page-section a:focus-visible,
    .page-section button:focus-visible,
    .page-section video:focus-visible {
      outline: 1px solid #000;
      outline-offset: 3px;
    }

    /* when Tab scrolls to an item, it stops below the
       header (64px + 24px gap), not under it */
    .page-section a,
    .page-section button,
    .page-section video {
      scroll-margin-top: 88px;
    }


    /* ==================================================
       VIDEO
    ================================================== */

    /* the video goes edge to edge, only the texts keep
       the side space */
    .video-section {
      padding-left: 0;
      padding-right: 0;
    }

    .video-section .section-title,
    .video-info {
      padding: 0 28px;
    }

    /* never taller than the screen under the header, so the
       whole video and its controls fit; on short screens the
       16:9 picture gets black side bars */
    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: calc(100vh - 64px);

      background: #000;
    }

    .video-frame video {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;
      background: #000;

      scroll-margin-top: 64px;
    }

    /* black box while there is no video file yet */
    .video-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #f3f0e8;
    }

    .video-info {
      margin-top: 18px;

      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;

      gap: 12px;
    }


    /* ==================================================
       ACCESS
    ================================================== */

    .access-list {
      margin: 0;
      padding: 0;

      list-style: none;

      border-bottom: 1px solid #000;
    }

    /* icon · name · status ……… button */
    .access-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 12px;

      padding: 18px 0;

      border-top: 1px solid #000;
    }

    .access-icon {
      flex: none;

      width: 24px;
      height: 24px;

      object-fit: contain;
    }

    .access-name-block {
      display: flex;
      align-items: baseline;

      gap: 28px;
    }

    .access-status {
      font-size: 10px;
    }

    .access-action {
      margin-left: auto;

      text-align: right;
    }

    .access-button {
      margin: 0;
      padding: 12px 16px;

      border: 1px solid #000;
      border-radius: 0;
      background: none;
      color: #000;

      font-family: inherit;

      cursor: pointer;
    }

    .access-button:hover {
      background: #000;
      color: #f3f0e8;
    }

    /* same height as the button (same padding, invisible
       border), so the row does not jump after the click */
    .access-message {
      margin: 0;
      padding: 12px 0;

      border: 1px solid transparent;
    }

    /* ==================================================
       CONTACT
    ================================================== */

    .contact-intro {
      margin: 0 0 28px;
    }

    .contact-list {
      margin: 0;
      padding: 0;

      list-style: none;

      border-bottom: 1px solid #000;
    }

    /* label ……… value */
    .contact-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;

      gap: 12px;

      padding: 18px 0;

      border-top: 1px solid #000;
    }

    .contact-value {
      overflow-wrap: anywhere;
    }

    .contact-empty {
      margin: 0;
    }


    /* gets the focus after the click only to keep the
       keyboard in place; no ring needed on plain text */
    .access-message:focus {
      outline: none;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 10px;
      }

      .asset-system {
        height: 839vh;
      }

      .sticky-stage {
        height: 100svh;
      }

      .project-label,
      .platforms-label {
        font-size: 26px;
      }

      .platforms-row {
        top: calc(50% + 62px);
        width: 78vw;
      }

      .platform-item {
        width: 52px;
        gap: 12px;
      }

      .platform-icon {
        width: 52px;
        height: 52px;
      }

      .platform-name {
        font-size: 10px;
      }

      .asset-card {
        width: min(210px, 53vw);
      }

      .asset-label {
        bottom: calc(100% + 20px);
        font-size: 26px;
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 26px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
        top: 59%;
      }

      .representation-visual {
        height: 48svh;
      }

      .representation-image {
        width: 70%;
        height: 70%;
      }

      .representation-info {
        margin-top: 12px;
        font-size: 10px;
      }

      .page-section {
        padding: 52px 16px;
      }

      .section-title {
        margin-bottom: 20px;
        font-size: 26px;
      }

      .section-small {
        font-size: 10px;
      }

      .video-section {
        padding-left: 0;
        padding-right: 0;
      }

      .video-section .section-title,
      .video-info {
        padding: 0 16px;
      }

      .video-info {
        margin-top: 12px;
      }

      .video-frame {
        max-height: calc(100svh - 52px);
      }

      /* name with the status under it */
      .access-name-block {
        flex-direction: column;

        gap: 0;
      }

      .access-button {
        padding: 8px 12px;
      }

      .access-message {
        padding: 8px 0;
      }

      .contact-intro {
        margin-bottom: 20px;
      }

      /* after the click: the message gets its own line
         under the name (24px icon + 12px gap in front) */
      .access-action.is-done {
        flex-basis: 100%;

        padding-left: 36px;

        text-align: left;
      }

      .video-frame video {
        scroll-margin-top: 52px;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="logo">
    CUT2
  </div>

  <div class="header-title">
    Asset Representations
  </div>

</header>


<main>


  <!-- ==================================================
       ASSET SYSTEM
  ================================================== -->

  <section class="asset-system">

    <div class="sticky-stage">


      <!-- ==================================================
           ONE PROJECT
      ================================================== -->

      <div
        class="project-label"
        id="projectLabel"
      >
        <span class="visually-hidden">CUT2 / ONE PROJECT</span><span
          class="project-sizer"
          id="projectSizer"
          aria-hidden="true"
        >ONE PROJECT<span
          class="project-baseline"
          id="projectBaseline"
        ></span></span><svg
          class="project-svg"
          id="projectSvg"
          aria-hidden="true"
          focusable="false"
        ></svg>
      </div>


      <!-- ==================================================
           ARROW: PROJECT
      ================================================== -->

      <div
        class="upper-arrow"
        id="projectArrow"
      >

        <div class="upper-arrow-shaft"></div>

        <div class="upper-arrow-head"></div>

      </div>


      <!-- ==================================================
           MULTIPLE PLATFORMS
      ================================================== -->

      <div
        class="platforms-label"
        id="platformsLabel"
      >
        MULTIPLE PLATFORMS
      </div>


      <!-- ==================================================
           PLATFORMS
      ================================================== -->

      <div
        class="platforms-row"
        id="platformsRow"
      >

        <div class="platform-item">

          <img
            class="platform-icon"
            id="platformAutoCAD"
            src="prototypes/asset-representations/asset-representations/platforms/autocad.svg"
            alt="AutoCAD"
          >

          <div
            class="platform-name"
            id="platformAutoCADName"
          >
            AUTOCAD
          </div>

        </div>


        <div class="platform-item">

          <img
            class="platform-icon"
            id="platformSketchUp"
            src="prototypes/asset-representations/asset-representations/platforms/sketchup.svg"
            alt="SketchUp"
          >

          <div
            class="platform-name"
            id="platformSketchUpName"
          >
            SKETCHUP
          </div>

        </div>


        <div class="platform-item">

          <img
            class="platform-icon"
            id="platformInDesign"
            src="prototypes/asset-representations/asset-representations/platforms/indesign.svg"
            alt="InDesign"
          >

          <div
            class="platform-name"
            id="platformInDesignName"
          >
            INDESIGN
          </div>

        </div>

      </div>


      <!-- ==================================================
           ARROW: PLATFORMS → ASSET
      ================================================== -->

      <div
        class="upper-arrow"
        id="platformArrow"
      >

        <div class="upper-arrow-shaft"></div>

        <div class="upper-arrow-head"></div>

      </div>


      <!-- ==================================================
           ONE ASSET
      ================================================== -->

      <div
        class="asset-card"
        id="assetCard"
      >

        <div class="asset-label">
          ONE ASSET
        </div>

        <img
          src="prototypes/asset-representations/asset-representations/library-card.png?v=3"
          alt="CUT2 Asset Library"
        >

      </div>


      <!-- ==================================================
           LOWER ARROW
      ================================================== -->

      <div
        class="arrow-system"
        id="arrowSystem"
      >

        <div
          class="arrow-shaft"
          id="arrowShaft"
        ></div>

        <div class="arrow-head"></div>

      </div>


      <!-- ==================================================
           MULTIPLE REPRESENTATIONS
      ================================================== -->

      <div
        class="multiple-label"
        id="multipleLabel"
      >
        MULTIPLE REPRESENTATIONS
      </div>


      <!-- ==================================================
           REPRESENTATION
      ================================================== -->

      <div
        class="representation"
        id="representation"
      >

        <div
          class="representation-visual"
          id="representationVisual"
        >

          <img
            id="representationImage"
            class="representation-image"
            src="prototypes/asset-representations/asset-representations/autocad/minimal.svg?v=3"
            alt="AutoCAD Minimal"
          >

        </div>


        <div class="representation-info">

          <span id="representationPlatform">
            AUTOCAD
          </span>

          <span id="representationType">
            MINIMAL
          </span>

        </div>

      </div>


      <!-- ==================================================
           TOOLS
      ================================================== -->

      <div
        class="tools-label"
        id="toolsLabel"
      >
        TOOLS
      </div>

      <div
        class="tools-cloud"
        id="toolsCloud"
      ></div>


    </div>

  </section>


  <!-- tool description window (filled by the script) -->
  <div
    class="tool-popup"
    id="toolPopup"
    role="dialog"
    aria-modal="false"
    hidden
  >
    <img class="tool-popup-icon" id="toolPopupIcon" alt="">
    <p class="tool-popup-text" id="toolPopupText"></p>
  </div>


  <!-- ==================================================
       VIDEO (filled from VIDEO_SETTINGS by the script)
  ================================================== -->

  <section
    class="page-section video-section"
    aria-labelledby="videoTitle"
  >

    <h2 class="section-title" id="videoTitle">VIDEO</h2>

    <div class="video-frame" id="videoFrame"></div>

    <div class="video-info section-small">
      <span id="videoCaption"></span>
      <a class="text-link" id="videoFullLink"></a>
    </div>

  </section>


  <!-- ==================================================
       ACCESS (rows built from ACCESS_SETTINGS)
  ================================================== -->

  <section
    class="page-section"
    aria-labelledby="accessTitle"
  >

    <h2 class="section-title" id="accessTitle">ACCESS</h2>

         small letters: interest-autocad, interest-sketchup,
         interest-indesign. If there is no counter, nothing
         happens and nothing breaks.
    metrikaCounterId: the number of a Yandex Metrika counter,
    only needed for Metrika (empty = Metrika is not used).
  */

  const INTEREST_SETTINGS = {
    goalPrefix: "interest-",
    metrikaCounterId: ""
  };

  function trackInterest(platform) {

    const goal =
      INTEREST_SETTINGS.goalPrefix + platform.toLowerCase();

    window.dispatchEvent(
      new CustomEvent("cut2:interest", { detail: { platform } })
    );

    try {

      if (window.goatcounter && typeof window.goatcounter.count === "function") {
        window.goatcounter.count({ path: goal, title: goal, event: true });
      }

      if (typeof window.plausible === "function") {
        window.plausible(goal);
      }

      if (typeof window.ym === "function" && INTEREST_SETTINGS.metrikaCounterId) {
        window.ym(INTEREST_SETTINGS.metrikaCounterId, "reachGoal", goal);
      }

    }

    catch (error) {
      console.warn("trackInterest: counter error", error);
    }

  }
