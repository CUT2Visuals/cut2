<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CUT2 — Asset Representations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      background: #f3f0e8;
      color: #000;

      font-family:
        "IBM Plex Mono",
        "Courier New",
        monospace;
    }

    body {
      overflow-x: hidden;
    }


    /* ==================================================
       HEADER
    ================================================== */

    header {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 64px;

      padding: 0 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid #000;
      background: #f3f0e8;

      z-index: 100;
    }

    .logo {
      font-size: 16px;
      font-weight: 400;
    }

    .header-title {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       MAIN SYSTEM
    ================================================== */

    .asset-system {
      position: relative;
      height: 1079vh;
    }

    .sticky-stage {
      position: sticky;

      top: 0;

      width: 100%;
      height: 100vh;

      overflow: hidden;
    }


    /* ==================================================
       UPPER SYSTEM
    ================================================== */

    .project-label,
    .platforms-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;

      z-index: 8;
    }

    .platforms-label {
      opacity: 0;
    }


    /* ==================================================
       CUT2 → ONE PROJECT (cell division)
    ================================================== */

    .visually-hidden {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* Keeps the label box exactly the size of "ONE PROJECT" */
    .project-sizer {
      visibility: hidden;
    }

    /* Zero-size marker: its top is the text baseline */
    .project-baseline {
      display: inline-block;

      width: 0;
      height: 0;
    }

    /* Letters drawn as SVG paths (with masks) */
    .project-svg {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      overflow: visible;
    }


    /* ==================================================
       PLATFORM ROW
    ================================================== */

    .platforms-row {
      position: absolute;

      left: 50%;
      top: calc(50% + clamp(90px, 7vw, 120px));

      width: min(560px, 80vw);

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      transform:
        translate(-50%, -50%);

      opacity: 1;

      z-index: 8;
    }

    .platform-item {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;

      width: 72px;
    }

    .platform-icon {
      width: 72px;
      height: 72px;

      object-fit: contain;

      opacity: 0;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .platform-name {
      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;

      white-space: nowrap;

      opacity: 0;
    }


    /* ==================================================
       UPPER ARROWS
    ================================================== */

    .upper-arrow {
      position: absolute;

      left: 50%;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 7;

      transform: translateX(-50%);
    }

    .upper-arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .upper-arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .upper-arrow-head::before,
    .upper-arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .upper-arrow-head::before {
      transform: rotate(225deg);
    }

    .upper-arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       ONE ASSET
    ================================================== */

    .asset-card {
      position: absolute;

      left: 50%;
      top: 50%;

      width: min(252px, 49vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      z-index: 5;
    }

    .asset-label {
      position: absolute;

      left: 50%;
      bottom: calc(100% + 28px);

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-align: center;
      white-space: nowrap;
    }

    .asset-card img {
      display: block;

      width: 100%;
      height: auto;

      border: 1px solid #000;
    }


    /* ==================================================
       LOWER ARROW
    ================================================== */

    .arrow-system {
      position: absolute;

      left: 50%;
      top: 0;

      width: 1px;
      height: 0;

      opacity: 0;

      z-index: 4;

      transform: translateX(-50%);
    }

    .arrow-shaft {
      position: absolute;

      left: 0;
      top: 0;

      width: 1px;
      height: 100%;

      background: #000;
    }

    .arrow-head {
      position: absolute;

      left: 50%;
      bottom: 0;

      width: 16px;
      height: 10px;

      transform: translateX(-50%);
    }

    .arrow-head::before,
    .arrow-head::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 0;

      width: 10px;
      height: 1px;

      background: #000;

      transform-origin: left center;
    }

    .arrow-head::before {
      transform: rotate(225deg);
    }

    .arrow-head::after {
      transform: rotate(-45deg);
    }


    /* ==================================================
       MULTIPLE REPRESENTATIONS
    ================================================== */

    .multiple-label {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      opacity: 0;

      z-index: 3;
    }


    /* ==================================================
       REPRESENTATIONS
    ================================================== */

    .representation {
      position: absolute;

      left: 50%;
      top: 58%;

      width: min(620px, 76vw);

      transform:
        translate(-50%, -50%);

      opacity: 0;

      pointer-events: none;

      z-index: 2;
    }

    .representation-visual {
      width: 100%;
      height: min(58vh, 620px);

      display: flex;
      align-items: center;
      justify-content: center;

      transform:
        perspective(1200px)
        rotateY(-90deg)
        scale(0.92);

      transform-style: preserve-3d;
      transform-origin: center center;
    }

    .representation-image {
      display: block;

      width: 70%;
      height: 70%;

      object-fit: contain;
    }

    .representation-info {
      margin-top: 18px;

      display: flex;
      justify-content: space-between;

      font-size: 12px;
      font-weight: 400;

      text-transform: uppercase;
      letter-spacing: 0.04em;
    }


    /* ==================================================
       TOOLS
    ================================================== */

    .tools-label {
      position: absolute;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      font-size: clamp(28px, 5vw, 72px);
      font-weight: 400;

      text-transform: uppercase;
      white-space: nowrap;

      visibility: hidden;

      z-index: 4;
    }

    .tools-cloud {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 3;
    }

    /* one label of the cloud: plain text, real button */
    .tool-label {
      position: absolute;

      left: 0;
      top: 0;

      margin: 0;
      padding: 2px 4px;

      border: 0;
      background: none;
      color: inherit;

      font-family: inherit;
      font-weight: 400;
      line-height: 1.2;
      text-transform: uppercase;
      white-space: nowrap;

      /* size and letter spacing are copied from
         .representation-info by the script */

      cursor: pointer;
      pointer-events: auto;

      transform-origin: center center;

      visibility: hidden;
    }

    .tool-label:focus {
      outline: none;
    }

    .tool-label:focus-visible {
      outline: 1px solid #000;
      outline-offset: 3px;
    }

    /* small window with the tool description */
    .tool-popup {
      position: fixed;

      left: 0;
      top: 0;

      width: 320px;
      max-width: calc(100vw - 32px);

      padding: 16px;

      border: 1px solid #000;
      background: #f3f0e8;
      color: #000;

      font-size: 12px;
      line-height: 1.5;

      z-index: 150;
    }

    .tool-popup[hidden] {
      display: none;
    }

    .tool-popup:not([hidden]) {
      display: flex;
      align-items: flex-start;

      gap: 12px;
    }

    .tool-popup-icon {
      flex: none;

      width: 24px;
      height: 24px;

      object-fit: contain;
    }

    .tool-popup-text {
      margin: 0;
    }

    /* phone: panel at the bottom, full width */
    .tool-popup.is-sheet {
      left: 0;
      right: 0;
      top: auto;
      bottom: 0;

      width: auto;
      max-width: none;

      border-width: 1px 0 0;
    }

    @media (max-width: 700px) {

      .tools-label {
        font-size: 26px;
      }

      /* long names may wrap to two lines */
      .tool-label {
        max-width: 160px;

        white-space: normal;
        text-align: center;
      }

    }


    /* ==================================================
       NEXT
    ================================================== */

    .next {
      min-height: 100vh;

      border-top: 1px solid #000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-size: clamp(24px, 4vw, 56px);
      font-weight: 400;

      text-align: center;
    }


    /* ==================================================
       MOBILE
    ================================================== */

    @media (max-width: 700px) {

      header {
        height: 52px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 10px;
      }

      .asset-system {
        height: 1079vh;
      }

      .sticky-stage {
        height: 100svh;
      }

      .project-label,
      .platforms-label {
        font-size: 26px;
      }

      .platforms-row {
        top: calc(50% + 62px);
        width: 78vw;
      }

      .platform-item {
        width: 52px;
        gap: 12px;
      }

      .platform-icon {
        width: 52px;
        height: 52px;
      }

      .platform-name {
        font-size: 10px;
      }

      .asset-card {
        width: min(210px, 53vw);
      }

      .asset-label {
        bottom: calc(100% + 20px);
        font-size: 26px;
      }

      .multiple-label {
        width: 90vw;

        white-space: normal;

        text-align: center;

        font-size: 26px;
        line-height: 1.2;
      }

      .representation {
        width: 86vw;
        top: 59%;
      }

      .representation-visual {
        height: 48svh;
      }

      .representation-image {
        width: 70%;
        height: 70%;
      }

      .representation-info {
        margin-top: 12px;
        font-size: 10px;
      }

      .next {
        min-height: 100svh;
        font-size: 26px;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="logo">
    CUT2
  </div>

  <div class="header-title">
    Asset Representations
  </div>

</header>


<main>


  <!-- ==================================================
       ASSET SYSTEM
  ================================================== -->

  <section class="asset-system">

    <div class="sticky-stage">


      <!-- ==================================================
           ONE PROJECT
      ================================================== -->

      <div
        class="project-label"
        id="projectLabel"
      >
        <span class="visually-hidden">CUT2 / ONE PROJECT</span><span
          class="project-sizer"
          id="projectSizer"
          aria-hidden="true"
        >ONE PROJECT<span
          class="project-baseline"
          id="projectBaseline"
        ></span></span><svg
          class="project-svg"
          id="projectSvg"
          aria-hidden="true"
          focusable="false"
        ></svg>
      </div>


      <!-- ==================================================
           ARROW: PROJECT
      ================================================== -->

      <div
        class="upper-arrow"
        id="projectArrow"
      >

        <div class="upper-arrow-shaft"></div>

        <div class="upper-arrow-head"></div>

      </div>


      <!-- ==================================================
           MULTIPLE PLATFORMS
      ================================================== -->

      <div
        class="platforms-label"
        id="platformsLabel"
      >
        MULTIPLE PLATFORMS
      </div>


      <!-- ==================================================
           PLATFORMS
      ================================================== -->

      <div
        class="platforms-row"
        id="platformsRow"
      >

        <div class="platform-item">

          <img
            class="platform-icon"
            id="platformAutoCAD"
            src="prototypes/asset-representations/asset-representations/platforms/autocad.svg"
            alt="AutoCAD"
          >

          <div
            class="platform-name"
            id="platformAutoCADName"
          >
            AUTOCAD
          </div>

        </div>


        <div class="platform-item">

          <img
            class="platform-icon"
            id="platformSketchUp"
            src="prototypes/asset-representations/asset-representations/platforms/sketchup.svg"
            alt="SketchUp"
          >

          <div
            class="platform-name"
            id="platformSketchUpName"
          >
            SKETCHUP
          </div>

        </div>


        <div class="platform-item">

          <img
            class="platform-icon"
            id="platformInDesign"
            src="prototypes/asset-representations/asset-representations/platforms/indesign.svg"
            alt="InDesign"
          >

          <div
            class="platform-name"
            id="platformInDesignName"
          >
            INDESIGN
          </div>

        </div>

      </div>


      <!-- ==================================================
           ARROW: PLATFORMS → ASSET
      ================================================== -->

      <div
        class="upper-arrow"
        id="platformArrow"
      >

        <div class="upper-arrow-shaft"></div>

        <div class="upper-arrow-head"></div>

      </div>


      <!-- ==================================================
           ONE ASSET
      ================================================== -->

      <div
        class="asset-card"
        id="assetCard"
      >

        <div class="asset-label">
          ONE ASSET
        </div>

        <img
          src="prototypes/asset-representations/asset-representations/library-card.png?v=3"
          alt="CUT2 Asset Library"
        >

      </div>


      <!-- ==================================================
           LOWER ARROW
      ================================================== -->

      <div
        class="arrow-system"
        id="arrowSystem"
      >

        <div
          class="arrow-shaft"
          id="arrowShaft"
        ></div>

        <div class="arrow-head"></div>

      </div>


      <!-- ==================================================
           MULTIPLE REPRESENTATIONS
      ================================================== -->

      <div
        class="multiple-label"
        id="multipleLabel"
      >
        MULTIPLE REPRESENTATIONS
      </div>


      <!-- ==================================================
           REPRESENTATION
      ================================================== -->

      <div
        class="representation"
        id="representation"
      >

        <div
          class="representation-visual"
          id="representationVisual"
        >

          <img
            id="representationImage"
            class="representation-image"
            src="prototypes/asset-representations/asset-representations/autocad/minimal.svg?v=3"
            alt="AutoCAD Minimal"
          >

        </div>


        <div class="representation-info">

          <span id="representationPlatform">
            AUTOCAD
          </span>

          <span id="representationType">
            MINIMAL
          </span>

        </div>

      </div>


      <!-- ==================================================
           TOOLS
      ================================================== -->

      <div
        class="tools-label"
        id="toolsLabel"
      >
        TOOLS
      </div>

      <div
        class="tools-cloud"
        id="toolsCloud"
      ></div>


    </div>

  </section>


  <!-- tool description window (filled by the script) -->
  <div
    class="tool-popup"
    id="toolPopup"
    role="dialog"
    aria-modal="false"
    hidden
  >
    <img class="tool-popup-icon" id="toolPopupIcon" alt="">
    <p class="tool-popup-text" id="toolPopupText"></p>
  </div>


  <!-- ==================================================
       NEXT
  ================================================== -->

  <section class="next">

    THE SYSTEM CONTINUES.

  </section>


</main>



<script>

  /* ==================================================
     SETTINGS: CUT2 → ONE PROJECT
     (safe to tweak)
  ================================================== */

  /*
    Length of the CUT2 → ONE PROJECT part of the scroll,
    in "old timeline" units: 0.1 = 0.6 screen heights
    of scrolling, 0.125 = 0.75, 0.15 = 0.9.
    If you change it, also change the height of
    .asset-system in CSS (two places):
      742vh + 600vh × INTRO_LENGTH
    (0.125 → 817vh).
  */

  const INTRO_LENGTH = 0.125;


  /*
    How a hidden letter is cut off:
      "silhouette" – by the real outer shape of the
                     letter it hides under (round side of
                     O and C, holes stay clean);
      "rect"       – by the straight edge of the letter
                     cell (the previous version).
  */

  const CLIP_MODE = "silhouette";


  /*
    Letter cells, strictly in the order of the line,
    left to right: O N E _ P R O J E C U T 2.

    char      the letter (" " is the gap between words)
    parent    who the letter comes out of / hides under
              (just a note for you; the real neighbour
              is decided by "dir")
    show      "in"   – appears
              "out"  – disappears (U and 2)
              "stay" – visible all the time (C and T)
    dir       "left" / "right" – where the letter moves:
              for "in" it slides out of the neighbour on
              the opposite side, for "out" it hides under
              the neighbour on that side.
    start     when it starts, 0…1 of the CUT2 → ONE PROJECT
              part (this is what makes the order "random")
    duration  how long it moves, 0…1 of the same part
              (start + duration must be ≤ 1)
    closePockets
              only for "silhouette": true – open places on
              the parent's side (mouth of C, under the bar
              of T, under the bowl of P, between bowl and
              leg of R) are closed with straight lines, the
              letter is hidden there too; false – the cut
              follows the shape exactly, the letter shows
              in those places.

    Rule of thumb: a letter should start only after its
    parent has fully come out (parent start + duration).
  */

  const INTRO_CELLS = [
    { char: "O", parent: "P", show: "in",   dir: "left",  start: 0.31, duration: 0.25, closePockets: true },
    { char: "N", parent: "O", show: "in",   dir: "right", start: 0.60, duration: 0.25, closePockets: true },
    { char: "E", parent: "P", show: "in",   dir: "left",  start: 0.56, duration: 0.25, closePockets: true },
    { char: " ", parent: "E/P", show: "in", dir: "left",  start: 0.75, duration: 0.25, closePockets: true },
    { char: "P", parent: "C", show: "in",   dir: "left",  start: 0.02, duration: 0.25, closePockets: true },
    { char: "R", parent: "P", show: "in",   dir: "right", start: 0.42, duration: 0.25, closePockets: true },
    { char: "O", parent: "R", show: "in",   dir: "right", start: 0.70, duration: 0.25, closePockets: true },
    { char: "J", parent: "E", show: "in",   dir: "left",  start: 0.50, duration: 0.25, closePockets: true },
    { char: "E", parent: "C", show: "in",   dir: "left",  start: 0.20, duration: 0.25, closePockets: true },
    { char: "C", parent: "",  show: "stay", dir: "",      start: 0,    duration: 1,    closePockets: true },
    { char: "U", parent: "C", show: "out",  dir: "left",  start: 0.00, duration: 0.25, closePockets: true },
    { char: "T", parent: "",  show: "stay", dir: "",      start: 0,    duration: 1,    closePockets: true },
    { char: "2", parent: "T", show: "out",  dir: "left",  start: 0.12, duration: 0.25, closePockets: true }
  ];


  /* ==================================================
     SETTINGS: TOOLS
     (safe to tweak)
  ================================================== */

  /*
    The tools in the cloud.

    platform     "AUTOCAD" / "SKETCHUP" / "INDESIGN"
                 (chooses the icon in the window)
    label        name in the cloud (shown in capitals)
    description  text in the window
    Later a second language can be added next to these
    fields (for an EN / RU switch).
  */

  const TOOLS = [
    { platform: "AUTOCAD",  label: "Source Data Cleanup",                               description: "Removes unnecessary data from the source file and leaves a clean foundation for the project." },
    { platform: "AUTOCAD",  label: "Automated Constraints Diagram",                     description: "Brings site constraints into a single diagram, so the project starts within the actual limits of the site." },
    { platform: "AUTOCAD",  label: "Semi-Automated Fire Access Generation (SP / STU)",  description: "Generates fire access routes based on specified regulatory conditions, reducing repetitive trial and error." },
    { platform: "AUTOCAD",  label: "Schedules",                                         description: "Turns project geometry into ready-to-use schedules — without manual counting or data re-entry." },
    { platform: "AUTOCAD",  label: "SketchUp Export",                                   description: "Transfers the prepared AutoCAD file to SketchUp without repeated manual preparation." },
    { platform: "AUTOCAD",  label: "Automatic Tagging",                                 description: "Automatically tags project elements while keeping the labels linked to their objects." },
    { platform: "AUTOCAD",  label: "Paving Generator Feedback from SketchUp",           description: "Changes made to paving in SketchUp flow back into AutoCAD, turning two tools into one connected system." },
    { platform: "AUTOCAD",  label: "Planting Mix Generator Feedback from SketchUp",     description: "Change planting mixes in SketchUp — the data automatically flows back into the working documentation." },
    { platform: "AUTOCAD",  label: "Pavement Assembly Generator",                       description: "The tag becomes a control interface: change a layer thickness in the text, and the construction redraws itself automatically." },
    { platform: "SKETCHUP", label: "Sunlight Analysis — Sun Hours",                     description: "Shows how much sunlight a space receives throughout the year." },
    { platform: "SKETCHUP", label: "Sunlight Analysis — Shadow Envelope",               description: "Builds a spatial shadow envelope to quickly reveal how shadows affect the site." },
    { platform: "SKETCHUP", label: "Lighting Diagram",                                  description: "Turns complex lighting calculations into a clear spatial diagram." },
    { platform: "SKETCHUP", label: "2D → 3D",                                           description: "Turns flat project information into a working three-dimensional model." },
    { platform: "SKETCHUP", label: "Terrain Generator",                                 description: "Creates terrain from defined parameters — from a simple mound to complex spatial geometry." },
    { platform: "SKETCHUP", label: "Paving & Pattern Generator",                        description: "Generates paving from rules rather than manual placement — change parameters instead of hundreds of individual elements." },

    if (cell.show === "stay") {

          1

                  right edge (for a letter on its right)

    if (CLIP_MODE === "rect") {

    return {
      d: closePockets ? glyph.closed : glyph.outer,
      deep: glyph.deep[edge]

    CUT2 → ONE PROJECT: place the letters.
    introProgress: 0 = "CUT2", 1 = "ONE PROJECT".
    Cells stand side by side, the whole line stays
    centered in the label. Widths are in characters
    (monospace), 1 character = sizer width / 11.
    Each letter is pinned to the cell side away from
    its parent; masks follow the letters they belong to
    (zones are in font units, hence the scale).
  */

  function updateIntroCells(introProgress) {

    /* letters are built when the font is ready */
    if (!introLetters.length) {
      return;
    }

    const charWidth =
      projectSizer.offsetWidth / 11;

    const scale =
      charWidth / 600;

    const baseline =
      projectBaseline.getBoundingClientRect().top -
      projectLabel.getBoundingClientRect().top;

    const widths =
      INTRO_CELLS.map(
        (cell) => INTRO_WIDTH_AT(cell, introProgress)
      );

    const lineWidth =
      widths.reduce((sum, w) => sum + w, 0);

    /* letter x (in characters) for every cell */
    const glyphX = [];

    let x =
      (11 - lineWidth) / 2;

    INTRO_CELLS.forEach(
      (cell, index) => {

        const w = widths[index];
        const letter = introLetters[index];
        const offset = letter ? letter.offset * (1 - w) : 0;

        if (cell.show === "stay") {
          glyphX[index] = x;
        }
        else if (parentSideOf(cell) === "right") {
          /* pinned left, starts deeper to the right */
          glyphX[index] = x + offset;
        }
        else {
          /* pinned right, starts deeper to the left */
          glyphX[index] = x + w - 1 - offset;
        }

        x += w;

      }
    );

    const placeOf = (index) =>
      `translate(${glyphX[index] * charWidth} ${baseline}) ` +
      `scale(${scale} ${-scale})`;

    introLetters.forEach(
      (letter) => {

        if (!letter) {
          return;
        }

        const w = widths[letter.index];

        letter.text.setAttribute("x", String(glyphX[letter.index] * charWidth));
        letter.text.setAttribute("y", String(baseline));

        /* not out yet (or fully hidden): not drawn at all */
        letter.group.style.display =
          w > 0 ? "" : "none";

        /* fully out: nothing hides it any more */
        letter.users.forEach(
          ({ k, use }) => {

            use.setAttribute("transform", placeOf(k));
            use.style.display =
              w < 1 && widths[k] > 0 ? "" : "none";

          }
        );

      }
    );

  }


  /* ==================================================
     ANIMATION
  ================================================== */

  function updateAnimation() {

    const section =
      document.querySelector(".asset-system");

    const stage =
      document.querySelector(".sticky-stage");

    const header =
      document.querySelector("header");


    const sectionRect =
      section.getBoundingClientRect();

    const stageRect =
      stage.getBoundingClientRect();

    const headerRect =
      header.getBoundingClientRect();


    const scrollable =
      section.offsetHeight -
      window.innerHeight;

    const passed =
      clamp(
        -sectionRect.top,
        0,
        scrollable
      );

    /*
      Scroll is split into:
      1) CUT2 → ONE PROJECT (INTRO_LENGTH),
      2) the old timeline, with a pause on
         ONE ASSET: pauseLength holds the timeline
         at pauseAt.
      3) TOOLS (TOOLS_PHASES, in screen heights;
         1 screen height = 1/6 of the old timeline).
      Section height: 700vh + 600vh × (INTRO_LENGTH
      + pauseLength) + 100vh × TOOLS total = 1079vh.
      Every old block keeps its length in pixels.
    */

    const pauseAt = 0.53;
    const pauseLength = 0.07;

    const toolsLength =
      TOOLS_PHASES.reduce((sum, h) => sum + h, 0) / 6;

    const rawTimeline =
      passed / scrollable *
      (1 + INTRO_LENGTH + pauseLength + toolsLength);

    /* time inside the TOOLS part (old timeline units) */
    const toolsTime =
      Math.max(
        0,
        rawTimeline - INTRO_LENGTH - 1 - pauseLength
      );

    /* step 1 of TOOLS: representations leave upwards */
    const toolsLeave =
      smoothstep(
        clamp(toolsTime / (TOOLS_PHASES[0] / 6), 0, 1)
      );

    const introProgress =
      clamp(
        rawTimeline / INTRO_LENGTH,
        0,
        1
      );

    updateIntroCells(introProgress);

    const timeline =
      Math.max(
        0,
        rawTimeline - INTRO_LENGTH
      );

    const progress =
      Math.min(
        1,
        timeline < pauseAt
          ? timeline
          : Math.max(
              pauseAt,
              timeline - pauseLength
            )
      );


    const centerY =
      window.innerHeight / 2;

    const headerGap =
      24;

    const headerBottom =
      headerRect.bottom -
      stageRect.top;


    /*
      Arrow gaps (platform group → ONE ASSET).

      Gap under the platform group,
      reduced by 2/3 from 42px / 28px:
        desktop: 14px
        mobile: 9px
    */

    const platformArrowGap =
      window.innerWidth <= 700
        ? 9
        : 14;


    /*
      Keep the arrowhead above ONE ASSET.
      This prevents the arrow from touching
      or crossing the label.
    */

    const platformArrowEndGap =
      window.innerWidth <= 700
        ? 16
        : 24;


    const platformArrowMinLength =
      window.innerWidth <= 700
        ? 28
        : 40;


    /*
      Platform group movement (used by ONE PROJECT,
      its arrow and the platform group).
      Final position: the bottom of the icon row
      (with names) is platformArrowGap above the
      bottom of the header, so the row and the tail
      of the arrow are hidden behind the header.
    */

    const groupMoveStart = 0.32;
    const groupMoveEnd = 0.46;

    const groupMoveProgress =
      clamp(
        (progress - groupMoveStart) /
        (groupMoveEnd - groupMoveStart),
        0,
        1
      );


    /*
      ONE PROJECT arrow gaps.
      If there is not enough room between ONE PROJECT
      (under the header) and MULTIPLE PLATFORMS for
      projectArrowMinLength, the whole platform group
      stands lower by exactly the missing amount
      (short screens only).
    */

    const projectArrowGap =
      window.innerWidth <= 700
        ? 10
        : 12;

    const projectArrowMinLength =
      window.innerWidth <= 700
        ? 28
        : 40;

    const platformsLabelBaseTop =
      platformsLabel.offsetTop -
      platformsLabel.offsetHeight * 1.5;

    const groupBaseShift =
      Math.max(
        0,
        headerBottom +
        headerGap +
        projectLabel.offsetHeight +
        projectArrowGap +
        projectArrowMinLength +
        platformArrowEndGap -
        platformsLabelBaseTop
      );


    const rowBottomBase =
      platformsRow.offsetTop +
      platformsRow.offsetHeight / 2 +
      groupBaseShift;

    const groupUpY =
      headerBottom -
      platformArrowGap -
      rowBottomBase;

    const groupY =
      groupUpY *
      groupMoveProgress;


    /* ==================================================
       1. ONE PROJECT
       CENTER → UNDER HEADER
    ================================================== */

    const projectMoveStart = 0;
    const projectMoveEnd = 0.12;

    const projectMoveProgress =
      clamp(
        (progress - projectMoveStart) /
        (projectMoveEnd - projectMoveStart),
        0,
        1
      );


    const projectHeight =
      projectLabel.offsetHeight;

    /*
      Stops under the header (not above it).
      Later leaves together with the platform group.
    */

    const projectUpY =
      headerBottom +
      headerGap +
      projectHeight / 2 -
      projectLabel.offsetTop;


    const projectY =
      projectUpY *
      projectMoveProgress;


    projectLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${projectY + groupY}px)
        )
      `;


    /* ==================================================
       2. ARROW ATTACHED TO ONE PROJECT
       PROJECT → MULTIPLE PLATFORMS
    ================================================== */

    /*
      At progress 0 only the arrowhead is visible
      under ONE PROJECT. From the first scroll the
      tail stays under ONE PROJECT and the head
      moves evenly to MULTIPLE PLATFORMS, so the
      shaft grows from 0 without a jump.
      Positions are taken from layout (offsetTop),
      without the platform group shift.
    */

    const projectArrowTail =
      projectLabel.offsetTop +
      projectHeight / 2 +
      projectArrowGap;

    const projectArrowTailY =
      projectArrowTail +
      projectY;


    const platformsLabelTop =
      platformsLabelBaseTop +
      groupBaseShift;

    const projectArrowHeadY =
      lerp(
        projectArrowTail,
        platformsLabelTop -
        platformArrowEndGap,
        projectMoveProgress
      );


    const projectArrowLength =
      Math.max(
        0,
        projectArrowHeadY -
        projectArrowTailY
      );


    projectArrow.style.top =
      `${projectArrowTailY + groupY}px`;

    projectArrow.style.height =
      `${projectArrowLength}px`;

    projectArrow.style.opacity =
      progress < groupMoveEnd
        ? 1
        : 0;


    /* ==================================================
       3. MULTIPLE PLATFORMS
       CENTER → UNDER HEADER
    ================================================== */

    const platformsAppearStart = 0.15;
    const platformsAppearEnd = 0.19;

    const platformsOpacity =
      clamp(
        (progress - platformsAppearStart) /
        (platformsAppearEnd - platformsAppearStart),
        0,
        1
      );


    platformsLabel.style.opacity =
      platformsOpacity;

    platformsLabel.style.transform =
      `translate(-50%, -50%)`;


    /* ==================================================
       4. PLATFORM ICONS + LABELS
    ================================================== */

    const iconStart = 0.19;
    const iconStep = 0.035;
    const iconDuration = 0.05;


    platformIcons.forEach(
      (icon, index) => {

        const start =
          iconStart +
          index * iconStep;

        const end =
          start +
          iconDuration;


        const iconProgress =
          clamp(
            (progress - start) /
            (end - start),
            0,
            1
          );


        const rotation =
          lerp(
            -90,
            0,
            iconProgress
          );


        const scale =
          0.92 +
          Math.sin(
            iconProgress * Math.PI
          ) * 0.08;


        icon.style.opacity =
          iconProgress;

        icon.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;


        platformNames[index].style.opacity =
          iconProgress;

      }
    );


    /* ==================================================
       5. PLATFORM GROUP
       LABEL + ICONS + LABELS
       CENTER → BEHIND HEADER
       (groupY is calculated at the top)
    ================================================== */

    const platformsLabelHeight =
      platformsLabel.offsetHeight;


    const platformsLabelOffsetY =
      -platformsLabelHeight;


    platformsLabel.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${groupBaseShift + groupY + platformsLabelOffsetY}px)
        )
      `;


    platformsRow.style.transform =
      `
        translate(
          -50%,
          calc(-50% + ${groupBaseShift + groupY}px)
        )
      `;


    /* ==================================================
       6. ONE ASSET
       STARTS COMPLETELY BELOW THE SCREEN
    ================================================== */

    const assetCardHeight =
      assetCard.offsetHeight;

    const assetLabelHeight =
      assetLabel.offsetHeight;


    const assetLabelGap =
      window.innerWidth <= 700
        ? 20
        : 28;


    /*
      Home position of ONE ASSET:
      the stage center, unless the visible part
      of the arrow from the platform group
      (below the header) would be shorter than
      platformArrowMinLength. On short screens
      the card stops lower by exactly the
      missing amount.
    */

    const finalRowBottom =
      rowBottomBase +
      groupUpY;

    const assetLabelHomeTop =
      stageRect.height / 2 -
      assetCardHeight / 2 -
      assetLabelGap -
      assetLabelHeight;

    const assetHomeShift =
      Math.max(
        0,
        finalRowBottom +
        platformArrowGap +
        platformArrowMinLength +
        platformArrowEndGap -
        assetLabelHomeTop
      );


    /*
      Start position: the top of the ONE ASSET label
      (the highest element) is 3px below the bottom
      of the screen, so the arrowhead (24px above
      the label) always stays on screen.
    */

    const assetStartShift =
      stageRect.height / 2 +
      assetCardHeight / 2 +
      assetLabelGap +
      assetLabelHeight +
      3;


    /*
      Entry starts together with the platform
      arrow (0.31) and ends at 0.53.
      Smoothstep: soft start and soft stop.
    */

    const assetMoveStart = 0.31;
    const assetMoveEnd = 0.53;

    const assetMoveProgress =
      clamp(
        (progress - assetMoveStart) /
        (assetMoveEnd - assetMoveStart),
        0,
        1
      );

    const assetMoveEase =
      assetMoveProgress *
      assetMoveProgress *
      (3 - 2 * assetMoveProgress);


    const assetY =
      lerp(
        assetStartShift,
        assetHomeShift,
        assetMoveEase
      );


    if (progress < assetMoveStart) {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetStartShift}px)
          )
        `;

    }

    else {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetY}px)
          )
        `;

    }


    const assetVisibilityStart = 0.31;
    const assetVisibilityEnd = 0.38;

    const assetVisibility =
      clamp(
        (progress - assetVisibilityStart) /
        (assetVisibilityEnd - assetVisibilityStart),
        0,
        1
      );


    assetCard.style.opacity =
      assetVisibility;


    /* ==================================================
       7. ARROW
       PLATFORM GROUP → ONE ASSET
    ================================================== */

    /*
      Starts right after the last platform icon
      has appeared (0.19 + 2 × 0.035 + 0.05 = 0.31).
    */

    const platformArrowStart = 0.31;

    const platformArrowDuration =
      (0.51 - 0.38) / 1.5;

    const platformArrowEnd =
      platformArrowStart +
      platformArrowDuration;

    const platformArrowProgress =
      clamp(
        (progress - platformArrowStart) /
        (platformArrowEnd - platformArrowStart),
        0,
        1
      );


    const rowRect =
      platformsRow.getBoundingClientRect();

    const rowBottom =
      rowRect.bottom -
      stageRect.top;


    const assetLabelRect =
      assetLabel.getBoundingClientRect();

    const assetLabelTop =
      assetLabelRect.top -
      stageRect.top;


    const platformArrowStartY =
      rowBottom +
      platformArrowGap;


    const platformArrowEndY =
      assetLabelTop -
      platformArrowEndGap;


    const platformArrowLength =
      Math.max(
        0,
        platformArrowEndY -
        platformArrowStartY
      );


    platformArrow.style.top =
      `${platformArrowStartY}px`;

    platformArrow.style.height =
      `${platformArrowLength * platformArrowProgress}px`;

    /*
      Fades out right before ONE ASSET stops
      (0.51 → 0.53). Invisible during the pause.
      The tail is hidden behind the header from
      groupMoveEnd (0.46), before the fade starts.
    */

    const platformArrowFadeStart = 0.51;

    const platformArrowFade =
      clamp(
        (assetMoveEnd - progress) /
        (assetMoveEnd - platformArrowFadeStart),
        0,
        1
      );

    platformArrow.style.opacity =
      platformArrowProgress > 0 &&
      platformArrowLength > 0
        ? platformArrowFade
        : 0;


    /* ==================================================
       8. ONE ASSET → MULTIPLE REPRESENTATIONS
       EXISTING LOWER MECHANICS
    ================================================== */

    const cardStart = 0.56;
    const cardEnd = 0.66;

    const cardProgress =
      clamp(
        (progress - cardStart) /
        (cardEnd - cardStart),
        0,
        1
      );


    const cardTravel =
      window.innerHeight * 0.82;


    const cardY =
      -cardProgress *
      cardTravel;


    /*
      Before cardStart the card is driven by
      block 6 (entry from below). Both blocks
      share assetHomeShift, so there is no jump
      at cardStart.
    */

    if (progress >= cardStart) {

      assetCard.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${assetHomeShift + cardY}px)
          )
        `;

    }


    /* ==================================================
       9. MULTIPLE REPRESENTATIONS LABEL
    ================================================== */

    /*
      Fades in while the label comes out from
      under the bottom edge of the screen.
    */

    const labelAppearStart = 0.56;
    const labelAppearEnd = 0.59;

    const labelOpacity =
      clamp(
        (progress - labelAppearStart) /
        (labelAppearEnd - labelAppearStart),
        0,
        1
      );


    const labelMoveStart = 0.76;
    const labelMoveEnd = 0.80;

    const labelMoveProgress =
      clamp(
        (progress - labelMoveStart) /
        (labelMoveEnd - labelMoveStart),
        0,
        1
      );


    const labelHeight =
      multipleLabel.offsetHeight;


    const finalLabelTop =
      headerRect.bottom +
      headerGap;

    const finalLabelCenter =
      finalLabelTop +
      labelHeight / 2;


    const labelTravel =
      centerY -
      finalLabelCenter;


    /*
      Entry from below: starts together with the
      ONE ASSET exit (cardStart, 0.56), the top of
      the label starts 3px below the bottom of the
      screen and stops in the center at 0.66.
      Smoothstep: soft start and soft stop.
    */

    const labelEntryStart = cardStart;
    const labelEntryEnd = 0.66;

    const labelEntryProgress =
      clamp(
        (progress - labelEntryStart) /
        (labelEntryEnd - labelEntryStart),
        0,
        1
      );

    const labelEntryEase =
      labelEntryProgress *
      labelEntryProgress *
      (3 - 2 * labelEntryProgress);

    const labelEntryShift =
      window.innerHeight +
      3 -
      (centerY - labelHeight / 2);

    const labelEntryY =
      lerp(
        labelEntryShift,
        0,
        labelEntryEase
      );


    /* TOOLS step 1: the label leaves under the header */
    const labelLeaveY =
      toolsLeave *
      (finalLabelTop + labelHeight + 20);

    const labelY =
      labelEntryY -
      labelMoveProgress *
      labelTravel -
      labelLeaveY;


    multipleLabel.style.opacity =
      labelOpacity;


    if (window.innerWidth <= 700) {

      const mobileStartTop =
        centerY -
        labelHeight / 2;

      const mobileTop =
        lerp(
          mobileStartTop,
          finalLabelTop,
          labelMoveProgress
        );

      multipleLabel.style.top =
        `${mobileTop + labelEntryY - labelLeaveY}px`;

      multipleLabel.style.transform =
        `translateX(-50%)`;

    }

    else {

      multipleLabel.style.top =
        `50%`;

      multipleLabel.style.transform =
        `
          translate(
            -50%,
            calc(-50% + ${labelY}px)
          )
        `;

    }


    /* ==================================================
       10. LOWER ARROW
    ================================================== */

    const arrowStart = 0.56;
    const arrowEnd = 0.66;

    const arrowProgress =
      clamp(
        (progress - arrowStart) /
        (arrowEnd - arrowStart),
        0,
        1
      );


    const cardRect =
      assetCard.getBoundingClientRect();


    const cardBottom =
      cardRect.bottom -
      stageRect.top;


    const arrowLabelGap =
      24;


    const labelRect =
      multipleLabel.getBoundingClientRect();


    /*
      The tail stays on the bottom of the card.
      The head follows the label entering from
      below: the arrow covers arrowProgress of the
      distance from the card bottom to 24px above
      the label, so it never touches the label and
      reaches it at arrowEnd. From labelMoveStart
      the length stays the same and the arrow
      moves up with the label until labelMoveEnd.
    */

    const restingLabelTop =
      centerY -
      labelHeight / 2;

    const arrowTargetTop =
      progress < labelMoveStart
        ? labelRect.top - stageRect.top
        : restingLabelTop;


    const restingArrowLength =
      Math.max(
        0,
        arrowTargetTop -
        arrowLabelGap -
        cardBottom
      ) *
      arrowProgress;


    arrowSystem.style.opacity =
      progress >= arrowStart &&
      progress < labelMoveEnd
        ? 1
        : 0;


    if (progress < labelMoveStart) {

      arrowSystem.style.top =
        `${cardBottom}px`;

      arrowSystem.style.height =
        `${restingArrowLength}px`;

    }

    else {

      const currentLabelTop =
        labelRect.top -
        stageRect.top;

      const arrowTop =
        currentLabelTop -
        arrowLabelGap -
        restingArrowLength;


      arrowSystem.style.top =
        `${arrowTop}px`;

      arrowSystem.style.height =
        `${restingArrowLength}px`;

    }


    arrowSystem.style.transform =
      `translateX(-50%)`;


    /* ==================================================
       11. REPRESENTATIONS
    ================================================== */

    const representationStart = 0.80;
    const representationEnd = 0.96;


    const representationProgress =
      clamp(
        (progress - representationStart) /
        (representationEnd - representationStart),
        0,
        1
      );


    /* TOOLS step 1: the picture leaves under the header */
    representation.style.transform =
      `
        translate(
          -50%,
          calc(-50% - ${toolsLeave * (representation.offsetTop + representation.offsetHeight / 2 + 20)}px)
        )
      `;


    if (progress >= representationStart) {

      representation.style.opacity = 1;


      const count =
        representations.length;


      if (progress < representationEnd) {

        const firstFiveCount =
          count - 1;

        const firstFiveProgress =
          representationProgress *
          firstFiveCount;

        const index =
          Math.min(
            firstFiveCount - 1,
            Math.floor(firstFiveProgress)
          );

        const localProgress =
          firstFiveProgress -
          index;

        const current =
          representations[index];


        representationImage.src =
          current.src;

        representationImage.alt =
          `${current.platform} ${current.type}`;

        representationPlatform.textContent =
          current.platform;

        representationType.textContent =
          current.type;


        const rotation =
          lerp(
            -90,
            90,
            localProgress
          );


        const scale =
          0.92 +
          Math.sin(
            localProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

      else {

        const finalProgress =
          clamp(
            (progress - representationEnd) /
            (1 - representationEnd),
            0,
            1
          );


        const current =
          representations[count - 1];


        representationImage.src =
          current.src;

        representationImage.alt =
          `${current.platform} ${current.type}`;

        representationPlatform.textContent =
          current.platform;

        representationType.textContent =
          current.type;


        const rotation =
          lerp(
            -90,
            0,
            finalProgress
          );


        const scale =
          0.92 +
          Math.sin(
            finalProgress * Math.PI
          ) * 0.08;


        representationVisual.style.transform =
          `
            perspective(1200px)
            rotateY(${rotation}deg)
            scale(${scale})
          `;

      }

    }

    else {

      representation.style.opacity = 0;

    }


    /* ==================================================
       12. TOOLS
    ================================================== */

    updateTools(toolsTime);


    requestAnimationFrame(
      updateAnimation
    );

  }


  /* ==================================================
     TOOLS: cloud of labels + description window
  ================================================== */

  const toolsLabel =
    document.getElementById("toolsLabel");

  const toolsCloud =
    document.getElementById("toolsCloud");

  const toolPopup =
    document.getElementById("toolPopup");

  const toolPopupIcon =
    document.getElementById("toolPopupIcon");

  const toolPopupText =
    document.getElementById("toolPopupText");


  /* the buttons, one per tool */
  const toolButtons =
    TOOLS.map(
      (tool, index) => {

        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "tool-label";
        button.textContent = tool.label;
        button.setAttribute("aria-expanded", "false");
        button.setAttribute("aria-controls", "toolPopup");

        button.addEventListener(
          "click",
          () => toggleToolPopup(index)
        );

        toolsCloud.appendChild(button);

        return button;

      }
    );


  /*
    Rest layout for the current screen: TOOLS in the centre,
    every label with its distance and angle around it.
    Computed after the font is ready and on resize.
  */
  let toolsLayout = null;


  /* small fixed-seed random generator (same numbers every time) */
  function seededRandom(seed) {

    let a = seed >>> 0;

    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  }


  /*
    Where a label is at swirl time t (0…1 of the rest).
    Positions live in "flattened" space where the free space
    is a circle, so the orbits are ovals like the cloud.
      angle: turns around TOOLS, inner labels a bit faster
      radius: breathes in and out a little
  */
  function swirlPoint(item, layout, t) {

    const swirl = layout.swirl;
    const radians = swirl.angle * Math.PI / 180;

    const faster =
      1 + swirl.speedDiff * (1 - Math.min(1, item.r0 / 1.2));

    const angle = item.a0 + radians * t * faster;
    const radius = item.r0 * (1 + swirl.breathe * Math.sin(2 * Math.PI * t + item.a0));

    return {
      x: layout.cx + Math.cos(angle) * radius * layout.ax,
      y: layout.cy + Math.sin(angle) * radius * layout.ay
    };

  }


  function layoutTools() {

    const width = window.innerWidth;
    const height = window.innerHeight;
    const mobile = width <= 700;

    const { gap, margin, seed } = TOOLS_SETTINGS;
    const cloud = mobile ? TOOLS_SETTINGS.cloudMobile : TOOLS_SETTINGS.cloud;

    /* the same size as the captions under the pictures */
    const caption =
      getComputedStyle(document.querySelector(".representation-info"));

    toolButtons.forEach(
      (button) => {
        button.style.fontSize = caption.fontSize;
        button.style.letterSpacing = caption.letterSpacing;
      }
    );

    const headerBottom =
      document.querySelector("header").getBoundingClientRect().bottom;

    /* TOOLS rests in the centre of the screen */
    const titleW = toolsLabel.offsetWidth;
    const titleH = toolsLabel.offsetHeight;

    const base = {
      cx: width / 2,
      cy: height / 2,
      ax: width / 2 - margin,
      ay: height / 2 - margin - headerBottom / 2
    };

    const area = {
      left: margin,
      right: width - margin,
      top: headerBottom + margin,
      bottom: height - margin
    };

    const title = {
      left: base.cx - titleW / 2 - gap,
      right: base.cx + titleW / 2 + gap,
      top: base.cy - titleH / 2 - gap,
      bottom: base.cy + titleH / 2 + gap
    };

    const sizes =
      toolButtons.map((b) => ({ w: b.offsetWidth, h: b.offsetHeight }));

    /* the uneven, tilted, shifted oval */
    const tilt = cloud.tilt * Math.PI / 180;

    const insideCloud = (u, v) => {
      const p = u - cloud.shift.x;
      const q = v - cloud.shift.y;
      const pr = p * Math.cos(-tilt) - q * Math.sin(-tilt);
      const qr = p * Math.sin(-tilt) + q * Math.cos(-tilt);
      const rho = Math.hypot(pr / cloud.size.x, qr / cloud.size.y);
      const phi = Math.atan2(qr, pr);
      const edge = 1 + cloud.wobble[0] * Math.sin(2 * phi + 1.3) + cloud.wobble[1] * Math.sin(3 * phi + 4.1);
      return rho <= edge;
    };

    const times = [];
    for (let k = 0; k <= 100; k++) {
      times.push(k / 100);
    }

    const tryLayout = (swirl) => {

      const layout = { ...base, swirl, items: [] };
      const random = seededRandom(seed);

      /* clump centres: spread around TOOLS on the oval,
         each a bit off its even place (fixed numbers) */
      const clumps = [];
      for (let k = 0; k < cloud.clumps; k++) {
        const angle = (k / cloud.clumps) * 2 * Math.PI + (random() - 0.5) * 0.9;
        const radius = 0.45 + random() * 0.3;
        const p = Math.cos(angle) * radius * cloud.size.x;
        const q = Math.sin(angle) * radius * cloud.size.y;
        clumps.push({
          u: cloud.shift.x + p * Math.cos(tilt) - q * Math.sin(tilt),
          v: cloud.shift.y + p * Math.sin(tilt) + q * Math.cos(tilt)
        });
      }

      /* longest labels first */
      const order =
        sizes.map((s, index) => ({ index, ...s }))
          .sort((a, b) => b.w - a.w || a.index - b.index);

      const placed = [];

      for (const entry of order) {

        const clump = clumps[entry.index % clumps.length];
        const item = { index: entry.index, w: entry.w, h: entry.h, r0: 0, a0: 0, path: null };
        let found = false;

        for (let attempt = 0; attempt < 2500 && !found; attempt++) {

          const spread = cloud.clumpSpread * (1 + attempt / 600);
          const u = clump.u + (random() + random() + random() - 1.5) / 1.5 * spread;
          const v = clump.v + (random() + random() + random() - 1.5) / 1.5 * spread;

          if (!insideCloud(u, v) && attempt < 1500) {
            continue;
          }

          item.r0 = Math.hypot(u, v);
          item.a0 = Math.atan2(v, u);

          /* check the whole swirl, 1 % steps */
          const path = [];
          let ok = true;

          for (let k = 0; k < times.length && ok; k++) {

            const p = swirlPoint(item, layout, times[k]);
            const l = p.x - item.w / 2, r = p.x + item.w / 2;
            const t = p.y - item.h / 2, b = p.y + item.h / 2;

            if (l < area.left || r > area.right || t < area.top || b > area.bottom) {
              ok = false;
              break;
            }

            if (r > title.left && l < title.right && b > title.top && t < title.bottom) {
              ok = false;
              break;
            }

            for (const other of placed) {
              const q = other.path[k];
              if (Math.abs(p.x - q.x) < (item.w + other.w) / 2 + gap &&
                  Math.abs(p.y - q.y) < (item.h + other.h) / 2 + gap) {
                ok = false;
                break;
              }
            }

            path.push(p);

          }

          if (ok) {
            item.path = path;
            found = true;
          }

        }

        if (!found) {
          return { layout: null, failed: TOOLS[entry.index].label };
        }

        placed.push(item);

      }

      layout.items = placed.sort((a, b) => a.index - b.index);
      return { layout, failed: null };

    };

    /* if the labels can not stay apart, calm the swirl down step by step */
    const wanted = mobile ? TOOLS_SETTINGS.swirlMobile : TOOLS_SETTINGS.swirl;
    const steps = [
      { ...wanted },
      { ...wanted, speedDiff: wanted.speedDiff / 2 },
      { ...wanted, speedDiff: 0 },
      { ...wanted, speedDiff: 0, breathe: wanted.breathe / 2 },
      { ...wanted, speedDiff: 0, breathe: 0 }
    ];
    for (let k = 1; k <= 8; k++) {
      steps.push({ ...wanted, speedDiff: 0, breathe: 0, angle: wanted.angle * (1 - k / 8) });
    }

    for (const swirl of steps) {

      const result = tryLayout(swirl);

      if (result.layout) {

        result.layout.relaxed =
          JSON.stringify(swirl) !== JSON.stringify(wanted);

        if (result.layout.relaxed) {
          console.warn("TOOLS: swirl made calmer to keep labels apart:", swirl);
        }

        toolsLayout = result.layout;
        return;

      }

    }

    console.warn("TOOLS: no layout without overlaps on this screen");

  }


  /* recompute the layout on resize, after the size settles */
  let toolsResizeTimer = null;

  window.addEventListener(
    "resize",
    () => {
      clearTimeout(toolsResizeTimer);
      toolsResizeTimer = setTimeout(layoutTools, 150);
    }
  );

  document.fonts.ready.then(layoutTools);


  function updateTools(toolsTime) {

    const phases =
      TOOLS_PHASES.map((h) => h / 6);

    const stepOf = (n) => {
      const start = phases.slice(0, n).reduce((s, p) => s + p, 0);
      return clamp((toolsTime - start) / phases[n], 0, 1);
    };

    const comeIn = smoothstep(stepOf(0));
    const explode = stepOf(1);
    const swirlTime = stepOf(2);
    const leave = smoothstep(stepOf(3));

    const height = window.innerHeight;
    const titleH = toolsLabel.offsetHeight;
    const titleW = toolsLabel.offsetWidth;

    /* how far everything has to go up to be under the header */
    let lowest = height / 2 + titleH / 2;

    if (toolsLayout) {
      toolsLayout.items.forEach(
        (item) => {
          lowest = Math.max(lowest, swirlPoint(item, toolsLayout, swirlTime).y + item.h / 2);
        }
      );
    }

    const leaveY = leave * (lowest + 20);


    /* TOOLS: from below to the centre, stays there, then leaves */
    const titleTop =
      lerp(height + 3, height / 2 - titleH / 2, comeIn) - leaveY;

    toolsLabel.style.top = `${titleTop}px`;
    toolsLabel.style.visibility =
      toolsTime > 0 && leave < 1 ? "visible" : "hidden";


    /* the cloud */
    const cloudOn =
      explode > 0 && leave < 1 && toolsLayout;

    if (!cloudOn) {

      toolButtons.forEach((b) => { b.style.visibility = "hidden"; });

      if (openToolIndex >= 0) {
        closeToolPopup(false);
      }

      return;

    }

    const { flight } = TOOLS_SETTINGS;
    const count = toolButtons.length;

    const titleX = window.innerWidth / 2;
    const titleY = titleTop + titleH / 2;

    toolsLayout.items.forEach(
      (item) => {

        const button = toolButtons[item.index];

        /* fixed, different start for every label */
        const delay =
          ((item.index * 7) % count) / (count - 1) * (1 - flight);

        const fly =
          smoothstep(clamp((explode - delay) / flight, 0, 1));

        const rest = swirlPoint(item, toolsLayout, swirlTime);

        const x = lerp(titleX, rest.x, fly);
        const y = lerp(titleY, rest.y - leaveY, fly);

        const left = x - item.w / 2;
        const top = y - item.h / 2;

        button.style.visibility = fly > 0 ? "visible" : "hidden";
        button.style.transform = `translate(${left}px, ${top}px)`;

        /* while flying out it is hidden behind TOOLS: a hole in
           the label's own coordinates, at least as big as the
           label so nothing sticks out at the start */
        if (fly < 1) {

          const holeW = Math.max(titleW, item.w) / 2;
          const holeH = Math.max(titleH, item.h) / 2;

          const hl = titleX - holeW - left;
          const hr = titleX + holeW - left;
          const ht = titleY - holeH - top;
          const hb = titleY + holeH - top;

          button.style.clipPath =
            `path(evenodd, "M-5000 -5000 H5000 V5000 H-5000 Z M${hl} ${ht} H${hr} V${hb} H${hl} Z")`;

        }
        else {
          button.style.clipPath = "none";
        }

      }
    );

  }


  /* ---------- description window ---------- */

  let openToolIndex = -1;
  let openToolScrollY = 0;


  function toggleToolPopup(index) {

    if (openToolIndex === index) {
      closeToolPopup(true);
      return;
    }

    if (openToolIndex >= 0) {
      closeToolPopup(false);
    }

    const tool = TOOLS[index];
    const button = toolButtons[index];

    toolPopupIcon.src = TOOL_ICONS[tool.platform];
    toolPopupText.textContent = tool.description;
    toolPopupText.style.textTransform =
      TOOLS_SETTINGS.descriptionUppercase ? "uppercase" : "none";

    /* the name is not shown, but screen readers get it */
    toolPopup.setAttribute("aria-label", tool.label);

    toolPopup.hidden = false;
    button.setAttribute("aria-expanded", "true");

    openToolIndex = index;
    openToolScrollY = window.scrollY;

    placeToolPopup(button);

  }


  function placeToolPopup(button) {

    const mobile = window.innerWidth <= 700;

    toolPopup.classList.toggle("is-sheet", mobile);

    if (mobile) {
      toolPopup.style.left = "";
      toolPopup.style.top = "";
      return;
    }

    const edge = 16;
    const rect = button.getBoundingClientRect();
    const box = toolPopup.getBoundingClientRect();

    const headerBottom =
      document.querySelector("header").getBoundingClientRect().bottom;

    let left = rect.left + rect.width / 2 - box.width / 2;
    left = clamp(left, edge, window.innerWidth - box.width - edge);

    /* below the label, or above it if there is no room */
    let top = rect.bottom + 10;

    if (top + box.height > window.innerHeight - edge) {
      top = rect.top - box.height - 10;
    }

    top = clamp(top, headerBottom + 8, window.innerHeight - box.height - edge);

    toolPopup.style.left = `${left}px`;
    toolPopup.style.top = `${top}px`;

  }


  function closeToolPopup(returnFocus) {

    if (openToolIndex < 0) {
      return;
    }

    const button = toolButtons[openToolIndex];

    toolPopup.hidden = true;
    button.setAttribute("aria-expanded", "false");
    openToolIndex = -1;

    if (returnFocus) {
      button.focus({ preventScroll: true });
    }

  }


  /* Esc closes */
  document.addEventListener(
    "keydown",
    (event) => {
      if (event.key === "Escape" && openToolIndex >= 0) {
        closeToolPopup(true);
      }
    }
  );

  /* a click outside the window (and outside its label) closes */
  document.addEventListener(
    "pointerdown",
    (event) => {

      if (openToolIndex < 0) {
        return;
      }

      const button = toolButtons[openToolIndex];

      if (toolPopup.contains(event.target) || button.contains(event.target)) {
        return;
      }

      closeToolPopup(false);

      /* the browser moves focus to the clicked spot after this
         event; give it back to the label unless the click went
         to something that takes focus itself */
      setTimeout(
        () => {
          if (!document.activeElement || document.activeElement === document.body) {
            button.focus({ preventScroll: true });
          }
        },
        0
      );

    }
  );

  /* scrolling moves the cloud, so the window closes */
  window.addEventListener(
    "scroll",
    () => {
      if (openToolIndex >= 0 &&
          Math.abs(window.scrollY - openToolScrollY) > TOOLS_SETTINGS.closeOnScroll) {
        closeToolPopup(true);
      }
    },
    { passive: true }
  );


  updateAnimation();

</script>


</body>
</html>
